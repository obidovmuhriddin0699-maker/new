<canvas id="c" width="1080" height="1920"></canvas>

<script>
// ADUZ — 15-qism: "Ochiq haqiqat (Reyting tizimi)" (7-qism uslubida)
// Problem: an admin sends "proof" screenshots (50 000 views, 340 orders, a 5-star review). A magnifying lens slides
// over them and shows what is really underneath (4 200, 3 orders, a bot account). At the vacuum the frame cracks like
// glass and holds; transition: the glass shatters (shatter). Solution: a channel profile with a rating built only from
// verified orders and real reviews (including an honest 3-star one). Sound: CUES_15 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Admin «isbot» yuboradi: 50 000 koʻrish, 340 ta buyurtma...'],
  [4.6, 9.4, 'Lekin skrinshotni tahrirlash — bir daqiqalik ish.'],
  [9.6, 10.6, '...ishonch sinadi.'],
  [11.4, 16.2, 'ADUZʼda reyting ochiq: baho faqat haqiqiy buyurtmadan keyin.'],
  [16.4, 21.6, 'Sharhlarni haqiqiy mijozlar yozadi — tahrirlab boʻlmaydi.'],
  [22.4, 27.0, 'Ishonch — skrinshotda emas, ochiq reytingda.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];

function star(x, y, r, fill, frac = 1, empty = 'rgba(148,163,184,.35)') {
  const path = () => { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr_ = k % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_); } ctx.closePath(); };
  path(); ctx.fillStyle = empty; ctx.fill();
  if (frac <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(x - r, y - r, 2 * r * frac, 2 * r); ctx.clip(); path(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'star') star(0, 0, 28, col, 1, 'rgba(0,0,0,0)');
  else if (kind === 'verified') { shield(0, 0, .95, col); check(1, 2, 21, 'rgba(0,0,0,.35)', 5); }
  else if (kind === 'eye') { ctx.beginPath(); ctx.moveTo(-28, 0); ctx.quadraticCurveTo(0, -24, 28, 0); ctx.quadraticCurveTo(0, 24, -28, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill(); }
  ctx.restore();
}

// ---------- SCENE 1 — Muammo: fake proofs under a lens ----------
const SC1 = { x: SX + 30, y: SY + 270, w: 560, h: 330 }, SC2 = { x: SX + 30, y: SY + 620, w: 560, h: 330 };
const LENS = [[4.3, W + 160, 700], [5.0, SX + 200, SC1.y + 175], [6.3, SX + 215, SC1.y + 185], [6.6, SX + 250, SC2.y + 150], [7.3, SX + 265, SC2.y + 150], [7.6, SX + 250, SC2.y + 265], [8.3, SX + 270, SC2.y + 268], [8.7, -160, 1400]];
const CRACK = 9.5;
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46], [CRACK, 30]];
function redBox(x, y, w, h, label) {
  ctx.save(); ctx.setLineDash([10, 7]); ctx.lineWidth = 4; ctx.strokeStyle = C.red; rr(x, y, w, h, 10); ctx.stroke(); ctx.restore();
  if (label) { ctx.font = `900 18px ${F}`; const tw = ctx.measureText(label).width; rr(x + w - tw - 24, y - 16, tw + 20, 30, 8); ctx.fillStyle = C.red; ctx.fill(); text(label, x + w - 14, y + 6, 18, '#fff', 900, 'right'); }
}
function shot(t, at, b, real, kind) {
  const p = prog(t, at, at + .35); if (p <= 0) return;
  withAlpha(p, () => scaled(b.x, b.y + b.h, lerp(.6, 1, eBack(p)), () => {
    rr(b.x, b.y, b.w, b.h, 24); ctx.fillStyle = '#182533'; ctx.fill();
    rr(b.x + 12, b.y + 12, b.w - 24, b.h - 24, 16); ctx.fillStyle = '#fff'; ctx.fill();
    const x = b.x + 40, y = b.y;
    if (kind === 1) {
      text('Statistika · oxirgi post', x, y + 62, 24, C.grey, 700);
      text(real ? '4 200' : '50 000', x, y + 170, 86, real ? '#b91c1c' : C.ink, 900);
      text('koʻrish', x, y + 214, 26, C.grey, 700);
      const bars = real ? [.3, .25, .32, .28, .22, .3, .26] : [.4, .55, .5, .7, .65, .85, 1];
      bars.forEach((v, i) => { ctx.fillStyle = real ? '#fca5a5' : '#86efac'; rr(x + 300 + i * 30, y + 230 - 150 * v, 20, 150 * v, 5); ctx.fill(); });
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(x, y + 260, b.w - 80, 2);
      text(real ? 'Asl skrinshot · 12-oktabr' : 'Super Kanal UZ · 12-oktabr', x, y + 300, 22, real ? '#b91c1c' : C.grey, 700);
      if (real) redBox(x - 12, y + 92, 290, 96, 'TAHRIRLANGAN');
    } else {
      text('Mijoz natijasi', x, y + 62, 24, C.grey, 700);
      text(real ? '3 ta buyurtma' : '340 ta buyurtma!', x, y + 130, 46, real ? '#b91c1c' : '#059669', 900);
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(x, y + 160, b.w - 80, 2);
      for (let k = 0; k < 5; k++) star(x + 22 + k * 46, y + 205, 20, '#f59e0b', real ? (k < 1 ? 1 : 0) : 1);
      text('«Zoʻr kanal!!! Hammaga tavsiya»', x, y + 262, 25, C.ink, 700);
      text(real ? '— @user8812 · bot · 0 obunachi' : '— @aziza_shop', x, y + 300, 22, real ? '#b91c1c' : C.grey, 700);
      if (real) { redBox(x - 12, y + 88, 340, 58, 'TAHRIRLANGAN'); redBox(x - 12, y + 274, 420, 40, ''); }
    }
  }));
}
function bubble(t, at, x, y, s, w) {
  const p = prog(t, at, at + .3); if (p <= 0) return;
  withAlpha(p, () => scaled(x, y + 76, lerp(.5, 1, eBack(p)), () => { rr(x, y, w, 76, 24); ctx.fillStyle = '#182533'; ctx.fill(); text(s, x + 26, y + 49, 29, '#e9eef3', 500); }));
}
function fakeChat(t, real) {
  ctx.fillStyle = '#0e1621'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150);
  ctx.beginPath(); ctx.arc(SX + 80, SY + 95, 36, 0, 7); ctx.fillStyle = '#db2777'; ctx.fill();
  text('SK', SX + 80, SY + 97, 26, '#fff', 800, 'center', 'middle');
  text('Super Kanal UZ · admin', SX + 135, SY + 88, 30, '#fff', 700);
  text('onlayn', SX + 135, SY + 126, 23, '#4fa3ff', 500);
  bubble(t, .8, SX + 30, SY + 175, 'Kanalimiz eng zoʻri! Mana isbot:', 470);
  shot(t, 1.3, SC1, real, 1);
  shot(t, 2.5, SC2, real, 2);
  bubble(t, 3.6, SX + 30, SY + 975, 'Narxi 800 000. Bugun band qiling!', 500);
}
function scene1(t) {
  const stress = prog(t, 4.6, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr, sx, sy, () => {
    episodeTitle(t, '15-QISM', 'Ochiq haqiqat', 56);
    const exposed = t > 6.4 ? 1 : 0;
    counters(t, [[t > 1.3 ? (t > 6.4 ? '4 200' : '50 000') : '—', 'koʻrish', exposed ? C.red : '#fff'], [t > 2.5 ? (t > 7.4 ? '3' : '340') : '—', 'buyurtma', t > 7.4 ? C.red : '#fff'], [t > 8.3 ? '0' : '?', 'haqiqiy sharh', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#0e1621', 0, lerp(160, 0, enter), 0, () => { fakeChat(t, false); ctx.fillStyle = `rgba(255,40,60,${.05 * stress})`; ctx.fillRect(SX, SY, SW, SH); });
    // the magnifying lens: inside it, the real (unedited) version
    if (t > 4.3 && t < 8.7) {
      const [lx, ly] = pathAt(t, LENS), R = 150;
      ctx.save(); ctx.beginPath(); ctx.arc(lx, ly, R, 0, 7); ctx.clip();
      ctx.beginPath(); ctx.rect(SX, SY, SW, SH); ctx.clip();
      ctx.translate(lx, ly); ctx.scale(1.18, 1.18); ctx.translate(-lx, -ly);
      fakeChat(t, true);
      ctx.restore();
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.moveTo(lx + R * .72, ly + R * .72); ctx.lineTo(lx + R * 1.5, ly + R * 1.5); ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.strokeStyle = '#334155'; ctx.stroke();
      ctx.beginPath(); ctx.arc(lx, ly, R, 0, 7); ctx.lineWidth = 16; ctx.strokeStyle = '#cbd5e1'; ctx.stroke(); ctx.restore();
      withAlpha(.25, () => { ctx.beginPath(); ctx.arc(lx - R * .35, ly - R * .4, R * .25, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); });
    }
  });
  slam(t, 5.6, 'SOXTA SKRIN', 300, 560, 52, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
  slam(t, 6.6, 'KOʻPAYTIRILGAN', 770, 830, 46, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
  slam(t, 7.6, 'BOT SHARH', 330, 1440, 52, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 153, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'SOXTA ISBOT', W / 2, 880, 140, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'skrinshot — isbot emas', W / 2, 1040, 52, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  // the glass cracks and the frame holds (sound vacuum)
  if (t > CRACK) { withAlpha(.35, () => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }); cracks(prog(t, CRACK, CRACK + .35)); }
  flash(t, CRACK, '#ffffff', .25, .2);
}

// ---------- SCENE 2 — Yechim: open rating ----------
const T15 = { score: [12.0, 12.8], bars: [12.4, 13.4], rule: 13.6, rev: [14.2, 14.8, 15.4], stamp: .45, order: 17.0, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T15.order, 8], [T15.slam, 34]];
const DIST = [[5, 72], [4, 18], [3, 6], [2, 2], [1, 2]];
const REVIEWS = [['Dilnoza · Gul doʻkoni', 5, 'Post vaqtida chiqdi, buyurtmalar koʻpaydi.', '#48213'], ['Jasur · Telefonlar', 4, 'Koʻrishlar aytilganidek boʻldi.', '#47920'], ['Malika · Kiyim', 3, 'Yaxshi, lekin javob biroz kechikdi.', '#47755']];
const ORDER = { x: SX + 40, y: SY + SH - 96, w: SW - 80, h: 76 };
function profileScreen(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Kanal profili', SX + 50, SY + 108, 40, '#fff', 900);
  // profile
  rr(SX + 30, SY + 170, SW - 60, 140, 24); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(SX + 105, SY + 240, 46, 0, 7); ctx.fillStyle = '#f97316'; ctx.fill(); text('VL', SX + 105, SY + 242, 30, '#fff', 800, 'center', 'middle');
  text('Vodiy Live', SX + 175, SY + 232, 36, C.ink, 900);
  glyph('verified', SX + 400, SY + 222, .6, '#0ea371');
  text('Fargʻona · 48 200 obunachi', SX + 175, SY + 274, 24, C.grey, 600);
  // rating block
  rr(SX + 30, SY + 330, SW - 60, 230, 24); ctx.fillStyle = '#fff'; ctx.fill();
  const sp = eOut(prog(t, ...T15.score)), score = 4.6 * sp;
  text(score.toFixed(1), SX + 70, SY + 450, 96, C.ink, 900);
  for (let k = 0; k < 5; k++) star(SX + 86 + k * 44, SY + 492, 19, '#f59e0b', clamp(score - k));
  text(`${fmt(1248 * sp)} ta baho`, SX + 70, SY + 538, 22, C.grey, 700);
  DIST.forEach(([s, v], i) => {
    const y = SY + 368 + i * 38, bw = 300 * v / 72 * eOut(prog(t, T15.bars[0] + i * .12, T15.bars[0] + .5 + i * .12));
    text(`${s}`, SX + 340, y + 22, 22, '#334155', 800);
    star(SX + 370, y + 14, 10, '#f59e0b');
    rr(SX + 392, y + 4, 300, 20, 10); ctx.fillStyle = '#f1f5f9'; ctx.fill();
    if (bw > 0) { rr(SX + 392, y + 4, Math.max(20, bw), 20, 10); ctx.fillStyle = '#f59e0b'; ctx.fill(); }
  });
  // rule strip
  const rp = eBack(prog(t, T15.rule, T15.rule + .35));
  if (rp > 0) scaled(SX + SW / 2, SY + 605, rp, () => {
    rr(SX + 30, SY + 575, SW - 60, 62, 20); ctx.fillStyle = '#ecfdf5'; ctx.fill();
    glyph('verified', SX + 70, SY + 606, .55, '#0ea371');
    text('Baho — faqat buyurtma bergan mijozdan', SX + 105, SY + 615, 25, '#065f46', 800);
  });
  // reviews
  REVIEWS.forEach(([who, st, s, id], i) => {
    const at = T15.rev[i], p = eOut(prog(t, at, at + .35)); if (p <= 0) return;
    const y = SY + 655 + i * 128 + 30 * (1 - p);
    withAlpha(p, () => {
      rr(SX + 30, y, SW - 60, 116, 20); ctx.fillStyle = '#fff'; ctx.fill();
      text(who, SX + 55, y + 38, 24, C.ink, 800);
      for (let k = 0; k < 5; k++) star(SX + SW - 190 + k * 30, y + 30, 12, '#f59e0b', k < st ? 1 : 0);
      text(s, SX + 55, y + 74, 23, '#334155', 600);
      const sp_ = eBack(prog(t, at + T15.stamp, at + T15.stamp + .3));
      if (sp_ > 0) scaled(SX + 200, y + 98, sp_, () => { check(SX + 66, y + 99, 11, '#059669', 3.5); text(`Tasdiqlangan buyurtma ${id}`, SX + 84, y + 106, 19, '#059669', 800); });
    });
  });
  scaled(ORDER.x + ORDER.w / 2, ORDER.y + 38, 1 - .05 * bump(t, T15.order, .25), () => {
    rr(ORDER.x, ORDER.y, ORDER.w, ORDER.h, 38); ctx.fillStyle = t > T15.order ? '#065f46' : '#0ea371'; ctx.fill();
    text(t > T15.order ? 'Ishonch bilan buyurtma ✓' : 'Buyurtma berish', ORDER.x + ORDER.w / 2, ORDER.y + 49, 30, '#fff', 900, 'center');
  });
  const mp = eOut(prog(t, T15.sheet, T15.sheet + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T15.sheet + .2, T15.sheet + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T15.sheet + .45, T15.sheet + .8));
    withAlpha(prog(t, T15.sheet + .6, T15.sheet + .9), () => {
      text('Ishonch bilan tanlang!', SX + SW / 2, sy + 300, 44, C.ink, 800, 'center');
      ['Baho — faqat buyurtmadan keyin', 'Raqamlar — ADUZ oʻlchagan', 'Sharhlar — tahrirlanmaydi'].forEach((s, i) =>
        withAlpha(prog(t, T15.sheet + .9 + i * .25, T15.sheet + 1.15 + i * .25), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Ochiq reyting');
    const enter = eBack(prog(t, 11.1, 11.75));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => profileScreen(t))));
    const ox = ORDER.x + ORDER.w / 2 + 150, oy = ORDER.y + 38;
    if (t > 16.2 && t < 17.6) {
      const [cx, cy] = pathAt(t, [[16.2, W - 40, 1750], [T15.order, ox, oy], [17.6, W - 40, 1800]]);
      withAlpha(Math.min(prog(t, 16.2, 16.4), 1 - prog(t, 17.4, 17.6)), () => cursor(cx, cy, bump(t, T15.order, .22)));
    }
    ripple(ox, oy, prog(t, T15.order, T15.order + .6), '#ffffff');
  });
  const dim = prog(t, T15.slam - .05, T15.slam + .1) * (1 - prog(t, T15.sheet - .2, T15.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T15.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T15.slam, W / 2, 880, 157, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T15.slam, 'OCHIQ HAQIQAT', W / 2, 840, 118, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T15.slam + .15, 'har bir baho — haqiqiy buyurtmadan', W / 2, 1010, 46, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T15.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Soxta skrinshot', 'ADUZ statistikasi'], ['Bot sharhlar', 'Tasdiqlangan sharh'], ['Koʻr-koʻrona ishonch', 'Ochiq reyting']];
const IMPACTS3 = [[22.15, 22], [23.2, 8], [25.0, 16]];
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    glyph(kind, bx, by, 1.5);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {
    resultBg(t);
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha(1 - out, () => {
      withAlpha(prog(t, 22.2, 22.6), () => {
        text('NATIJA', W / 2, 190, 34, C.gold, 800, 'center');
        text('Haqiqat — koʻz oldingizda', W / 2, 260, 54, '#fff', 800, 'center');
      });
      for (let k = 0; k < 5; k++) {
        const at = 22.5 + k * .17, p = eBack(prog(t, at, at + .3));
        scaled(W / 2 + (k - 2) * 170, 420, lerp(.4, 1, p), () => withAlpha(prog(t, 22.25, 22.5), () => {
          ctx.save(); if (p > 0) { ctx.shadowColor = 'rgba(255,200,61,.9)'; ctx.shadowBlur = 40; }
          star(W / 2 + (k - 2) * 170, 420, 72, '#ffc83d', p > 0 ? (k < 4 ? 1 : .6) : 0, 'rgba(255,255,255,.25)'); ctx.restore();
        }));
      }
      withAlpha(prog(t, 23.2, 23.5), () => text('4.6 · 1 248 ta haqiqiy baho', W / 2, 580, 44, '#fff', 800, 'center'));
      const cp = eOut(prog(t, 23.0, 23.5)), x = 90, y = lerp(760, 700, cp), w = 900, h = 450;
      withAlpha(cp, () => {
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
        rr(x, y, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
        text('Oldin', x + 60, y + 72, 30, C.grey, 800);
        rr(x + 470, y + 38, 200, 50, 25); ctx.fillStyle = '#d1fae5'; ctx.fill();
        text('ADUZ', x + 570, y + 72, 30, '#065f46', 900, 'center');
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + w / 2 - 20, y + 110, 2, h - 140);
        CMP.forEach(([a, b], i) => {
          const ry = y + 175 + i * 105, st = eInOut(prog(t, 23.5 + i * .35, 23.8 + i * .35)), ok = eBack(prog(t, 23.7 + i * .35, 24.0 + i * .35));
          text(a, x + 60, ry, 28, st > 0 ? '#94a3b8' : '#334155', 700);
          if (st > 0) { ctx.font = `700 28px ${F}`; const tw = ctx.measureText(a).width; ctx.beginPath(); ctx.moveTo(x + 55, ry - 10); ctx.lineTo(x + 55 + (tw + 10) * st, ry - 10); ctx.lineWidth = 5; ctx.strokeStyle = C.red; ctx.stroke(); }
          if (ok > 0) scaled(x + 470, ry - 10, ok, () => {
            ctx.beginPath(); ctx.arc(x + 490, ry - 10, 20, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(x + 490, ry - 9, 18, '#fff', 5);
            text(b, x + 525, ry, 28, '#059669', 900);
          });
        });
      });
