<script>
// ADUZ — 14-qism: "Vaqt mashinasi (Rejalashtirish)" (7-qism uslubida)
// Problem: night posts mean night alarms — 23:00, 01:00, 06:30. You snooze, your eyelids droop (POV lids over the
// frame), the admin cancels the late post; at the end the eyes close (sound vacuum). Transition: waking up (eyelidOpen).
// Solution: pick a day and a time on a drum picker, queue three posts, then a night time-lapse — each post goes out
// on its own while you sleep. Sound: CUES_14 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Tungi post — tungi budilnik. 23:00... yana besh daqiqa...'],
  [4.6, 9.4, 'Kechikdingiz — post bekor. 01:00 da yana, 06:30 da yana.'],
  [9.6, 10.4, '...uyqu ham, reklama ham yoʻq.'],
  [11.4, 16.2, 'ADUZʼda kun va soatni tanlaysiz — postlar navbatga turadi.'],
  [16.4, 21.6, 'Siz uxlaysiz — taymer har birini oʻz vaqtida joylaydi.'],
  [22.4, 27.0, 'Vaqtingiz — sizniki, reklama — oʻz vaqtida.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];

function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'clock') { ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 0); ctx.lineTo(10, 8); ctx.stroke(); }
  else if (kind === 'cal') { rr(-24, -20, 48, 44, 6); ctx.stroke(); ctx.fillRect(-24, -20, 48, 12); for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) ctx.fillRect(-15 + i * 12, 0 + j * 11, 7, 7); ctx.beginPath(); ctx.moveTo(-12, -28); ctx.lineTo(-12, -16); ctx.moveTo(12, -28); ctx.lineTo(12, -16); ctx.stroke(); }
  else if (kind === 'moon') { ctx.beginPath(); ctx.arc(0, 0, 24, .9, 2 * Math.PI - .9 + 2 * Math.PI, false); ctx.arc(12, -6, 20, 2 * Math.PI - 1.15, 1.15, true); ctx.closePath(); ctx.fill(); }
  else if (kind === 'sun') { ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 19, Math.sin(a) * 19); ctx.lineTo(Math.cos(a) * 27, Math.sin(a) * 27); ctx.stroke(); } }
  else if (kind === 'bell') { ctx.beginPath(); ctx.moveTo(-22, 14); ctx.quadraticCurveTo(-18, 10, -18, -4); ctx.quadraticCurveTo(-16, -24, 0, -24); ctx.quadraticCurveTo(16, -24, 18, -4); ctx.quadraticCurveTo(18, 10, 22, 14); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0, 19, 6, 0, 7); ctx.fill(); }
  ctx.restore();
}
const hhmm = mins => { const m = ((Math.round(mins) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const curve = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], clamp((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0]))); return keys[keys.length - 1][1]; };

// ---------- SCENE 1 — Muammo: night alarms ----------
const CLOCK1 = [[0, 1378], [2.0, 1380], [3.1, 1380], [4.4, 1387], [6.3, 1388], [6.6, 1500], [7.35, 1501], [7.6, 1830], [9.4, 1832]];
const ALARMS = [['23:00', 'Vodiy Live'], ['01:00', 'Fargʻona Style'], ['06:30', 'Margʻilon Bozor']];
const RING = [[2.0, 0, 3.05], [6.6, 1, 7.35], [7.6, 2, 8.35]];   // [start, alarm, end]
const SNOOZE = 3.0, LATE = 4.6;
const LIDS1 = [[0, 1], [3.2, 1], [4.3, .5], [4.55, .5], [4.75, 1], [5.0, 1], [6.4, .55], [6.65, 1], [7.2, .6], [7.65, 1], [9.15, 1], [9.5, 0]];
const IMPACTS1 = [[LATE, 8], [5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const SNZ = { x: SX + 50, y: SY + SH - 230, w: 300, h: 96 };
function lockScreen(t) {
  const g = ctx.createLinearGradient(0, SY, 0, SY + SH); g.addColorStop(0, '#0b1020'); g.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = g; ctx.fillRect(SX, SY, SW, SH);
  glyph('moon', SX + SW / 2, SY + 90, 1, '#c7d2fe');
  text(hhmm(curve(t, CLOCK1)), SX + SW / 2, SY + 320, 150, '#e0e7ff', 300, 'center');
  text('Seshanba', SX + SW / 2, SY + 372, 30, '#a5b4fc', 600, 'center');
  ALARMS.forEach(([tm, s], i) => {
    const y = SY + 430 + i * 132, late = i === 0 && t > LATE, ring = RING.find(([a, k, b]) => k === i && t >= a && t < b);
    rr(SX + 30, y, SW - 60, 112, 26); ctx.fillStyle = late ? '#3f1d2b' : ring ? '#312e81' : 'rgba(255,255,255,.07)'; ctx.fill();
    glyph('bell', SX + 80, y + 56, .8, late ? '#fca5a5' : '#a5b4fc');
    text(tm, SX + 125, y + 66, 44, late ? '#fca5a5' : '#fff', 800);
    text(s, SX + 265, y + 66, 26, '#a5b4fc', 700);
    if (late) { rr(SX + SW - 190, y + 36, 140, 42, 21); ctx.fillStyle = C.red; ctx.fill(); text('Kechikdi', SX + SW - 120, y + 65, 22, '#fff', 800, 'center'); }
    else { rr(SX + SW - 120, y + 38, 70, 38, 19); ctx.fillStyle = '#6366f1'; ctx.fill(); ctx.beginPath(); ctx.arc(SX + SW - 69, y + 57, 15, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }
  });
  // ringing alarm sheet
  for (const [a, k, b] of RING) {
    const p = eOut(prog(t, a, a + .25)) * (1 - eIn(prog(t, b - .2, b))); if (p <= 0) continue;
    const y = lerp(SY + SH, SY + SH - 560, p);
    rr(SX + 10, y, SW - 20, 600, 44); ctx.fillStyle = '#4338ca'; ctx.fill();
    const wob = Math.sin(t * 40) * .25 * (t < b - .2);
    ctx.save(); ctx.translate(SX + SW / 2, y + 110); ctx.rotate(wob); glyph('bell', 0, 0, 2, '#fff'); ctx.restore();
    text(`${ALARMS[k][0]} · Postni joylang!`, SX + SW / 2, y + 230, 40, '#fff', 900, 'center');
    text(`${ALARMS[k][1]} — reklama posti`, SX + SW / 2, y + 278, 26, '#c7d2fe', 600, 'center');
    scaled(SNZ.x + SNZ.w / 2, y + 378, 1 - .06 * bump(t, SNOOZE, .25) * (k === 0), () => { rr(SNZ.x, y + 330, SNZ.w, SNZ.h, 48); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill(); text('Kechiktirish', SNZ.x + SNZ.w / 2, y + 388, 30, '#fff', 800, 'center'); });
    rr(SX + SW - 50 - 300, y + 330, 300, 96, 48); ctx.fillStyle = '#fff'; ctx.fill(); text('Toʻxtatish', SX + SW - 200, y + 388, 30, '#4338ca', 900, 'center');
  }
  // admin notification: the late post is cancelled
  const np = eBack(prog(t, LATE, LATE + .35)) * (1 - eIn(prog(t, 6.2, 6.5)));
  if (np > 0) {
    const y = lerp(SY - 200, SY + 20, np);
    rr(SX + 20, y, SW - 40, 150, 30); ctx.fillStyle = '#f8fafc'; ctx.fill();
    ctx.beginPath(); ctx.arc(SX + 80, y + 75, 32, 0, 7); ctx.fillStyle = '#f97316'; ctx.fill(); text('VL', SX + 80, y + 77, 22, '#fff', 800, 'center', 'middle');
    text('Vodiy Live · admin', SX + 130, y + 60, 25, C.ink, 800); text('23:07', SX + SW - 50, y + 60, 22, C.grey, 600, 'right');
    text('Vaqt oʻtdi — post bekor qilindi.', SX + 130, y + 104, 26, '#b91c1c', 700);
  }
}
function scene1(t) {
  const stress = prog(t, 4.6, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr, sx, sy, () => {
    episodeTitle(t, '14-QISM', 'Vaqt mashinasi', 56);
    counters(t, [[hhmm(curve(t, CLOCK1)), 'hozir', '#fff'], ['3 ta', 'tungi budilnik', C.red], [t > LATE ? '1' : '0', 'kechikkan post', t > LATE ? C.red : '#fff']]);
    const enter = eOut(prog(t, 0, .7)), ring = RING.find(([a, k, b]) => t >= a && t < b - .2);
    const buzz = ring ? Math.sin(t * 90) * 7 : 0;
    phone('#0b1020', buzz, lerp(160, 0, enter), buzz * .003, () => { lockScreen(t); ctx.fillStyle = `rgba(255,40,60,${.05 * stress})`; ctx.fillRect(SX, SY, SW, SH); });
    if (t > 2.2 && t < 3.4) {
      const sy0 = SY + SH - 560 + 378, [cx, cy] = pathAt(t, [[2.2, 120, 1800], [SNOOZE, SNZ.x + SNZ.w / 2, sy0], [3.4, 60, 1850]]);
      withAlpha(Math.min(prog(t, 2.2, 2.4), 1 - prog(t, 3.2, 3.4)), () => cursor(cx, cy, bump(t, SNOOZE, .22)));
      ripple(SNZ.x + SNZ.w / 2, sy0, prog(t, SNOOZE, SNOOZE + .6), '#ffffff');
    }
  });
  // POV: heavy eyelids
  lids(curve(t, LIDS1));
  slam(t, 5.6, 'TUNGI 23:00', 300, 560, 52, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
  slam(t, 6.6, '01:00 — YANA', 780, 830, 50, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
  slam(t, 7.6, '06:30 — YANA', 320, 1440, 52, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 143, [C.red, '#c7d2fe', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'UYQUSIZ TUN', W / 2, 880, 140, '#fff', { hold: .75, glow: 'rgba(99,102,241,.9)' });
  slam(t, 8.7, 'har bir post — alohida budilnik', W / 2, 1040, 48, '#c7d2fe', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
}

// ---------- SCENE 2 — Yechim: the schedule + night time-lapse ----------
const T14 = { day: 11.9, spin: [12.2, 13.0], q: [13.15, 13.55, 13.95], plan: 14.6, lapse: [15.2, 17.7], fire: [15.8, 16.5, 17.3], slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T14.plan, 10], [T14.slam, 34]];
const LAPSE = [[0, 1379], [15.2, 1379], [15.8, 1380], [16.5, 1500], [17.3, 1830], [17.7, 1860], [99, 1860]];
const QUEUE = [['23:00', 'Vodiy Live'], ['01:00', 'Fargʻona Style'], ['06:30', 'Margʻilon Bozor']];
const DAYS = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
const PLAN = { x: SX + 40, y: SY + SH - 112, w: SW - 80, h: 86 };
const ADD = { x: SX + SW - 200, y: SY + 700, w: 160, h: 52 };
function skyCol(k) { // 0 evening → .5 night → 1 dawn
  const stops = [[0, [14, 163, 113]], [.25, [30, 27, 75]], [.7, [15, 23, 42]], [1, [251, 146, 60]]];
  let i = 0; while (i < stops.length - 2 && k > stops[i + 1][0]) i++;
  const [a, ca] = stops[i], [b, cb] = stops[i + 1], u = clamp((k - a) / (b - a));
  return `rgb(${ca.map((c, j) => Math.round(lerp(c, cb[j], u))).join(',')})`;
}
function planScreen(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  const lk = prog(t, ...T14.lapse);
  ctx.fillStyle = skyCol(lk); ctx.fillRect(SX, SY, SW, 150);
  if (lk > 0) { const a = Math.PI * (1 - lk), mx = SX + 440 + Math.cos(a) * 110, my = SY + 125 - Math.sin(a) * 70; withAlpha(Math.sin(Math.PI * Math.min(1, lk * 1.05)) + (lk > .9 ? 1 : 0), () => glyph(lk < .85 ? 'moon' : 'sun', mx, my, .7, lk < .85 ? '#e0e7ff' : '#fde68a')); }
  text('Rejalashtirish', SX + 50, SY + 108, 40, '#fff', 900);
  rr(SX + SW - 190, SY + 70, 150, 52, 26); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill();
  text(hhmm(curve(t, LAPSE)), SX + SW - 115, SY + 106, 28, '#fff', 800, 'center');
  // post preview
  rr(SX + 30, SY + 180, SW - 60, 130, 24); ctx.fillStyle = '#fff'; ctx.fill();
  rr(SX + 50, SY + 200, 90, 90, 18); const pg = ctx.createLinearGradient(SX + 50, SY + 200, SX + 140, SY + 290); pg.addColorStop(0, '#f472b6'); pg.addColorStop(1, '#f59e0b'); ctx.fillStyle = pg; ctx.fill();
  text('Yangi kolleksiya — 30% chegirma', SX + 160, SY + 240, 27, C.ink, 800);
  text('1 post · 3 kanal', SX + 160, SY + 278, 23, C.grey, 600);
  // day strip
  DAYS.forEach((d, i) => {
    const x = SX + 40 + i * ((SW - 80) / 7), w = (SW - 80) / 7 - 10, on = i === 1 && t > T14.day;
    scaled(x + w / 2, SY + 380, 1 + .08 * bump(t, T14.day, .2) * (i === 1), () => {
      rr(x, SY + 340, w, 80, 20); ctx.fillStyle = on ? '#0ea371' : '#fff'; ctx.fill();
      text(d, x + w / 2, SY + 376, 24, on ? '#fff' : '#334155', 800, 'center'); text(String(13 + i), x + w / 2, SY + 406, 20, on ? '#d1fae5' : C.grey, 600, 'center');
    });
  });
  // drum time picker
  const val = lerp(19, 23, eInOut(prog(t, ...T14.spin))), base = Math.floor(val), fr = val - base;
  rr(SX + 30, SY + 440, SW - 60, 230, 24); ctx.fillStyle = '#fff'; ctx.fill();
  rr(SX + 50, SY + 520, SW - 100, 70, 16); ctx.fillStyle = '#ecfdf5'; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(SX + 30, SY + 445, SW - 60, 220); ctx.clip();
  for (let k = -2; k <= 2; k++) {
    const h = base + k, y = SY + 555 + (k - fr) * 70, d = Math.abs(k - fr);
    withAlpha(clamp(1 - d * .45), () => text(`${String((h + 24) % 24).padStart(2, '0')} : 00`, SX + SW / 2, y + 16, d < .5 ? 48 : 36, d < .5 ? '#065f46' : '#94a3b8', 900, 'center'));
  }
  ctx.restore();
  // sleeping chip during the lapse
  const zp = eBack(prog(t, T14.lapse[0], T14.lapse[0] + .3)) * (1 - prog(t, T14.lapse[1], T14.lapse[1] + .3));
  if (zp > 0) scaled(SX + SW - 170, SY + 480, zp, () => { rr(SX + SW - 290, SY + 452, 240, 56, 28); ctx.fillStyle = '#312e81'; ctx.fill(); text(`Siz: uxlayapsiz z${'z'.repeat(1 + Math.floor(t * 3) % 3)}`, SX + SW - 170, SY + 488, 23, '#e0e7ff', 800, 'center'); });
  // queue
  text('Navbat', SX + 40, SY + 735, 28, C.ink, 900);
  scaled(ADD.x + ADD.w / 2, ADD.y + 26, 1 - .08 * Math.max(bump(t, T14.q[1], .2), bump(t, T14.q[2], .2)), () => { rr(ADD.x, ADD.y, ADD.w, ADD.h, 26); ctx.fillStyle = '#d1fae5'; ctx.fill(); text('+ Qoʻshish', ADD.x + ADD.w / 2, ADD.y + 35, 23, '#065f46', 800, 'center'); });
  QUEUE.forEach(([tm, ch], i) => {
    const p = eBack(prog(t, T14.q[i], T14.q[i] + .3)); if (p <= 0) return;
    const y = SY + 770 + i * 74, fired = t > T14.fire[i], fp = eBack(prog(t, T14.fire[i], T14.fire[i] + .3));
    scaled(SX + SW / 2, y + 32, p, () => {
      rr(SX + 30, y, SW - 60, 64, 18); ctx.fillStyle = fired ? '#dcfce7' : '#fff'; ctx.fill();
      glyph(i === 2 ? 'sun' : 'moon', SX + 70, y + 32, .6, i === 2 ? '#f59e0b' : '#6366f1');
      text(tm, SX + 105, y + 43, 30, C.ink, 900); text(ch, SX + 210, y + 42, 24, '#334155', 600);
      if (fired) scaled(SX + SW - 120, y + 32, fp, () => { rr(SX + SW - 210, y + 14, 170, 38, 19); ctx.fillStyle = '#16c784'; ctx.fill(); check(SX + SW - 185, y + 33, 11, '#fff', 3.5); text('Chiqdi', SX + SW - 115, y + 41, 21, '#fff', 800, 'center'); });
      else if (t > T14.plan) { rr(SX + SW - 230, y + 14, 190, 38, 19); ctx.fillStyle = '#e0e7ff'; ctx.fill(); glyph('clock', SX + SW - 205, y + 33, .4, '#4338ca'); text('Rejada', SX + SW - 125, y + 41, 21, '#4338ca', 800, 'center'); }
    });
  });
  // timeline under the queue during the lapse
  if (t > T14.plan) {
    const y = SY + 1000, x0 = SX + 50, x1 = SX + SW - 50, pos = clamp((curve(t, LAPSE) - 1379) / (1860 - 1379));
    ctx.fillStyle = '#e2e8f0'; rr(x0, y - 4, x1 - x0, 8, 4); ctx.fill();
    ctx.fillStyle = '#16c784'; rr(x0, y - 4, (x1 - x0) * pos, 8, 4); ctx.fill();
    [1380, 1500, 1830].forEach((mm, i) => { const x = lerp(x0, x1, (mm - 1379) / 481); ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fillStyle = t > T14.fire[i] ? '#16c784' : '#cbd5e1'; ctx.fill(); });
    ctx.beginPath(); ctx.arc(lerp(x0, x1, pos), y, 9, 0, 7); ctx.fillStyle = '#065f46'; ctx.fill();
  }
  const planned = t > T14.plan;
  scaled(PLAN.x + PLAN.w / 2, PLAN.y + 43, 1 - .05 * bump(t, T14.plan, .25), () => {
    rr(PLAN.x, PLAN.y, PLAN.w, PLAN.h, 48); ctx.fillStyle = planned ? '#065f46' : '#0ea371'; ctx.fill();
    if (planned) check(PLAN.x + 110, PLAN.y + 43, 20, '#fff', 6, prog(t, T14.plan, T14.plan + .3)); else glyph('cal', PLAN.x + 110, PLAN.y + 44, .8);
    text(planned ? '3 ta post rejada' : 'Rejalashtirish', PLAN.x + PLAN.w / 2 + 30, PLAN.y + 55, 34, '#fff', 900, 'center');
  });
  const mp = eOut(prog(t, T14.sheet, T14.sheet + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T14.sheet + .2, T14.sheet + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T14.sheet + .45, T14.sheet + .8));
    withAlpha(prog(t, T14.sheet + .6, T14.sheet + .9), () => {
      text('Hammasi oʻz vaqtida chiqdi!', SX + SW / 2, sy + 300, 42, C.ink, 800, 'center');
      ['Kun va soatni tanlaysiz', 'Taymer oʻzi joylaydi', 'Siz — tinch uxlaysiz'].forEach((s, i) =>
        withAlpha(prog(t, T14.sheet + .9 + i * .25, T14.sheet + 1.15 + i * .25), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Avtomatik rejalashtirish');
    const enter = eBack(prog(t, 11.1, 11.75));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => planScreen(t))));
    // big ghost clock behind the phone spins during the time-lapse ("time machine")
    const lk = prog(t, T14.lapse[0] - .2, T14.lapse[1] + .2);
    if (lk > 0 && lk < 1) bigClock(W / 2, PY + PH / 2, 520, curve(t, LAPSE) / 60, 0, '#ffffff', .12 * Math.sin(Math.PI * lk));
    const dayX = SX + 40 + 1 * ((SW - 80) / 7) + ((SW - 80) / 7 - 10) / 2;
    const taps = [[T14.day, dayX, SY + 380], [T14.q[1], ADD.x + ADD.w / 2, ADD.y + 26], [T14.q[2], ADD.x + ADD.w / 2, ADD.y + 26], [T14.plan, PLAN.x + PLAN.w / 2 + 150, PLAN.y + 43]];
    if (t > 11.6 && t < 15.0) {
      const [cx, cy] = pathAt(t, [[11.6, W - 40, 1650], taps[0], [12.2, SX + SW / 2 + 160, SY + 600], [13.0, SX + SW / 2 + 160, SY + 480], taps[1], taps[2], taps[3], [15.0, W - 40, 1700]]);
      const drag = t > 12.2 && t < 13.0 ? .6 : 0;
      withAlpha(Math.min(prog(t, 11.6, 11.8), 1 - prog(t, 14.8, 15.0)), () => cursor(cx, cy, Math.max(drag, ...taps.map(([a]) => bump(t, a, .22)))));
    }
    for (const [a, x, y] of taps) ripple(x, y, prog(t, a, a + .6), '#ffffff');
  });
  const dim = prog(t, T14.slam - .05, T14.slam + .1) * (1 - prog(t, T14.sheet - .2, T14.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T14.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T14.slam, W / 2, 880, 147, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T14.slam, 'AVTOMATIK', W / 2, 840, 140, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T14.slam + .15, 'siz uxlaysiz — post oʻz vaqtida', W / 2, 1010, 50, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T14.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Tunda budilnik', 'Avtomatik taymer'], ['23:07 — kechikdi', 'Aniq 23:00'], ['Uyqusiz tun', 'Tinch uyqu']];
const IMPACTS3 = [[22.15, 22], [23.2, 8], [25.0, 16]];
const MARKS = [[22.5, 23], [22.85, 25], [23.2, 30.5]];   // [time, hour]
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    glyph(kind, bx, by, 1.5);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
function dial(t, cx, cy, R) {
  ctx.save(); ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 50;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(cx + Math.sin(a) * R * .8, cy - Math.cos(a) * R * .8); ctx.lineTo(cx + Math.sin(a) * R * .9, cy - Math.cos(a) * R * .9); ctx.lineWidth = i % 3 ? 4 : 8; ctx.strokeStyle = '#94a3b8'; ctx.lineCap = 'round'; ctx.stroke(); }
  const hr = lerp(22.6, 31, eInOut(prog(t, 22.3, 23.4))), ah = hr / 12 * Math.PI * 2, am = hr * Math.PI * 2;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(ah) * R * .5, cy - Math.cos(ah) * R * .5); ctx.lineWidth = 12; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(am) * R * .72, cy - Math.cos(am) * R * .72); ctx.lineWidth = 7; ctx.strokeStyle = '#334155'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 7); ctx.fillStyle = C.gold; ctx.fill();
  MARKS.forEach(([at, h]) => {
    const p = eBack(prog(t, at, at + .3)); if (p <= 0) return;
    const a = h / 12 * Math.PI * 2, x = cx + Math.sin(a) * (R + 6), y = cy - Math.cos(a) * (R + 6);
    scaled(x, y, p, () => { ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke(); check(x, y + 1, 18, '#fff', 5); });
  });
}
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {
    resultBg(t);
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha(1 - out, () => {
      withAlpha(prog(t, 22.2, 22.6), () => {
        text('NATIJA', W / 2, 190, 34, C.gold, 800, 'center');
        text('Siz uxladingiz — reklama ishladi', W / 2, 260, 50, '#fff', 800, 'center');
      });
      const bp = eBack(prog(t, 22.2, 22.6));
      scaled(W / 2, 480, bp, () => dial(t, W / 2, 480, 160));
      const cp = eOut(prog(t, 23.0, 23.5)), x = 90, y = lerp(760, 700, cp), w = 900, h = 450;
      withAlpha(cp, () => {
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
        rr(x, y, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
        text('Oldin', x + 60, y + 72, 30, C.grey, 800);
        rr(x + 470, y + 38, 200, 50, 25); ctx.fillStyle = '#d1fae5'; ctx.fill();
        text('ADUZ', x + 570, y + 72, 30, '#065f46', 900, 'center');
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + w / 2 - 20, y + 110, 2, h - 140);
        CMP.forEach(([a, b], i) => {
          const ry = y + 175 + i * 105, st = eInOut(prog(t, 23.5 + i * .35, 23.8 + i * .35)), ok = eBack(prog(t, 23.7 + i * .35, 24.0 + i * .35));
          text(a, x + 60, ry, 28, st > 0 ? '#94a3b8' : '#334155', 700);
          if (st > 0) { ctx.font = `700 28px ${F}`; const tw = ctx.measureText(a).width; ctx.beginPath(); ctx.moveTo(x + 55, ry - 10); ctx.lineTo(x + 55 + (tw + 10) * st, ry - 10); ctx.lineWidth = 5; ctx.strokeStyle = C.red; ctx.stroke(); }
          if (ok > 0) scaled(x + 470, ry - 10, ok, () => {
            ctx.beginPath(); ctx.arc(x + 490, ry - 10, 20, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(x + 490, ry - 9, 18, '#fff', 5);
            text(b, x + 525, ry, 28, '#059669', 900);
          });
        });
      });
      [['Taymer', 'clock'], ['Kalendar', 'cal'], ['Tinch uyqu', 'moon']].forEach(([l, k], i) => {
        const p = eBack(prog(t, 25.2 + i * .25, 25.65 + i * .25));
        if (p > 0) badge(230 + i * 310, 1320, l, k, p);
      });
    });
  });
  shockwave(t, 25.0, W / 2, 900, C.gold, 900);
  sparks(t, 23.2, W / 2, 480, 149, [C.gold, '#fff'], 24, 700);
  sparks(t, 25.0, W - 200, 900, 151, [C.gold, '#fff', '#22e39a'], 34, 1100);
  confetti(t, 25.0);
  endCard(t, 27.0);
}
