<script>
// ADUZ — 21-qism: "Raqamli adolat (Arbitraj)" (7-qism uslubi + FX v2; ovoz — sfx/ kutubxonasi)
// Problem: the deal was "24 hours on top"; the clock races and at 2 h 07 min the post is gone ("Bu xabar o'chirildi"),
// another ad takes its place, the admin shrugs, the money is gone. At the vacuum the "deleted" card turns to dust.
// Transition: a judge's gavel strikes and a gold circle opens the solution. Solution: ADUZ watches 24/7 (a bot check
// every 5 minutes), catches the deletion with a timestamped screenshot, the arbitration rules for the buyer, the escrow
// money flows back and the admin's rating drops. Sound: CUES_21 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Kelishuv: post 24 soat tepada turadi. Pul toʻlandi...'],
  [4.6, 9.4, 'Ikki soatdan keyin post oʻchirildi. Admin: «Kanal qoidasi».'],
  [9.6, 10.3, '...vaʼda kuldek sochildi.'],
  [11.4, 16.2, 'ADUZ boti postni 24/7 kuzatadi — buzilish darhol dalil bilan qayd etiladi.'],
  [16.4, 21.6, 'Qaror avtomatik: shart buzilsa — pul sizga qaytadi.'],
  [22.4, 27.0, 'Adolat — raqamli va avtomatik.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'scale') { ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(0, 22); ctx.moveTo(-14, 24); ctx.lineTo(14, 24); ctx.moveTo(-26, -16); ctx.lineTo(26, -16); ctx.stroke(); [-20, 20].forEach(x0 => { ctx.beginPath(); ctx.moveTo(x0, -16); ctx.lineTo(x0 - 9, 4); ctx.lineTo(x0 + 9, 4); ctx.closePath(); ctx.stroke(); }); }
  else if (kind === 'eye') { ctx.beginPath(); ctx.moveTo(-28, 0); ctx.quadraticCurveTo(0, -24, 28, 0); ctx.quadraticCurveTo(0, 24, -28, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill(); }
  else if (kind === 'return') { ctx.beginPath(); ctx.arc(0, 4, 20, -Math.PI * .9, Math.PI * .6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-26, -16); ctx.lineTo(-20, 2); ctx.lineTo(-4, -8); ctx.stroke(); }
  else if (kind === 'camera') { rr(-24, -14, 48, 34, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 3, 9, 0, 7); ctx.stroke(); ctx.fillRect(-10, -20, 14, 6); }
  ctx.restore();
}
function gavel(x, y, ang, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30;
  rr(-14, 0, 28, 330, 12); const g = ctx.createLinearGradient(-14, 0, 14, 0); g.addColorStop(0, '#78350f'); g.addColorStop(1, '#b45309'); ctx.fillStyle = g; ctx.fill();
  rr(-110, -60, 220, 110, 30); const h = ctx.createLinearGradient(0, -60, 0, 50); h.addColorStop(0, '#b45309'); h.addColorStop(1, '#7c2d12'); ctx.fillStyle = h; ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = C.gold; ctx.fillRect(-112, -40, 12, 70); ctx.fillRect(100, -40, 12, 70);
  ctx.restore();
}
// gavel swinging about the end of its handle: head lands on (hx, hy) when swing = 0; swing > 0 raises it
function gavelSwing(hx, hy, swing, s = 1) {
  ctx.save(); ctx.translate(hx + 330 * s, hy); ctx.rotate(swing); ctx.scale(s, s); ctx.translate(-330, 0); ctx.rotate(-Math.PI / 2); gavel(0, 0, 0); ctx.restore();
}
function coin(x, y, r = 30) {
  ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#fbbf24'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r * .78, 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = '#b45309'; ctx.stroke();
  text('S', x, y + 2, r, '#b45309', 900, 'center', 'middle');
}
function adPost(x, y, w, h, deleted, k = 1) {
  rr(x, y, w, h, 24); ctx.fillStyle = deleted ? '#1f2937' : '#182533'; ctx.fill();
  if (deleted) { ctx.save(); ctx.setLineDash([12, 10]); rr(x + 10, y + 10, w - 20, h - 20, 18); ctx.lineWidth = 3; ctx.strokeStyle = '#6b7280'; ctx.stroke(); ctx.restore();
    text('🗑', x + 60, y + h / 2 + 12, 36 * k, '#9ca3af', 400, 'center'); text('Bu xabar oʻchirildi', x + 100, y + h / 2 + 12, 30 * k, '#9ca3af', 700); return; }
  rr(x + 20, y + 20, 150, h - 40, 16); const g = ctx.createLinearGradient(x, y, x + 170, y + h); g.addColorStop(0, '#f472b6'); g.addColorStop(1, '#f59e0b'); ctx.fillStyle = g; ctx.fill();
  text('30%', x + 95, y + h / 2 + 14, 44, '#fff', 900, 'center');
  text('Vodiy Textile', x + 195, y + 60, 30, '#e9eef3', 800); text('Yangi kolleksiya — 30% chegirma', x + 195, y + 100, 22, '#9fb3c8', 600);
  text('👁 3 240 · 18:00', x + 195, y + h - 30, 20, '#7f91a4', 600);
}

// ---------- SCENE 1 — Muammo: the deal is broken ----------
const CLK = [[0, 1080], [1.4, 1080], [3.6, 1207], [9.4, 1215]];   // minutes: 18:00 → 20:07
const DEL = 3.7, OTHER = 4.4, ASK = 5.0, SHRUG = 6.0, DUST = [9.55, 10.25];
const IMPACTS1 = [[DEL, 14], [5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const POST = { x: SX + 30, y: SY + 300, w: SW - 60, h: 200 };
const hhmm = mm => `${String(Math.floor(mm / 60) % 24).padStart(2, '0')}:${String(Math.round(mm) % 60).padStart(2, '0')}`;
const curve = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], clamp((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0]))); return keys[keys.length - 1][1]; };
function channelScreen(t) {
  ctx.fillStyle = '#0e1621'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150);
  ctx.beginPath(); ctx.arc(SX + 80, SY + 95, 36, 0, 7); ctx.fillStyle = '#f97316'; ctx.fill(); text('VL', SX + 80, SY + 97, 26, '#fff', 800, 'center', 'middle');
  text('Vodiy Live', SX + 135, SY + 88, 30, '#fff', 700); text('48 200 obunachi', SX + 135, SY + 126, 23, '#7f91a4', 500);
  rr(SX + SW - 170, SY + 70, 130, 50, 25); ctx.fillStyle = '#243447'; ctx.fill(); text(hhmm(curve(t, CLK)), SX + SW - 105, SY + 104, 26, t > DEL ? '#fca5a5' : '#fff', 800, 'center');
  // deal pin
  rr(SX + 30, SY + 175, SW - 60, 100, 18); ctx.fillStyle = '#1e293b'; ctx.fill();
  text('📌 Kelishuv: 24 soat tepada', SX + 60, SY + 220, 26, '#fde68a', 800); text('Toʻlandi: 1 200 000 soʻm · 18:00', SX + 60, SY + 256, 22, '#9fb3c8', 600);
  // our ad post (or its ghost)
  const pp = eOut(prog(t, .5, .9));
  if (pp > 0) withAlpha(pp, () => adPost(POST.x, POST.y, POST.w, POST.h, t > DEL));
  if (t > DEL) { const q = prog(t, DEL, DEL + .3); withAlpha(1 - q, () => { ctx.fillStyle = '#fff'; rr(POST.x, POST.y, POST.w, POST.h, 24); ctx.fill(); }); }
  // another ad takes the top
  const op = eBack(prog(t, OTHER, OTHER + .35));
  if (op > 0) scaled(SX + SW / 2, SY + 620, op, () => { rr(SX + 30, SY + 530, SW - 60, 170, 24); ctx.fillStyle = '#182533'; ctx.fill();
    rr(SX + 50, SY + 550, 130, 130, 16); ctx.fillStyle = '#6366f1'; ctx.fill(); text('Boshqa reklama', SX + 205, SY + 600, 28, '#e9eef3', 800); text('20:05 · tepaga qadaldi', SX + 205, SY + 640, 22, '#7f91a4', 600); });
  // chat with the admin
  const ap = prog(t, ASK, ASK + .3);
  if (ap > 0) withAlpha(ap, () => { rr(SX + SW - 30 - 420, SY + 730, 420, 70, 22); ctx.fillStyle = '#2b5278'; ctx.fill(); text('Post qayerda? 24 soat edi-ku!', SX + SW - 430, SY + 774, 25, '#e9eef3', 500); });
  const sp = prog(t, SHRUG, SHRUG + .3);
  if (sp > 0) withAlpha(sp, () => { rr(SX + 30, SY + 820, 470, 110, 22); ctx.fillStyle = '#182533'; ctx.fill(); text('Admin: «Kanal qoidasi.', SX + 55, SY + 862, 25, '#e9eef3', 500); text('Pul qaytmaydi.»', SX + 55, SY + 900, 25, '#e9eef3', 500); });
  if (t > 7.0) withAlpha(prog(t, 7.0, 7.3), () => { rr(SX + 30, SY + 960, SW - 60, 60, 20); ctx.fillStyle = '#3f1d1d'; ctx.fill(); text('Admin sizni blokladi', SX + SW / 2, SY + 1000, 25, '#fca5a5', 800, 'center'); });
}
function scene1(t) {
  const stress = prog(t, 4.6, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera((1 + .06 * eInOut(prog(t, 0, 10.6))) * punch(t, [.5, DEL, OTHER, ASK, SHRUG, 7.0]), sr, sx, sy, () => {
    episodeTitle(t, '21-QISM', 'Raqamli adolat', 56);
    const mins = Math.min(curve(t, CLK), 1207) - 1080;
    counters(t, [[`${Math.floor(mins / 60)} s ${String(Math.round(mins % 60)).padStart(2, '0')} d`, 'tepada turdi', t > DEL ? C.red : '#fff'], ['24 s', 'kelishuv', '#fff'], [t > SHRUG ? '0' : '?', 'qaytgan pul', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#0e1621', 0, lerp(160, 0, enter), 0, () => { channelScreen(t); ctx.fillStyle = `rgba(255,40,60,${.05 * stress})`; ctx.fillRect(SX, SY, SW, SH); });
    sparks(t, DEL, SX + SW / 2, POST.y + POST.h / 2, 271, ['#fca5a5', '#ffffff'], 20, 500);
  });
  slam(t, 5.6, 'POST OʻCHIRILDI', 330, 560, 44, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
  slam(t, 6.6, '2 SOAT', 800, 830, 56, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
  slam(t, 7.6, 'PUL KETDI', 330, 1440, 54, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 273, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'VAʼDA BUZILDI', W / 2, 880, 120, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'post ham yoʻq, pul ham', W / 2, 1040, 54, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  // vacuum: the "deleted" card alone in the dark, then it turns to dust
  if (t > 9.5) {
    ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H);
    const cw = 900, ch = 260, cx = (W - cw) / 2, cy = 900 - ch / 2;
    withAlpha(prog(t, 9.5, 9.6), () => adPost(cx, cy, cw, ch, true, 1.3));
    disintegrate(cx, cy, cw, ch, prog(t, ...DUST), '#05070d', 277, 12);
  }
}

// ---------- SCENE 2 — Yechim: 24/7 watch, evidence, verdict, refund ----------
const T21 = { watch: 11.6, lapse: [12.0, 13.4], catch: 13.4, verdict: [14.2, 15.0], refund: [15.6, 16.3], rating: 16.6, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T21.catch, 14], [T21.verdict[1], 10], [T21.slam, 34]];
const LAPSE = [[0, 1080], [12.0, 1080], [13.4, 1207], [99, 1207]];
function watchScreen(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Nazorat 24/7', SX + 50, SY + 108, 40, '#fff', 900);
  glyph('eye', SX + SW - 80, SY + 92, 1, 'rgba(255,255,255,.9)');
  // order card
  rr(SX + 30, SY + 175, SW - 60, 120, 22); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(SX + 90, SY + 235, 34, 0, 7); ctx.fillStyle = '#f97316'; ctx.fill(); text('VL', SX + 90, SY + 237, 24, '#fff', 800, 'center', 'middle');
  text('Vodiy Live · 24 soat tepada', SX + 140, SY + 225, 26, C.ink, 800); text('1 200 000 soʻm — kafolatda', SX + 140, SY + 263, 22, '#059669', 700);
  // monitor: heartbeat line + bot checks
  const caught = t > T21.catch, mm = curve(t, LAPSE);
  rr(SX + 30, SY + 315, SW - 60, 200, 22); ctx.fillStyle = caught ? '#fef2f2' : '#ecfdf5'; ctx.fill();
  text(`Bot tekshiruvi · har 5 daqiqada`, SX + 55, SY + 352, 22, caught ? '#b91c1c' : '#065f46', 800);
  text(hhmm(mm), SX + SW - 55, SY + 352, 26, caught ? '#b91c1c' : '#065f46', 900, 'right');
  ctx.beginPath(); const x0 = SX + 55, x1 = SX + SW - 55, base = SY + 445;
  for (let k = 0; k <= 120; k++) { const u = k / 120, ph = (u * 6 - t * 1.5) % 1, beat = caught && u > .82 ? 0 : (ph > 0 && ph < .08 ? Math.sin(ph / .08 * Math.PI) * -50 : 0); k ? ctx.lineTo(lerp(x0, x1, u), base + beat) : ctx.moveTo(x0, base + beat); }
  ctx.lineWidth = 4; ctx.strokeStyle = caught ? '#ef4444' : '#10b981'; ctx.stroke();
  const ticks = Math.floor(clamp(prog(t, ...T21.lapse)) * 25);
  text(caught ? 'Post topilmadi!' : `✓ ${ticks} ta tekshiruv — post joyida`, SX + 55, SY + 495, 21, caught ? '#b91c1c' : '#059669', 800);
  // alert + evidence
  const ap = eBack(prog(t, T21.catch, T21.catch + .35));
  if (ap > 0) scaled(SX + SW / 2, SY + 600, ap, () => {
    rr(SX + 30, SY + 535, SW - 60, 150, 22); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ef4444'; ctx.stroke();
    rr(SX + 50, SY + 555, 110, 110, 14); ctx.fillStyle = '#1f2937'; ctx.fill(); glyph('camera', SX + 105, SY + 605, 1, '#f87171'); text('20:07:14', SX + 105, SY + 650, 16, '#f87171', 800, 'center');
    text('Shart buzildi', SX + 180, SY + 585, 28, '#b91c1c', 900); text('Post 2 s 07 d da oʻchirildi', SX + 180, SY + 625, 22, '#334155', 700); text('Dalil: skrinshot + vaqt belgisi', SX + 180, SY + 660, 20, C.grey, 700);
    shine(SX + 30, SY + 535, SW - 60, 150, prog(t, T21.catch + .2, T21.catch + .8), 22);
  });
  // verdict
  const vp = eOut(prog(t, ...T21.verdict));
  if (vp > 0) withAlpha(vp, () => {
    rr(SX + 30, SY + 705, SW - 60, 130, 22); ctx.fillStyle = '#eef2ff'; ctx.fill();
    const tilt = Math.sin(t * 7) * .25 * (1 - eOut(prog(t, T21.verdict[0], T21.verdict[1]))) - .18 * eOut(prog(t, T21.verdict[1] - .2, T21.verdict[1]));
    ctx.save(); ctx.translate(SX + 95, SY + 770); ctx.rotate(tilt); glyph('scale', 0, 0, 1.1, '#4338ca'); ctx.restore();
    text('Arbitraj qarori', SX + 150, SY + 755, 22, '#6366f1', 800);
    text(t > T21.verdict[1] ? 'Buyurtmachi foydasiga ✓' : 'Koʻrib chiqilmoqda...', SX + 150, SY + 795, 28, '#312e81', 900);
    shine(SX + 30, SY + 705, SW - 60, 130, prog(t, T21.verdict[1], T21.verdict[1] + .6), 22);
  });
  // refund
  const rp = eOut(prog(t, T21.refund[0], T21.refund[0] + .3));
  if (rp > 0) withAlpha(rp, () => {
    rr(SX + 30, SY + 855, SW - 60, 120, 22); ctx.fillStyle = '#ecfdf5'; ctx.fill();
    glyph('return', SX + 90, SY + 915, 1, '#059669');
    const amt = 1200000 * eInOut(prog(t, ...T21.refund));
    text(`${fmt(amt)} soʻm`, SX + 140, SY + 912, 36, '#065f46', 900); text(t > T21.refund[1] ? 'Hisobingizga qaytarildi ✓' : 'Qaytarilmoqda...', SX + 140, SY + 950, 22, '#059669', 800);
    shine(SX + 30, SY + 855, SW - 60, 120, prog(t, T21.refund[1], T21.refund[1] + .6), 22);
  });
  const gp = eOut(prog(t, T21.rating, T21.rating + .3));
  if (gp > 0) withAlpha(gp, () => { rr(SX + 30, SY + 995, SW - 60, 76, 20); ctx.fillStyle = '#fff7ed'; ctx.fill();
    text(`Vodiy Live reytingi: 4.6 → ${t > T21.rating + .4 ? '3.9' : '4.6'} ★`, SX + 55, SY + 1043, 24, '#9a3412', 800); });
  const mp = eOut(prog(t, T21.sheet, T21.sheet + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T21.sheet + .2, T21.sheet + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T21.sheet + .45, T21.sheet + .8));
    withAlpha(prog(t, T21.sheet + .6, T21.sheet + .9), () => {
      text('Pul qaytarildi!', SX + SW / 2, sy + 300, 44, C.ink, 800, 'center');
      ['Bot 24/7 kuzatadi', 'Dalil — avtomatik', 'Pul — kafolatdan qaytadi'].forEach((s, i) =>
        withAlpha(prog(t, T21.sheet + .9 + i * .25, T21.sheet + 1.15 + i * .25), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera((1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8))) * punch(t, [T21.catch, T21.verdict[1], T21.refund[0], T21.refund[1], T21.rating], .03), sr, sx, sy, () => {
    solutionBg(t, 'Raqamli adolat — 24/7');
    const enter = eBack(prog(t, 11.1, 11.75));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => watchScreen(t))));
    // refund coins fly back with trails
    for (let k = 0; k < 6; k++) {
      const a0 = T21.refund[0] + k * .1, pos = tt => { const p = prog(tt, a0, a0 + .5); if (p <= 0 || p >= 1) return null; const e = eInOut(p); return [lerp(W - 120, SX + 90, e), lerp(160, SY + 915, e) - Math.sin(Math.PI * e) * 120]; };
      trail(t, pos, 5, .025, (x, y, a) => withAlpha(a, () => coin(x, y, 26)));
    }
    sparks(t, T21.catch, SX + SW / 2, SY + 600, 281, ['#fca5a5', '#ffffff'], 18, 420);
    sparks(t, T21.verdict[1], SX + 95, SY + 770, 283, ['#c7d2fe', '#ffffff', C.gold], 18, 420);
    sparks(t, T21.refund[1], SX + 90, SY + 915, 285, ['#22e39a', '#ffffff', C.gold], 22, 460);
  });
  const dim = prog(t, T21.slam - .05, T21.slam + .1) * (1 - prog(t, T21.sheet - .2, T21.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  godRays(t, W / 2, 860, prog(t, T21.slam, T21.slam + .2) * (1 - prog(t, T21.slam + 1.0, T21.slam + 1.3)));
  shockwave(t, T21.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T21.slam, W / 2, 880, 287, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T21.slam, 'ADOLAT', W / 2, 840, 170, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T21.slam + .15, 'shart buzilsa — pul qaytadi', W / 2, 1010, 54, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T21.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Postni oʻchirib ketadi', '24/7 bot nazorati'], ['Isbot yoʻq', 'Avtomatik dalil'], ['Pul ketdi', 'Pul qaytdi']];
const IMPACTS3 = [[22.15, 22], [22.75, 18], [23.2, 10], [25.0, 16]];
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
