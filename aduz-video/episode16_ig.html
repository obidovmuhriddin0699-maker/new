<script>
// ADUZ — 16-qism: "Bot va mutaxassis hamkorligi" (7-qism uslubida)
// Problem: connecting a channel "the technical way" — API token, webhook, SSL, 12 steps of code, errors — while a
// tangle of cables grows around the phone; at the vacuum it all short-circuits. The cables then pull taut into one
// green line and the frame opens from it (slitOpen). Solution: make @aduz_bot an admin of the channel (3 toggles,
// Save) → one cable plugs in → "Kanal ulandi", and a human specialist says hello. Sound: CUES_16 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Kanalni ulash: API token, webhook, kod... 12 ta qadam.'],
  [4.6, 9.4, 'Xato ustiga xato — dasturchisiz iloji yoʻq.'],
  [9.6, 10.4, '...va hammasi kuyib ketdi.'],
  [11.4, 16.2, 'ADUZʼda botni kanalga admin qilasiz — tamom, ulandi.'],
  [16.4, 21.6, 'Texnik ishni bot bajaradi, savollarga mutaxassis javob beradi.'],
  [22.4, 27.0, 'Kod yoʻq, chigal yoʻq — bitta qadam.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
const MONO16 = 'ui-monospace, Menlo, Consolas, monospace';
function mono16(s, x, y, size, col, w = 600) { ctx.font = `${w} ${size}px ${MONO16}`; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'robot') { rr(-24, -14, 48, 38, 10); ctx.fill(); ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, -26); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -28, 5, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(-10, 2, 5, 0, 7); ctx.arc(10, 2, 5, 0, 7); ctx.fill(); ctx.fillRect(-9, 12, 18, 4); ctx.globalCompositeOperation = 'source-over'; }
  else if (kind === 'plug') { rr(-16, -6, 32, 28, 6); ctx.fill(); ctx.fillRect(-10, -22, 6, 18); ctx.fillRect(4, -22, 6, 18); ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, 30); ctx.stroke(); }
  else if (kind === 'headset') { ctx.beginPath(); ctx.arc(0, 4, 22, Math.PI, 0); ctx.stroke(); rr(-28, 0, 12, 22, 5); ctx.fill(); rr(16, 0, 12, 22, 5); ctx.fill(); ctx.beginPath(); ctx.moveTo(22, 22); ctx.quadraticCurveTo(18, 32, 4, 32); ctx.stroke(); }
  ctx.restore();
}
const bez = (P, u) => { const v = 1 - u; return [0, 1].map(k => v * v * v * P[0][k] + 3 * v * v * u * P[1][k] + 3 * v * u * u * P[2][k] + u * u * u * P[3][k]); };

// ---------- SCENE 1 — Muammo: tangled integration ----------
const WIRES = [
  [[150, 600], [-80, 380], '#ef4444', 0], [[930, 520], [1160, 300], '#3b82f6', 0], [[150, 920], [-80, 1300], '#eab308', 0],
  [[930, 1100], [1160, 1520], '#94a3b8', 0], [[400, 1540], [180, 2000], '#f97316', 0], [[700, 1540], [1000, 2000], '#a855f7', 0],
  [[150, 1300], [-80, 1720], '#ef4444', 0], [[930, 820], [1160, 960], '#22d3ee', 0],
  [[-80, 700], [1160, 1260], '#eab308', 1], [[1160, 620], [-80, 1460], '#ef4444', 1],
].map(([a, b, c, front], i) => ({ a, b, c, front, at: front ? 5.4 + (i - 8) * 1.0 : .6 + i * .45, ph: i * 1.7 }));
const CODE = [[.8, 'POST /api/v2/channels/connect', '#79c0ff'], [1.4, 'Authorization: Bearer ••••••••', '#d2a8ff'], [2.0, '{ "webhook": "https://…/hook",', '#e6edf3'], [2.6, '  "secret": "???",', '#e6edf3'], [3.1, '  "ssl": true, "retry": 3 }', '#e6edf3']];
const ERRS = [[2.4, '✕ 401 Unauthorized'], [3.6, '✕ Webhook: SSL sertifikat xatosi'], [4.6, '✕ Timeout: 30 s javob yoʻq'], [6.0, '✕ 403: bot huquqi yetarli emas']];
const SHORT = 9.5, PULL = [10.3, 10.58];
const IMPACTS1 = [[2.4, 6], [3.6, 6], [5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46], [SHORT, 26]];
function wirePts(w, t) {
  const tg = 40 + 300 * eIn(prog(t, 1, 9)), d = [w.b[0] - w.a[0], w.b[1] - w.a[1]];
  const P = [w.a, [w.a[0] + d[0] * .33 + Math.sin(t * .9 + w.ph) * tg, w.a[1] + d[1] * .33 + Math.cos(t * .7 + w.ph) * tg], [w.a[0] + d[0] * .66 + Math.cos(t * .8 + w.ph * 2) * tg, w.a[1] + d[1] * .66 + Math.sin(t * 1.1 + w.ph) * tg], w.b];
  const c = eInOut(prog(t, ...PULL)); if (c <= 0) return P;
  const tgt = [[-60, H / 2], [W / 3, H / 2], [2 * W / 3, H / 2], [W + 60, H / 2]];
  return P.map((p, k) => [lerp(p[0], tgt[k][0], c), lerp(p[1], tgt[k][1], c)]);
}
function drawWire(w, t) {
  const g = eOut(prog(t, w.at, w.at + .6)); if (g <= 0) return;
  const P = wirePts(w, t), c = eInOut(prog(t, ...PULL)), dead = t > SHORT && c < 1;
  ctx.beginPath(); for (let k = 0; k <= 48 * g; k++) { const [x, y] = bez(P, k / 48); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 20; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
  ctx.lineWidth = 13; ctx.strokeStyle = c > 0 ? '#22e39a' : dead ? '#374151' : w.c; ctx.stroke();
  if (c > 0) { ctx.save(); ctx.shadowColor = '#22e39a'; ctx.shadowBlur = 40 * c; ctx.lineWidth = 6; ctx.strokeStyle = '#d1fae5'; ctx.stroke(); ctx.restore(); }
}
function codeScreen(t) {
  ctx.fillStyle = '#0d1117'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#161b22'; ctx.fillRect(SX, SY, SW, 150);
  const step = t > 4.6 ? 3 : t > 2.6 ? 2 : 1;
  text('Kanalni ulash', SX + 40, SY + 92, 36, '#e6edf3', 800);
  text(`Qoʻllanma · ${step}/12 qadam`, SX + 40, SY + 130, 23, '#8b949e', 600);
  rr(SX + SW - 160, SY + 70, 120, 44, 22); ctx.fillStyle = '#3b1219'; ctx.fill(); text('API v2', SX + SW - 100, SY + 100, 22, '#ff7b72', 800, 'center');
  CODE.forEach(([at, s, col], i) => {
    const n = Math.floor(clamp((t - at) * 34, 0, s.length)); if (n <= 0) return;
    mono16(String(i + 1).padStart(2, ' '), SX + 30, SY + 220 + i * 50, 24, '#484f58');
    mono16(s.slice(0, n), SX + 80, SY + 220 + i * 50, 24, col);
    if (n < s.length && Math.floor(t * 6) % 2) { ctx.fillStyle = '#e6edf3'; ctx.fillRect(SX + 80 + ctx.measureText(s.slice(0, n)).width + 2, SY + 198 + i * 50, 12, 28); }
  });
  // console
  rr(SX + 24, SY + 500, SW - 48, 420, 18); ctx.fillStyle = '#010409'; ctx.fill();
  mono16('$ connect --channel @vodiy_live', SX + 50, SY + 550, 23, '#8b949e');
  ERRS.forEach(([at, s], i) => { const p = prog(t, at, at + .15); if (p <= 0) return;
    withAlpha(p, () => { rr(SX + 40, SY + 580 + i * 78, SW - 80, 62, 12); ctx.fillStyle = 'rgba(248,81,73,.14)'; ctx.fill(); mono16(s, SX + 60, SY + 620 + i * 78, 23, '#ff7b72', 700); }); });
  rr(SX + 40, SY + SH - 170, SW - 80, 100, 50); ctx.fillStyle = '#21262d'; ctx.fill();
  text(t > 4.6 ? 'Qayta urinish (4)' : 'Ulashni tekshirish', SX + SW / 2, SY + SH - 107, 30, '#8b949e', 800, 'center');
}
function scene1(t) {
  const stress = prog(t, 4.6, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr, sx, sy, () => {
    episodeTitle(t, '16-QISM', 'Oson ulanish', 56);
    const errs = ERRS.filter(([at]) => t >= at).length;
    counters(t, [[`${t > 4.6 ? 3 : t > 2.6 ? 2 : 1}/12`, 'qadam', '#fff'], [`${errs}`, 'xato', errs ? C.red : '#fff'], ['?', 'dasturchi kerak', C.red]]);
    WIRES.filter(w => !w.front).forEach(w => drawWire(w, t));
    const enter = eOut(prog(t, 0, .7)), off = t > SHORT;
    phone('#0d1117', 0, lerp(160, 0, enter), 0, () => {
      if (off) { ctx.fillStyle = '#000'; ctx.fillRect(SX, SY, SW, SH); return; }
      codeScreen(t); ctx.fillStyle = `rgba(255,40,60,${.05 * stress})`; ctx.fillRect(SX, SY, SW, SH);
    });
    WIRES.filter(w => w.front).forEach(w => drawWire(w, t));
    for (const [at] of ERRS) sparks(t, at, at === 2.4 ? 150 : at === 3.6 ? 930 : at === 4.6 ? 150 : 930, at === 3.6 ? 520 : at === 4.6 ? 1300 : 900, Math.round(at * 10), ['#fde047', '#fff', '#f97316'], 14, 260);
  });
  slam(t, 5.6, 'API TOKEN?', 300, 560, 52, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
  slam(t, 6.6, 'WEBHOOK?', 790, 830, 52, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
  slam(t, 7.6, '401 XATO', 330, 1440, 54, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 163, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'CHIGAL', W / 2, 880, 170, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'kanal ulash — dasturchi ishi', W / 2, 1040, 50, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  // short circuit: lights go out, sparks fizz at the cable ends
  if (t > SHORT) withAlpha(.55 * (1 - prog(t, PULL[0], PULL[1])), () => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); });
  flash(t, SHORT, '#fde047', .5, .18);
  [[150, 600], [930, 520], [150, 920], [930, 1100]].forEach(([x, y], k) => sparks(t, SHORT + k * .05, x, y, 170 + k, ['#fde047', '#ffffff'], 16, 320));
}

// ---------- SCENE 2 — Yechim: make the bot an admin ----------
const T16 = { add: 12.1, type: [12.4, 13.0], pick: 13.3, perms: 13.5, save: 14.4, slide: 14.7, plug: [15.0, 15.6], linked: 15.7, list: [16.0, 16.3, 16.6], expert: 17.0, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T16.plug[1], 12], [T16.slam, 34]];
const PERMS = [['Xabar joylash', true], ['Xabarlarni tahrirlash', true], ['Statistikani koʻrish', true], ['Aʼzolarni boshqarish', false], ['Kanalni oʻchirish', false]];
const ADDB = { x: SX + 30, y: SY + 300, w: SW - 60, h: 80 }, PICK = { x: SX + 30, y: SY + 520, w: SW - 60, h: 90 }, SAVE = { x: SX + 40, y: SY + SH - 130, w: SW - 80, h: 96 };
const AV = { ch: [SX + 140, SY + 330], bot: [SX + SW - 140, SY + 330] };
function tgScreen(t) {
  ctx.fillStyle = '#fff'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#3390ec'; ctx.fillRect(SX, SY, SW, 150);
  text('Vodiy Live', SX + 50, SY + 88, 36, '#fff', 800); text('Administratorlar', SX + 50, SY + 128, 24, '#dbeafe', 600);
  rr(SX + 30, SY + 180, SW - 60, 90, 18); ctx.fillStyle = '#f1f5f9'; ctx.fill();
  ctx.beginPath(); ctx.arc(SX + 85, SY + 225, 30, 0, 7); ctx.fillStyle = '#f97316'; ctx.fill(); text('Siz', SX + 85, SY + 227, 20, '#fff', 800, 'center', 'middle');
  text('Siz · egasi', SX + 135, SY + 235, 28, C.ink, 700);
  scaled(ADDB.x + ADDB.w / 2, ADDB.y + 40, 1 - .05 * bump(t, T16.add, .22), () => { rr(ADDB.x, ADDB.y, ADDB.w, ADDB.h, 18); ctx.fillStyle = t > T16.add ? '#dbeafe' : '#eff6ff'; ctx.fill(); text('+ Admin qoʻshish', ADDB.x + 40, ADDB.y + 52, 30, '#2563eb', 800); });
  if (t > T16.add) {
    rr(SX + 30, SY + 410, SW - 60, 80, 40); ctx.fillStyle = '#f1f5f9'; ctx.fill();
    const q = '@aduz_bot', n = Math.floor(q.length * clamp(prog(t, ...T16.type)));
    text(n ? q.slice(0, n) : 'Qidirish...', SX + 70, SY + 462, 30, n ? C.ink : '#94a3b8', 700);
    if (n >= q.length) {
      const rp = eOut(prog(t, T16.type[1], T16.type[1] + .25));
      withAlpha(rp, () => scaled(PICK.x + PICK.w / 2, PICK.y + 45, 1 - .04 * bump(t, T16.pick, .2), () => {
        rr(PICK.x, PICK.y, PICK.w, PICK.h, 18); ctx.fillStyle = t > T16.pick ? '#dcfce7' : '#f8fafc'; ctx.fill();
        ctx.beginPath(); ctx.arc(PICK.x + 55, PICK.y + 45, 32, 0, 7); ctx.fillStyle = '#0ea371'; ctx.fill(); glyph('robot', PICK.x + 55, PICK.y + 48, .75);
        text('ADUZ Bot', PICK.x + 105, PICK.y + 42, 28, C.ink, 800); text('bot · rasmiy', PICK.x + 105, PICK.y + 74, 22, C.grey, 600);
        if (t > T16.pick) check(PICK.x + PICK.w - 50, PICK.y + 46, 20, '#16c784', 6, prog(t, T16.pick, T16.pick + .25));
      }));
    }
  }
  if (t > T16.pick) PERMS.forEach(([s, on], i) => {
    const y = SY + 640 + i * 66, p = eOut(prog(t, T16.perms + i * .08, T16.perms + .3 + i * .08)); if (p <= 0) return;
    const sw = on ? eInOut(prog(t, T16.perms + .2 + i * .15, T16.perms + .4 + i * .15)) : 0;
    withAlpha(p, () => {
      text(s, SX + 50, y + 36, 27, '#334155', 600);
      rr(SX + SW - 130, y + 8, 80, 42, 21); ctx.fillStyle = sw > .5 ? '#16c784' : '#cbd5e1'; ctx.fill();
      ctx.beginPath(); ctx.arc(SX + SW - 109 + 38 * sw, y + 29, 17, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    });
  });
  if (t > T16.pick) scaled(SAVE.x + SAVE.w / 2, SAVE.y + 48, 1 - .05 * bump(t, T16.save, .25), () => {
    rr(SAVE.x, SAVE.y, SAVE.w, SAVE.h, 48); ctx.fillStyle = '#3390ec'; ctx.fill(); text('Saqlash', SAVE.x + SAVE.w / 2, SAVE.y + 60, 34, '#fff', 900, 'center');
  });
}
function linkScreen(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Kanallarim', SX + 50, SY + 108, 40, '#fff', 900);
  rr(SX + 30, SY + 180, SW - 60, 330, 28); ctx.fillStyle = '#fff'; ctx.fill();
  const [cx, cy] = AV.ch, [bx, by] = AV.bot, pp = eInOut(prog(t, ...T16.plug)), linked = t > T16.plug[1];
  // cable: from the bot, the plug travels to the channel's socket
  const px = lerp(bx - 70, cx + 95, pp);
  ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(bx - 60, by); ctx.bezierCurveTo(lerp(bx - 60, px, .5), by + 60 * (1 - pp), lerp(bx - 60, px, .5), by + 60 * (1 - pp), px, by);
  ctx.lineWidth = 12; ctx.strokeStyle = linked ? '#16c784' : '#94a3b8'; ctx.stroke();
  if (linked) { ctx.save(); ctx.shadowColor = '#22e39a'; ctx.shadowBlur = 30; ctx.lineWidth = 4; ctx.strokeStyle = '#d1fae5'; ctx.stroke(); ctx.restore();
    for (let k = 0; k < 3; k++) { const u = ((t - T16.plug[1]) * .8 + k / 3) % 1; ctx.beginPath(); ctx.arc(lerp(bx - 60, cx + 70, u), by, 9, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); } }
  ctx.save(); ctx.translate(px, by); ctx.rotate(-Math.PI / 2); glyph('plug', 0, 0, 1, linked ? '#16c784' : '#64748b'); ctx.restore();
  rr(cx + 62, by - 26, 26, 52, 8); ctx.fillStyle = '#334155'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 62, 0, 7); ctx.fillStyle = '#f97316'; ctx.fill(); text('VL', cx, cy + 2, 38, '#fff', 800, 'center', 'middle');
  ctx.beginPath(); ctx.arc(bx, by, 62, 0, 7); ctx.fillStyle = '#0ea371'; ctx.fill(); glyph('robot', bx, by + 6, 1.4);
  text('Vodiy Live', cx, cy + 100, 24, C.ink, 800, 'center'); text('ADUZ Bot · admin', bx, by + 100, 24, C.ink, 800, 'center');
  const lp = eBack(prog(t, T16.linked, T16.linked + .35));
  if (lp > 0) scaled(SX + SW / 2, SY + 470, lp, () => { rr(SX + SW / 2 - 160, SY + 442, 320, 56, 28); ctx.fillStyle = '#16c784'; ctx.fill(); check(SX + SW / 2 - 118, SY + 471, 14, '#fff', 4.5); text('Kanal ulandi', SX + SW / 2 + 16, SY + 481, 28, '#fff', 900, 'center'); });
  ['Postlar avtomatik joylanadi', 'Statistika jonli keladi', 'Toʻlovlar kafolatda'].forEach((s, i) => {
    const p = eOut(prog(t, T16.list[i], T16.list[i] + .3)); if (p <= 0) return;
    withAlpha(p, () => { const y = SY + 545 + i * 70; ctx.beginPath(); ctx.arc(SX + 70, y + 22, 20, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(SX + 70, y + 23, 15, '#fff', 4.5); text(s, SX + 108, y + 32, 28, '#334155', 700); });
  });
  // the human specialist
  const ep = eOut(prog(t, T16.expert, T16.expert + .4));
  if (ep > 0) withAlpha(ep, () => {
    const y = SY + 770 + 40 * (1 - ep);
    rr(SX + 30, y, SW - 60, 240, 28); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#a7f3d0'; ctx.stroke();
    ctx.beginPath(); ctx.arc(SX + 95, y + 70, 38, 0, 7); ctx.fillStyle = '#6366f1'; ctx.fill(); text('DM', SX + 95, y + 72, 26, '#fff', 800, 'center', 'middle');
    text('Dilshod · mutaxassis', SX + 150, y + 62, 28, C.ink, 800);
    glyph('headset', SX + SW - 80, y + 62, .8, '#6366f1');
    text('onlayn · yordam', SX + 150, y + 96, 22, '#059669', 700);
    const msg = 'Salom! Kanalingiz ulandi. Birinchi reklamani birga sozlaymiz.', n = Math.floor(msg.length * clamp(prog(t, T16.expert + .3, T16.expert + 1.3)));
    wrap(msg.slice(0, n), SW - 120, 26, 600).forEach((l, i) => text(l, SX + 60, y + 150 + i * 36, 26, '#334155', 600));
  });
  const mp = eOut(prog(t, T16.sheet, T16.sheet + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy2 = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy2, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T16.sheet + .2, T16.sheet + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy2 + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(SX + SW / 2, sy2 + 152, 70, '#fff', 13, prog(t, T16.sheet + .45, T16.sheet + .8));
    withAlpha(prog(t, T16.sheet + .6, T16.sheet + .9), () => {
      text('Kanal ulandi!', SX + SW / 2, sy2 + 300, 44, C.ink, 800, 'center');
      ['Botni admin qilasiz — tamom', 'Texnik ishni bot bajaradi', 'Savollarga — mutaxassis'].forEach((s, i) =>
        withAlpha(prog(t, T16.sheet + .9 + i * .25, T16.sheet + 1.15 + i * .25), () => {
          check(SX + 90, sy2 + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy2 + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Botni admin qiling — tamom');
    const enter = eBack(prog(t, 11.1, 11.75)), sp = eInOut(prog(t, T16.slide, T16.slide + .4));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#ffffff', 0, lerp(180, 0, enter), 0, () => {
        if (sp < 1) { ctx.save(); ctx.translate(-SW * sp, 0); tgScreen(t); ctx.restore(); }
        if (sp > 0) { ctx.save(); ctx.translate(SW * (1 - sp), 0); linkScreen(t); ctx.restore(); }
      })));
    const taps = [[T16.add, ADDB.x + ADDB.w / 2 + 120, ADDB.y + 40], [T16.pick, PICK.x + PICK.w / 2 + 120, PICK.y + 45], [T16.save, SAVE.x + SAVE.w / 2 + 150, SAVE.y + 48]];
    if (t > 11.7 && t < 14.8) {
      const [cx, cy] = pathAt(t, [[11.7, W - 40, 1650], taps[0], [13.0, PICK.x + PICK.w / 2 + 200, PICK.y + 160], taps[1], taps[2], [14.8, W - 40, 1700]]);
      withAlpha(Math.min(prog(t, 11.7, 11.9), 1 - prog(t, 14.6, 14.8)), () => cursor(cx, cy, Math.max(...taps.map(([a]) => bump(t, a, .22)))));
    }
    for (const [a, x, y] of taps) ripple(x, y, prog(t, a, a + .6), '#ffffff');
    sparks(t, T16.plug[1], AV.ch[0] + 80, AV.ch[1], 173, ['#22e39a', '#ffffff', C.gold], 18, 300);
  });
  const dim = prog(t, T16.slam - .05, T16.slam + .1) * (1 - prog(t, T16.sheet - .2, T16.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T16.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T16.slam, W / 2, 880, 167, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T16.slam, 'BOT + MUTAXASSIS', W / 2, 840, 96, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T16.slam + .15, 'kod yozmasdan — bitta qadamda', W / 2, 1000, 50, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T16.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['API, webhook, kod', 'Botni admin qilish'], ['Dasturchi kerak', 'Mutaxassis yordami'], ['Kunlab sozlash', 'Bir necha daqiqa']];
const IMPACTS3 = [[22.15, 22], [23.2, 8], [25.0, 16]];
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    glyph(kind, bx, by, 1.5);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {
    resultBg(t);
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha(1 - out, () => {
      withAlpha(prog(t, 22.2, 22.6), () => {
        text('NATIJA', W / 2, 190, 34, C.gold, 800, 'center');
        text('Ulanish — bitta qadam', W / 2, 260, 54, '#fff', 800, 'center');
      });
      const ap = eBack(prog(t, 22.2, 22.6)), lk = eInOut(prog(t, 22.5, 23.2));
      withAlpha(clamp(ap), () => {
        ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(330, 450); ctx.lineTo(lerp(330, 750, lk), 450); ctx.lineWidth = 16; ctx.strokeStyle = '#22e39a';
        ctx.save(); ctx.shadowColor = '#22e39a'; ctx.shadowBlur = 40; ctx.stroke(); ctx.restore();
        if (t > 23.2) for (let k = 0; k < 4; k++) { const u = ((t - 23.2) * .9 + k / 4) % 1; ctx.beginPath(); ctx.arc(lerp(330, 750, u), 450, 10, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }
        scaled(260, 450, ap, () => { ctx.beginPath(); ctx.arc(260, 450, 100, 0, 7); ctx.fillStyle = '#f97316'; ctx.fill(); text('VL', 260, 453, 60, '#fff', 800, 'center', 'middle'); });
        scaled(820, 450, ap, () => { ctx.beginPath(); ctx.arc(820, 450, 100, 0, 7); ctx.fillStyle = '#0ea371'; ctx.fill(); glyph('robot', 820, 460, 2.3); });
        const cp = eBack(prog(t, 23.2, 23.5));
        if (cp > 0) scaled(540, 450, cp, () => { ctx.beginPath(); ctx.arc(540, 450, 42, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke(); check(540, 452, 26, '#fff', 7); });
      });
      const cp = eOut(prog(t, 23.0, 23.5)), x = 90, y = lerp(760, 700, cp), w = 900, h = 450;
      withAlpha(cp, () => {
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
        rr(x, y, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
        text('Oldin', x + 60, y + 72, 30, C.grey, 800);
        rr(x + 470, y + 38, 200, 50, 25); ctx.fillStyle = '#d1fae5'; ctx.fill();
        text('ADUZ', x + 570, y + 72, 30, '#065f46', 900, 'center');
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + w / 2 - 20, y + 110, 2, h - 140);
        CMP.forEach(([a, b], i) => {
          const ry = y + 175 + i * 105, st = eInOut(prog(t, 23.5 + i * .35, 23.8 + i * .35)), ok = eBack(prog(t, 23.7 + i * .35, 24.0 + i * .35));
          text(a, x + 60, ry, 28, st > 0 ? '#94a3b8' : '#334155', 700);
          if (st > 0) { ctx.font = `700 28px ${F}`; const tw = ctx.measureText(a).width; ctx.beginPath(); ctx.moveTo(x + 55, ry - 10); ctx.lineTo(x + 55 + (tw + 10) * st, ry - 10); ctx.lineWidth = 5; ctx.strokeStyle = C.red; ctx.stroke(); }
          if (ok > 0) scaled(x + 470, ry - 10, ok, () => {
            ctx.beginPath(); ctx.arc(x + 490, ry - 10, 20, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(x + 490, ry - 9, 18, '#fff', 5);
            text(b, x + 525, ry, 28, '#059669', 900);
          });
        });
      });
      [['Oson ulanish', 'plug'], ['Aqlli bot', 'robot'], ['Mutaxassis', 'headset']].forEach(([l, k], i) => {
        const p = eBack(prog(t, 25.2 + i * .25, 25.65 + i * .25));
        if (p > 0) badge(230 + i * 310, 1320, l, k, p);
      });
    });
  });
  shockwave(t, 25.0, W / 2, 900, C.gold, 900);
  sparks(t, 23.2, 540, 450, 179, [C.gold, '#fff', '#22e39a'], 24, 700);
  sparks(t, 25.0, W - 200, 900, 181, [C.gold, '#fff', '#22e39a'], 34, 1100);
  confetti(t, 25.0);
  endCard(t, 27.0);
}
