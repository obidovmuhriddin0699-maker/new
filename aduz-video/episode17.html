<canvas id="c" width="1080" height="1920"></canvas>

<script>
// ADUZ — 17-qism: "Topilgan daromadning erkinligi" (7-qism uslubida)
// Problem: the admin's earned balance can't be withdrawn — every tap on "Pulni yechish" adds another excuse card
// (1st of the month only, minimum amount, 15% fee, 14-day review, "tomorrow", maintenance). At the vacuum two chains
// slam across the frame with a padlock. Transition: the chains snap apart and a gold circle opens the solution.
// Solution: ADUZ wallet → "Kartaga yechish" → card, "Hammasi", confirm → coins stream onto the bank card, SMS arrives.
// Sound: CUES_17 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Daromad bor — lekin yechib boʻlmaydi. Har safar yangi bahona.'],
  [4.6, 9.4, 'Minimal summa, komissiya, «14 kun kuting»...'],
  [9.6, 10.3, '...pulingiz — qulf ostida.'],
  [11.4, 16.2, 'ADUZʼda daromadni istalgan vaqtda kartaga yechasiz.'],
  [16.4, 21.6, 'Bir necha bosish — pul kartangizda. Bahonasiz.'],
  [22.4, 27.0, 'Topgan pulingiz — sizniki. Istalgan payt.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
const BAL = 2450000;
function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'bolt') { ctx.beginPath(); ctx.moveTo(6, -30); ctx.lineTo(-16, 4); ctx.lineTo(0, 4); ctx.lineTo(-6, 30); ctx.lineTo(16, -6); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill(); }
  else if (kind === 'card') { rr(-28, -19, 56, 38, 7); ctx.stroke(); ctx.fillRect(-28, -8, 56, 8); ctx.fillRect(-18, 8, 16, 5); }
  else if (kind === 'clock') { ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 0); ctx.lineTo(10, 8); ctx.stroke(); }
  else if (kind === 'lock') { rr(-18, -4, 36, 28, 6); ctx.fill(); ctx.beginPath(); ctx.arc(0, -6, 12, Math.PI, 0); ctx.stroke(); }
  ctx.restore();
}
function coin(x, y, r = 34) {
  ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#fbbf24'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r * .78, 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = '#b45309'; ctx.stroke();
  text('S', x, y + 2, r, '#b45309', 900, 'center', 'middle');
}
function bankCard(x, y, w, h, name, num, amount, glow = 0) {
  ctx.save(); ctx.shadowColor = glow ? `rgba(255,200,61,${glow})` : 'rgba(0,0,0,.4)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = glow ? 0 : 14;
  rr(x, y, w, h, 28); const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#1e3a8a'); g.addColorStop(1, '#0ea5e9'); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  rr(x + 36, y + 50, 64, 48, 10); ctx.fillStyle = '#fcd34d'; ctx.fill();
  text(name, x + w - 36, y + 68, 30, '#fff', 900, 'right');
  text(num, x + 36, y + h - 40, 32, 'rgba(255,255,255,.9)', 700);
  if (amount != null) text(`${fmt(amount)} soʻm`, x + w - 36, y + h - 40, 34, '#fff', 900, 'right');
}
function chainLine(x0, y0, x1, y1, col = '#cbd5e1') {
  const L = Math.hypot(x1 - x0, y1 - y0), a = Math.atan2(y1 - y0, x1 - x0), n = Math.ceil(L / 44);
  for (let k = 0; k <= n; k++) {
    const x = x0 + Math.cos(a) * k * 44, y = y0 + Math.sin(a) * k * 44;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    if (k % 2) { rr(-30, -6, 60, 12, 6); ctx.fillStyle = col; ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(0, 0, 32, 17, 0, 0, 7); ctx.lineWidth = 10; ctx.strokeStyle = col; ctx.stroke(); ctx.beginPath(); ctx.ellipse(0, -4, 26, 11, 0, Math.PI, 2 * Math.PI); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke(); }
    ctx.restore();
  }
}

// ---------- SCENE 1 — Muammo: a wall of excuses ----------
const TAPS1 = [1.2, 2.6, 4.0, 5.4, 6.6, 7.6];
const EXC = [['Yechish faqat oyning 1-sanasida', '#fde68a', '#78350f'], ['Minimal summa: 3 000 000 soʻm', '#fde68a', '#78350f'], ['Komissiya: 15%', '#fecaca', '#7f1d1d'], ['Arizangiz koʻrib chiqilmoqda: 14 kun', '#fde68a', '#78350f'], ['Operator: «Ertaga albatta...»', '#e2e8f0', '#1e293b'], ['Texnik ishlar. Keyinroq urining', '#fecaca', '#7f1d1d']];
const TILT = [-.03, .025, -.02, .03, -.025, .02];
const LOCKED = 9.5, SNAP = [10.3, 10.55];
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46], [LOCKED, 34]];
const WD = { x: SX + 40, y: SY + 430, w: SW - 80, h: 92 };
function walletOld(t) {
  ctx.fillStyle = '#111827'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#1f2937'; ctx.fillRect(SX, SY, SW, 150);
  text('Daromadim', SX + 50, SY + 106, 40, '#fff', 800);
  rr(SX + 30, SY + 180, SW - 60, 220, 28); ctx.fillStyle = '#1f2937'; ctx.fill();
  text('Balans', SX + 70, SY + 240, 26, '#9ca3af', 700);
  text(`${fmt(BAL)} soʻm`, SX + 70, SY + 320, 62, '#fff', 900);
  if (t > 1.4) { withAlpha(prog(t, 1.4, 1.7), () => { glyph('lock', SX + SW - 90, SY + 250, 1.1, '#f87171'); text('Yechib boʻlmaydi', SX + 70, SY + 370, 24, '#f87171', 800); }); }
  scaled(WD.x + WD.w / 2, WD.y + 46, 1 - .05 * Math.max(...TAPS1.map(a => bump(t, a, .22))), () => {
    rr(WD.x, WD.y, WD.w, WD.h, 46); ctx.fillStyle = '#374151'; ctx.fill(); text('Pulni yechish', WD.x + WD.w / 2, WD.y + 59, 32, '#d1d5db', 800, 'center');
  });
  EXC.forEach(([s, bg, fg], i) => {
    const at = TAPS1[i] + .2, p = eBack(prog(t, at, at + .3)); if (p <= 0) return;
    const y = SY + 560 + i * 92;
    ctx.save(); ctx.translate(SX + SW / 2, y + 40); ctx.rotate(TILT[i] * p); ctx.scale(lerp(1.3, 1, p), lerp(1.3, 1, p)); ctx.translate(-(SX + SW / 2), -(y + 40));
    withAlpha(clamp(p), () => {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20; rr(SX + 30, y, SW - 60, 80, 16); ctx.fillStyle = bg; ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.arc(SX + 70, y + 40, 18, 0, 7); ctx.fillStyle = fg; ctx.fill(); text('!', SX + 70, y + 42, 24, bg, 900, 'center', 'middle');
      text(s, SX + 104, y + 50, 27, fg, 800);
    });
    ctx.restore();
  });
}
function scene1(t) {
  const stress = prog(t, 4.6, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr, sx, sy, () => {
    episodeTitle(t, '17-QISM', 'Daromad erkinligi', 56);
    const days = Math.round(14 * eIn(prog(t, 1.0, 9.0)));
    counters(t, [[fmt(BAL), 'balans', '#fff'], [`${days} kun`, 'kutish', days > 3 ? C.red : '#fff'], ['0', 'yechildi', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#111827', 0, lerp(160, 0, enter), 0, () => { walletOld(t); ctx.fillStyle = `rgba(255,40,60,${.05 * stress})`; ctx.fillRect(SX, SY, SW, SH); });
    if (t > .8 && t < 8.2) {
      const keys = [[.8, W - 60, 1700], ...TAPS1.map(a => [a, WD.x + WD.w / 2 + 160, WD.y + 46]), [8.2, W - 60, 1750]];
      const [cx, cy] = pathAt(t, keys);
      withAlpha(Math.min(prog(t, .8, 1.0), 1 - prog(t, 8.0, 8.2)), () => cursor(cx, cy, Math.max(...TAPS1.map(a => bump(t, a, .2)))));
    }
  });
  slam(t, 5.6, 'BAHONA', 300, 560, 56, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
  slam(t, 6.6, 'YANA BAHONA', 780, 830, 50, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
  slam(t, 7.6, '14 KUN KUTING', 330, 1440, 50, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 183, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'QULFDA', W / 2, 880, 170, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'oʻz pulingiz — oʻzingizga berilmaydi', W / 2, 1040, 46, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  // chains + padlock slam across the frame, then snap apart
  if (t > LOCKED) {
    withAlpha(.5, () => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); });
    const ci = eOut(prog(t, LOCKED, LOCKED + .15)), sn = eIn(prog(t, ...SNAP)), cx = W / 2, cy = 900;
    const chains = [[-200, 300, W + 200, 1500], [W + 200, 300, -200, 1500]];
    chains.forEach(([x0, y0, x1, y1], k) => {
      const mx = lerp(x0, cx, ci), my = lerp(y0, cy, ci);
      for (const side of [0, 1]) {
        const [ax, ay] = side ? [x1, y1] : [x0, y0], dir = side ? 1 : -1;
        const off = sn * 700, ang = sn * (k ? -1 : 1) * dir * .6;
        ctx.save(); ctx.translate(dir * off * (k ? -1 : 1) * .6, sn * 300); ctx.translate(cx, cy); ctx.rotate(ang); ctx.translate(-cx, -cy);
        if (side) chainLine(lerp(x1, cx, ci), lerp(y1, cy, ci), ax, ay); else chainLine(ax, ay, mx, my);
        ctx.restore();
      }
    });
    const lp = eBack(prog(t, LOCKED + .1, LOCKED + .3));
    if (lp > 0) { ctx.save(); ctx.translate(cx, cy + 1600 * sn * sn); ctx.rotate(sn * 1.2); ctx.scale(lp, lp);
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40;
      ctx.beginPath(); ctx.arc(0, -60, 70, Math.PI, 0); ctx.lineWidth = 30; ctx.strokeStyle = '#94a3b8'; ctx.stroke();
      rr(-110, -60, 220, 180, 30); const g = ctx.createLinearGradient(-110, -60, 110, 120); g.addColorStop(0, '#fbbf24'); g.addColorStop(1, '#b45309'); ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 15, 22, 0, 7); ctx.fillStyle = '#422006'; ctx.fill(); ctx.fillRect(-8, 15, 16, 50); ctx.restore(); }
  }
  flash(t, SNAP[0], '#fff3c4', .5, .3);
}

// ---------- SCENE 2 — Yechim: withdraw to card ----------
const T17 = { wd: 12.4, card: 12.9, all: 13.3, ok: 14.0, flow: [14.3, 15.4], sms: 15.6, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T17.flow[1], 10], [T17.slam, 34]];
const INCOME = [['Vodiy Live · reklama', 500000, '14-okt'], ['Fargʻona Style · reklama', 750000, '13-okt'], ['Margʻilon Bozor · reklama', 1200000, '12-okt']];
const WDB = { x: SX + 40, y: SY + 460, w: SW - 80, h: 92 }, ALL = { x: SX + SW - 230, y: SY + 700, w: 180, h: 56 }, OK = { x: SX + 40, y: SY + SH - 130, w: SW - 80, h: 96 };
const CARD = { x: 160, y: 1395, w: 760, h: 240 };
function walletAduz(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Daromad', SX + 50, SY + 108, 40, '#fff', 900);
  const out = eInOut(prog(t, ...T17.flow)), bal = BAL * (1 - out);
  rr(SX + 30, SY + 180, SW - 60, 250, 28); const g = ctx.createLinearGradient(SX, SY + 180, SX + SW, SY + 430); g.addColorStop(0, '#065f46'); g.addColorStop(1, '#10b981'); ctx.fillStyle = g; ctx.fill();
  text('Mavjud balans', SX + 70, SY + 240, 26, '#a7f3d0', 700);
  text(`${fmt(bal)} soʻm`, SX + 70, SY + 320, 62, '#fff', 900);
  text(t > T17.flow[1] ? 'Hammasi kartaga oʻtkazildi ✓' : 'Istalgan vaqtda yechish mumkin', SX + 70, SY + 380, 24, '#d1fae5', 700);
  const sheet = eOut(prog(t, T17.wd + .1, T17.wd + .45));
  scaled(WDB.x + WDB.w / 2, WDB.y + 46, 1 - .05 * bump(t, T17.wd, .22), () => {
    rr(WDB.x, WDB.y, WDB.w, WDB.h, 46); ctx.fillStyle = '#0ea371'; ctx.fill(); glyph('card', WDB.x + 110, WDB.y + 46, .8); text('Kartaga yechish', WDB.x + WDB.w / 2 + 30, WDB.y + 59, 32, '#fff', 900, 'center');
  });
  // recent income
  text('Oxirgi tushumlar', SX + 40, SY + 610, 26, C.grey, 800);
  INCOME.forEach(([s, v, d], i) => { const y = SY + 640 + i * 84;
    rr(SX + 30, y, SW - 60, 72, 16); ctx.fillStyle = '#fff'; ctx.fill();
    text(s, SX + 55, y + 32, 24, C.ink, 700); text(d, SX + 55, y + 60, 20, C.grey, 600);
    text(`+${fmt(v)}`, SX + SW - 55, y + 46, 26, '#059669', 900, 'right'); });
  // withdraw sheet
  if (sheet > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.4 * sheet})`; ctx.fillRect(SX, SY, SW, SH);
    const y0 = lerp(SY + SH, SY + 470, sheet);
    rr(SX, y0, SW, SH, 44); ctx.fillStyle = '#fff'; ctx.fill();
    text('Kartaga yechish', SX + 50, y0 + 80, 34, C.ink, 900);
    [['Uzcard', '8600 •••• 4417'], ['Humo', '9860 •••• 1290']].forEach(([n, num], i) => {
      const y = y0 + 120 + i * 90, on = i === 0 && t > T17.card;
      rr(SX + 40, y, SW - 80, 76, 18); ctx.fillStyle = on ? '#ecfdf5' : '#f8fafc'; ctx.fill(); if (on) { ctx.lineWidth = 3; ctx.strokeStyle = '#10b981'; ctx.stroke(); }
      glyph('card', SX + 90, y + 38, .7, on ? '#059669' : '#64748b'); text(n, SX + 135, y + 47, 26, C.ink, 800); text(num, SX + SW - 70, y + 47, 24, '#334155', 700, 'right');
    });
    const amt = t > T17.all ? BAL : 0;
    rr(SX + 40, y0 + 310, SW - 80, 90, 18); ctx.fillStyle = '#f8fafc'; ctx.fill();
    text(amt ? `${fmt(amt)} soʻm` : 'Summa', SX + 70, y0 + 368, 32, amt ? C.ink : '#94a3b8', 900);
    scaled(ALL.x + ALL.w / 2, y0 + 355, 1 + .08 * bump(t, T17.all, .2), () => { rr(ALL.x, y0 + 327, ALL.w, ALL.h, 28); ctx.fillStyle = t > T17.all ? '#0ea371' : '#d1fae5'; ctx.fill(); text('Hammasi', ALL.x + ALL.w / 2, y0 + 364, 24, t > T17.all ? '#fff' : '#065f46', 800, 'center'); });
    withAlpha(prog(t, T17.all, T17.all + .3), () => { glyph('bolt', SX + 60, y0 + 450, .6, '#f59e0b'); text('Muddat: darhol · istalgan vaqtda', SX + 90, y0 + 460, 24, '#92400e', 800); });
    const done = t > T17.ok;
    scaled(OK.x + OK.w / 2, OK.y + 48, 1 - .05 * bump(t, T17.ok, .25), () => {
      rr(OK.x, OK.y, OK.w, OK.h, 48); ctx.fillStyle = done ? '#065f46' : '#0ea371'; ctx.fill();
      text(done ? (t > T17.flow[1] ? 'Oʻtkazildi ✓' : 'Oʻtkazilmoqda...') : 'Tasdiqlash', OK.x + OK.w / 2, OK.y + 61, 34, '#fff', 900, 'center');
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Daromad — istalgan vaqtda');
    const enter = eBack(prog(t, 11.1, 11.75)), shrink = eInOut(prog(t, T17.ok + .1, T17.ok + .4));
    scaled(W / 2, PY, lerp(.8, 1, enter) * lerp(1, .86, shrink), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => walletAduz(t))));
    // the bank card below the phone + the coin stream
    const cp = eBack(prog(t, T17.ok + .1, T17.ok + .45));
    if (cp > 0) scaled(W / 2, CARD.y + CARD.h / 2, cp, () => {
      const got = BAL * eInOut(prog(t, ...T17.flow));
      bankCard(CARD.x, CARD.y, CARD.w, CARD.h, 'Uzcard', '8600 •••• 4417', got, t > T17.flow[1] ? .6 * (1 - prog(t, T17.flow[1] + .5, T17.flow[1] + 1.5)) : 0);
    });
    for (let k = 0; k < 16; k++) {
      const at = T17.flow[0] + k * .06, p = prog(t, at, at + .5); if (p <= 0 || p >= 1) continue;
      const e = eIn(p), x = lerp(W / 2 + (k % 3 - 1) * 90, W / 2 + (k % 5 - 2) * 120, e), y = lerp(PY + 300, CARD.y + 80, e) - Math.sin(e * Math.PI) * 120;
      coin(x, y, 26 * (1 - .3 * e));
    }
    sparks(t, T17.flow[1], W / 2, CARD.y + 60, 187, [C.gold, '#fff'], 22, 400);
    // SMS banner
    const sp = eBack(prog(t, T17.sms, T17.sms + .35)) * (1 - eIn(prog(t, 18.2, 18.45)));
    if (sp > 0) { const y = lerp(-180, 90, sp);
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30; rr(70, y, W - 140, 150, 34); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.arc(140, y + 75, 38, 0, 7); ctx.fillStyle = '#1e3a8a'; ctx.fill(); glyph('card', 140, y + 75, .7);
      text('Uzcard · SMS', 200, y + 62, 26, C.grey, 700); text('hozir', W - 110, y + 62, 22, C.grey, 600, 'right');
      text(`+${fmt(BAL)} soʻm kelib tushdi`, 200, y + 108, 32, C.ink, 900); }
    const taps = [[T17.wd, WDB.x + WDB.w / 2 + 150, WDB.y + 46], [T17.card, SX + SW / 2 + 150, SY + 470 + 158], [T17.all, ALL.x + ALL.w / 2, SY + 470 + 355], [T17.ok, OK.x + OK.w / 2 + 150, OK.y + 48]];
    if (t > 11.8 && t < 14.3) {
      const [cx, cy] = pathAt(t, [[11.8, W - 40, 1650], ...taps, [14.3, W - 40, 1700]]);
      withAlpha(Math.min(prog(t, 11.8, 12.0), 1 - prog(t, 14.1, 14.3)), () => cursor(cx, cy, Math.max(...taps.map(([a]) => bump(t, a, .22)))));
    }
    for (const [a, x, y] of taps) if (a < T17.ok) ripple(x, y, prog(t, a, a + .6), '#ffffff');
  });
  const dim = prog(t, T17.slam - .05, T17.slam + .1) * (1 - prog(t, T17.sheet - .2, T17.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T17.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T17.slam, W / 2, 880, 189, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T17.slam, 'PUL — SIZNIKI', W / 2, 840, 130, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T17.slam + .15, 'istalgan vaqtda — kartaga', W / 2, 1010, 54, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T17.slam, '#fff3c4', .35, .5);
  // success sheet (full-frame card, the phone is smaller now)
  const mp = eOut(prog(t, T17.sheet, T17.sheet + .45));
  if (mp > 0) {
    withAlpha(.55 * mp, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
    const y0 = lerp(H, 760, mp);
    rr(120, y0, W - 240, 760, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T17.sheet + .2, T17.sheet + .6));
    ctx.beginPath(); ctx.arc(W / 2, y0 + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(W / 2, y0 + 152, 70, '#fff', 13, prog(t, T17.sheet + .45, T17.sheet + .8));
    withAlpha(prog(t, T17.sheet + .6, T17.sheet + .9), () => {
      text('Pul kartangizda!', W / 2, y0 + 300, 46, C.ink, 800, 'center');
      ['Istalgan vaqtda — 24/7', 'Toʻgʻridan-toʻgʻri kartaga', 'Bahonasiz, kutishsiz'].forEach((s, i) =>
        withAlpha(prog(t, T17.sheet + .9 + i * .25, T17.sheet + 1.15 + i * .25), () => {
          check(220, y0 + 390 + i * 74, 26, '#16c784', 6);
          text(s, 260, y0 + 401 + i * 74, 32, '#334155', 600);
        }));
    });
  }
