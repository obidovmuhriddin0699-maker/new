<script>
// ADUZ — 7-qism: "Platforma interfeysi bilan tanishuv"
// Scenes for this episode; shared helpers live in lib.js (incl. the motion toolkit).
// Sound is built from the cue sheet in audio.py (CUES_7) — see SOUND_ARCHITECTURE.md.
// Editing notes: J-cuts (sound leads picture into every transition), a "sound vacuum" at 9.5 s
// when the app closes, and three different transitions (squeegee wipe, whip-pan) to vary the rhythm.

const CAPTIONS = [
  [0.4, 5.0, 'Reklama kabinetini ochdingiz: oʻnlab menyu, notanish atamalar...'],
  [5.2, 9.4, 'CPM, CTR, piksel, strategiya... Qayerdan boshlash kerak?'],
  [9.6, 10.5, '...va ilova yopiladi.'],
  [11.4, 16.2, 'ADUZ boshqacha: har ekranda bitta savol, katta va tushunarli tugmalar.'],
  [16.4, 21.6, 'Uch qadam — va reklamangiz ishga tushdi. Qoʻllanma shart emas.'],
  [22.4, 27.0, 'Murakkablik yoʻq — faqat natija.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];

function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'store') { for (const [dx, dy] of [[-13, -13], [13, -13], [-13, 13], [13, 13]]) { rr(dx - 10, dy - 10, 20, 20, 5); ctx.fill(); } }
  else if (kind === 'plane') { ctx.beginPath(); ctx.moveTo(26, -4); ctx.lineTo(-24, -20); ctx.lineTo(-12, 0); ctx.lineTo(-22, 20); ctx.closePath(); ctx.fill(); }
  else if (kind === 'chart') { [[-18, 8], [-2, 18], [14, 28]].forEach(([dx, h]) => { rr(dx - 6, 18 - h, 12, h, 3); ctx.fill(); }); }
  else if (kind === 'shop') { rr(-22, -6, 44, 30, 4); ctx.fill(); ctx.beginPath(); ctx.moveTo(-26, -6); ctx.lineTo(-18, -24); ctx.lineTo(18, -24); ctx.lineTo(26, -6); ctx.closePath(); ctx.fill(); }
  else if (kind === 'service') { ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.stroke(); for (let k = 0; k < 8; k++) { const a = k * .785; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 18, Math.sin(a) * 18); ctx.lineTo(Math.cos(a) * 26, Math.sin(a) * 26); ctx.stroke(); } }
  else if (kind === 'event') { rr(-22, -18, 44, 40, 6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-22, -6); ctx.lineTo(22, -6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-10, -26); ctx.lineTo(-10, -14); ctx.moveTo(10, -26); ctx.lineTo(10, -14); ctx.stroke(); }
  else if (kind === 'tap') { ctx.beginPath(); ctx.arc(0, 4, 10, 0, 7); ctx.fill(); for (const r of [20, 30]) { ctx.beginPath(); ctx.arc(0, 4, r, -2.6, -.55); ctx.stroke(); } }
  else if (kind === 'bulb') { ctx.beginPath(); ctx.arc(0, -6, 18, 0, 7); ctx.fill(); rr(-9, 12, 18, 14, 3); ctx.fill(); }
  else if (kind === 'chat') { rr(-26, -20, 52, 36, 12); ctx.fill(); ctx.beginPath(); ctx.moveTo(-10, 16); ctx.lineTo(-18, 28); ctx.lineTo(4, 16); ctx.fill(); }
  ctx.restore();
}

// ---------- SCENE 1 — Muammo ----------
const JARGON = ['Bid strategiyasi ▾', 'CPM 12 400', 'CTR 0,8%', 'Lookalike 3%', 'Pixel ID', 'utm_source', 'A/B test?', 'Retargeting', 'CPC 1 900', 'Frequency cap', 'ROAS', 'Konversiya oynasi'];
const FRAGS = (() => { const r = rnd(71); return JARGON.map((s, i) => ({ s, at: .8 + i * .55, a: r() * 6.28, rad: 470 + r() * 120, sp: (r() - .5) * .5, rot: (r() - .5) * .5, ph: r() * 6 })); })();
const POPUPS = [
  [1.2, 'tip'], [2.2, 'dropdown'], [3.2, 'pixel'], [4.2, 'payment'], [5.0, 'manual'],
];
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const CLOSE = 9.6;
function cabinet(t) {
  ctx.fillStyle = '#eef1f5'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#1f2937'; ctx.fillRect(SX, SY, SW, 130);
  text('Reklama kabineti', SX + 40, SY + 92, 32, '#fff', 800);
  ctx.fillStyle = '#374151'; ctx.fillRect(SX, SY + 130, SW, 58);
  let tx = SX + 24;
  ['Kampaniyalar', 'Guruhlar', 'Eʼlonlar', 'Auditoriya', 'Piksel', 'Hisobot'].forEach((s, i) => {
    text(s, tx, SY + 167, 20, i === 0 ? '#fff' : '#9ca3af', 700); ctx.font = `700 20px ${F}`; tx += ctx.measureText(s).width + 26;
  });
  for (let i = 0; i < 9; i++) { rr(SX + 24 + i * 52, SY + 202, 40, 40, 8); ctx.fillStyle = '#d1d5db'; ctx.fill(); }
  text('Ustunlar ▾', SX + SW - 30, SY + 230, 20, '#4b5563', 700, 'right');
  const cols = ['Nomi', 'Holat', 'CPM', 'CTR', 'CPC', 'Byudjet'], cx = [SX + 24, SX + 250, SX + 330, SX + 420, SX + 500, SX + 590];
  ctx.fillStyle = '#e5e7eb'; ctx.fillRect(SX, SY + 256, SW, 44);
  cols.forEach((c, i) => text(c, cx[i], SY + 285, 18, '#374151', 800));
  const r = rnd(5);
  for (let row = 0; row < 12; row++) {
    const y = SY + 300 + row * 52;
    ctx.fillStyle = row % 2 ? '#f9fafb' : '#ffffff'; ctx.fillRect(SX, y, SW, 52);
    text(`Kampaniya_v${row + 2}_final`, cx[0], y + 33, 18, '#111827', 600);
    ctx.beginPath(); ctx.arc(cx[1] + 12, y + 27, 7, 0, 7); ctx.fillStyle = r() < .5 ? '#f59e0b' : '#9ca3af'; ctx.fill();
    text(fmt(8000 + Math.floor(r() * 9000)), cx[2], y + 33, 18, '#374151', 500);
    text(`${(r() * 2).toFixed(1)}%`, cx[3], y + 33, 18, '#374151', 500);
    text(fmt(900 + Math.floor(r() * 2000)), cx[4], y + 33, 18, '#374151', 500);
    text(fmt(50000 + Math.floor(r() * 400000)), cx[5], y + 33, 18, '#374151', 500);
  }
  // popups stack up
  for (const [at, kind] of POPUPS) {
    const p = eBack(prog(t, at, at + .3));
    if (p <= 0) continue;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 30;
    if (kind === 'tip') scaled(SX + 260, SY + 360, p, () => {
      rr(SX + 40, SY + 320, 480, 150, 14); ctx.fillStyle = '#111827'; ctx.fill(); ctx.shadowBlur = 0;
      text('Bid strategiyasini tanlang:', SX + 64, SY + 362, 22, '#fff', 700);
      text('Lowest cost · Cost cap · Bid cap · ROAS', SX + 64, SY + 400, 19, '#9ca3af', 500);
      text('Batafsil: 14-boʻlimga qarang', SX + 64, SY + 440, 19, '#60a5fa', 600);
    });
    if (kind === 'dropdown') scaled(SX + 470, SY + 470, p, () => {
      rr(SX + 300, SY + 420, 400, 330, 12); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowBlur = 0;
      text('Optimallashtirish maqsadi', SX + 320, SY + 458, 20, '#111827', 800);
      ['Konversiya', 'Reach', 'ThruPlay', 'Link click', 'Landing page view', 'Value', 'Impressions'].forEach((s, i) =>
        text(s, SX + 330, SY + 500 + i * 36, 19, i === 2 ? '#2563eb' : '#374151', 600));
    });
    if (kind === 'pixel') scaled(SX + SW / 2, SY + 640, p, () => {
      rr(SX + 30, SY + 540, SW - 60, 230, 16); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowBlur = 0;
      text('Pikselni saytga oʻrnating', SX + 56, SY + 584, 24, '#111827', 800);
      rr(SX + 56, SY + 604, SW - 112, 140, 10); ctx.fillStyle = '#0f172a'; ctx.fill();
      ['<script>', "  pixel.init('8237 4410 9921');", "  pixel.track('PageView');", '<\/script>'].forEach((l, i) =>
        text(l, SX + 76, SY + 640 + i * 30, 19, i % 3 ? '#a5f3fc' : '#f472b6', 600));
    });
    if (kind === 'payment') scaled(SX + SW / 2, SY + 840, p, () => {
      rr(SX + 20, SY + 800, SW - 40, 80, 12); ctx.fillStyle = '#fee2e2'; ctx.fill(); ctx.shadowBlur = 0;
      text('⚠ Toʻlov usuli tasdiqlanmagan', SX + 44, SY + 850, 23, '#b91c1c', 800);
    });
    if (kind === 'manual') scaled(SX + SW / 2, SY + 990, p, () => {
      rr(SX + 60, SY + 910, SW - 120, 150, 16); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowBlur = 0;
      rr(SX + 84, SY + 934, 76, 100, 8); ctx.fillStyle = '#ef4444'; ctx.fill(); text('PDF', SX + 122, SY + 992, 22, '#fff', 900, 'center');
      text('Qoʻllanma.pdf', SX + 180, SY + 974, 26, '#111827', 800);
      text('128 sahifa · 34 MB', SX + 180, SY + 1012, 21, '#6b7280', 600);
    });
    ctx.restore();
  }
}
function scene1(t) {
  const stress = prog(t, 5, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr - .01 * stress * Math.sin(t * 1.3), sx, sy, () => {
    // floating jargon fragments orbit the phone, more and more of them
    for (const f of FRAGS) {
      const p = eBack(prog(t, f.at, f.at + .4));
      if (p <= 0) continue;
      const a = f.a + t * (f.sp + .15 * stress), x = W / 2 + Math.cos(a) * f.rad * 1.0, y = 980 + Math.sin(a) * f.rad * 1.55;
      const away = eIn(prog(t, CLOSE, CLOSE + .6));
      withAlpha((1 - away) * clamp((y - 360) / 90), () => {
        ctx.save(); ctx.translate(x, y); ctx.rotate(f.rot + Math.sin(t * 2 + f.ph) * .08); ctx.scale(p, p);
        ctx.font = `800 26px ${F}`; const w = ctx.measureText(f.s).width + 40;
        rr(-w / 2, -28, w, 56, 14); ctx.fillStyle = 'rgba(30,41,59,.92)'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(148,163,184,.5)'; ctx.stroke();
        text(f.s, 0, 2, 26, '#cbd5e1', 800, 'center', 'middle');
        ctx.restore();
      });
    }
    episodeTitle(t, '7-QISM', 'Platforma interfeysi', 60);
    const settings = Math.round(47 * eInOut(prog(t, .8, 6))), terms = FRAGS.filter(f => f.at <= t).length;
    counters(t, [[String(settings), 'sozlama', '#fff'], [String(terms), 'notanish atama', '#fff'], ['0', 'reklama', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#000', 0, lerp(160, 0, enter), 0, () => {
      // the app collapses to a dot: the user gives up
      const cp = eIn(prog(t, CLOSE, CLOSE + .45));
      if (cp < 1) scaled(SX + SW / 2, SY + SH / 2, 1 - cp, () => withAlpha(1 - cp * .5, () => cabinet(t)));
      if (cp > .8) { ctx.beginPath(); ctx.arc(SX + SW / 2, SY + SH / 2, 6 * (1 - prog(t, CLOSE + .6, CLOSE + 1.0)), 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }
      ctx.fillStyle = `rgba(255,40,60,${.08 * stress})`; ctx.fillRect(SX, SY, SW, SH);
    });
    // confused cursor wandering, tapping nothing
    if (t > 1.0 && t < 8.3) {
      const k = [[1.0, W - 40, 1500], [1.8, 420, 760], [2.6, 640, 900], [3.4, 380, 1050], [4.2, 700, 1180], [5.0, 460, 820], [5.8, 600, 1300], [6.6, 520, 980], [7.4, 360, 1150], [8.3, W - 40, 1600]];
      const [cx, cy] = pathAt(t, k);
      withAlpha(Math.min(prog(t, 1, 1.2), 1 - prog(t, 8.0, 8.3)), () => {
        cursor(cx, cy, 0);
        text('?', cx + 34, cy - 30, 44, '#fff', 900, 'center');
      });
    }
    slam(t, 5.6, 'CPM? CTR?', 330, 560, 54, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
    slam(t, 6.6, 'QAYERDAN BOSHLASH?', 700, 820, 42, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
    slam(t, 7.6, 'QOʻLLANMA: 128 SAHIFA', 420, 1420, 42, '#fff', { slab: C.red, rot: .05, hold: .9 });
  });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 71, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'CHALKASH', W / 2, 880, 190, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'va siz ilovani yopasiz', W / 2, 1060, 52, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  // sound vacuum: the world goes dark and still for a beat
  const vac = prog(t, 9.7, 10.1);
  if (vac > 0) withAlpha(vac * .5, () => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); });
}

// ---------- SCENE 2 — Yechim ----------
const T7 = { home: 11.6, tapAd: 13.0, s1: 13.2, tapShop: 14.0, s2: 14.3, dragA: 14.7, dragB: 15.5, tapNext: 15.75, s3: 16.0, launch: 16.8, live: 18.2, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T7.launch, 8], [T7.slam, 34]];
const BIG = [['Kanal topish', 'store', '#3b82f6'], ['Reklama berish', 'plane', '#16c784'], ['Natijani koʻrish', 'chart', '#a855f7']];
const bigBtn = i => ({ x: SX + 40, y: SY + 260 + i * 240, w: SW - 80, h: 210 });
const CHOICES = [['Doʻkon', 'shop'], ['Xizmat', 'service'], ['Tadbir', 'event']];
const choice = i => ({ x: SX + 40, y: SY + 380 + i * 160, w: SW - 80, h: 136 });
const NEXT = { x: SX + 40, y: SY + SH - 150, w: SW - 80, h: 100 };
const SLIDER = { x: SX + 90, y: SY + 600, w: SW - 180 };
const budget = t => 100000 + 400000 * eInOut(prog(t, T7.dragA, T7.dragB));
function stepTop(t, k, title) {
  ctx.fillStyle = '#fff'; ctx.fillRect(SX, SY, SW, 150);
  text('←', SX + 50, SY + 106, 40, C.grey, 700);
  text(`Qadam ${k} / 3`, SX + SW / 2, SY + 104, 28, C.grey, 700, 'center');
  for (let i = 0; i < 3; i++) { rr(SX + SW / 2 - 75 + i * 54, SY + 124, 42, 8, 4); ctx.fillStyle = i < k ? '#16c784' : '#e2e8f0'; ctx.fill(); }
  wrap(title, SW - 100, 50, 900).forEach((l, i) => text(l, SX + 50, SY + 230 + i * 62, 50, C.ink, 900));
}
function bigButton(b, label, kind, col, sel, press) {
  scaled(b.x + b.w / 2, b.y + b.h / 2, 1 - .04 * press, () => {
    ctx.save(); ctx.shadowColor = 'rgba(15,23,42,.1)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    rr(b.x, b.y, b.w, b.h, 30); ctx.fillStyle = sel ? '#ecfdf5' : '#fff'; ctx.fill(); ctx.restore();
    if (sel) { rr(b.x, b.y, b.w, b.h, 30); ctx.lineWidth = 5; ctx.strokeStyle = '#16c784'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(b.x + 90, b.y + b.h / 2, b.h > 160 ? 56 : 44, 0, 7); ctx.fillStyle = col; ctx.fill();
    glyph(kind, b.x + 90, b.y + b.h / 2, b.h > 160 ? 1.3 : 1);
    text(label, b.x + 180, b.y + b.h / 2 + 15, b.h > 160 ? 44 : 40, C.ink, 900);
    if (sel) { ctx.beginPath(); ctx.arc(b.x + b.w - 60, b.y + b.h / 2, 26, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(b.x + b.w - 60, b.y + b.h / 2 + 1, 24, '#fff', 6); }
  });
}
function nextBtn(t, label, at, col = '#0ea371') {
  const press = bump(t, at, .25);
  scaled(NEXT.x + NEXT.w / 2, NEXT.y + NEXT.h / 2, 1 - .05 * press, () => {
    rr(NEXT.x, NEXT.y, NEXT.w, NEXT.h, 50); ctx.fillStyle = col; ctx.fill();
    text(label, NEXT.x + NEXT.w / 2, NEXT.y + NEXT.h / 2 + 13, 38, '#fff', 900, 'center');
  });
}
const SCREENS = [
  t => { // home
    ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 200);
    text('Bugun nima', SX + 50, SY + 106, 50, '#fff', 900);
    text('qilamiz?', SX + 50, SY + 166, 50, '#fff', 900);
    BIG.forEach(([l, k, c], i) => {
      const p = eBack(prog(t, T7.home + i * .15, T7.home + .45 + i * .15));
      if (p > 0) scaled(SX + SW / 2, bigBtn(i).y + 105, p, () => bigButton(bigBtn(i), l, k, c, i === 1 && t > T7.tapAd, i === 1 ? bump(t, T7.tapAd, .25) : 0));
    });
  },
  t => { // step 1
    stepTop(t, 1, 'Nimani reklama qilamiz?');
    CHOICES.forEach(([l, k], i) => {
      const p = eBack(prog(t, T7.s1 + .2 + i * .12, T7.s1 + .6 + i * .12));
      if (p > 0) scaled(SX + SW / 2, choice(i).y + 68, p, () => bigButton(choice(i), l, k, ['#f59e0b', '#06b6d4', '#ec4899'][i], i === 0 && t > T7.tapShop, i === 0 ? bump(t, T7.tapShop, .25) : 0));
    });
    const hp = eBack(prog(t, T7.s1 + .5, T7.s1 + .9));
    if (hp > 0) scaled(SX + SW / 2, SY + 900, hp, () => {
      rr(SX + 90, SY + 870, SW - 180, 70, 35); ctx.fillStyle = '#fef9c3'; ctx.fill();
      glyph('bulb', SX + 140, SY + 905, .7, '#ca8a04');
      text('Har ekranda bitta savol', SX + 180, SY + 916, 27, '#854d0e', 800);
    });
  },
  t => { // step 2
    stepTop(t, 2, 'Byudjetingiz qancha?');
    const v = budget(t);
    text(`${fmt(Math.round(v / 10000) * 10000)} soʻm`, SX + SW / 2, SY + 470, 72, '#059669', 900, 'center');
    const s = SLIDER, px = s.x + s.w * (v - 100000) / 900000;
    rr(s.x, s.y - 10, s.w, 20, 10); ctx.fillStyle = '#e2e8f0'; ctx.fill();
    rr(s.x, s.y - 10, px - s.x, 20, 10); ctx.fillStyle = '#16c784'; ctx.fill();
    ctx.save(); ctx.shadowColor = 'rgba(22,199,132,.6)'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(px, s.y, 40, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(px, s.y, 40, 0, 7); ctx.lineWidth = 10; ctx.strokeStyle = '#16c784'; ctx.stroke();
    text('100 ming', s.x, s.y + 80, 24, C.grey, 600, 'center');
    text('1 mln', s.x + s.w, s.y + 80, 24, C.grey, 600, 'right');
    text(`≈ ${fmt(Math.round(v / 55 / 100) * 100)} koʻrish`, SX + SW / 2, SY + 780, 34, C.ink, 800, 'center');
    nextBtn(t, 'Keyingi  →', T7.tapNext);
  },
  t => { // step 3
    stepTop(t, 3, 'Hammasi tayyor!');
    rr(SX + 40, SY + 300, SW - 80, 430, 30); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.save(); rr(SX + 40, SY + 300, SW - 80, 220, 30); ctx.clip();
    const g = ctx.createLinearGradient(SX, SY + 300, SX + SW, SY + 520); g.addColorStop(0, '#f472b6'); g.addColorStop(1, '#7c3aed');
    ctx.fillStyle = g; ctx.fillRect(SX + 40, SY + 300, SW - 80, 220); ctx.restore();
    glyph('shop', SX + SW / 2, SY + 410, 2.2);
    text('Fargʻona kiyim doʻkoni', SX + 70, SY + 575, 32, C.ink, 800);
    text('Doʻkon · 500 000 soʻm · 6 kanal', SX + 70, SY + 625, 26, C.grey, 600);
    text('≈ 9 000 koʻrish', SX + 70, SY + 680, 26, '#059669', 800);
    if (t < T7.launch + .1) nextBtn(t, 'Ishga tushirish', T7.launch);
    else {
      const lp = prog(t, T7.launch + .1, T7.live), done = t > T7.live;
      rr(NEXT.x, NEXT.y, NEXT.w, NEXT.h, 50); ctx.fillStyle = done ? '#065f46' : '#0ea371'; ctx.fill();
      if (!done) {
        ctx.beginPath(); ctx.arc(NEXT.x + 120, NEXT.y + 50, 24, -Math.PI / 2, -Math.PI / 2 + lp * 6.28); ctx.lineWidth = 7; ctx.strokeStyle = '#fff'; ctx.stroke();
        text('Ishga tushmoqda...', NEXT.x + NEXT.w / 2 + 30, NEXT.y + 63, 36, '#fff', 800, 'center');
      } else { check(NEXT.x + 150, NEXT.y + 50, 30, '#fff', 8, prog(t, T7.live, T7.live + .3)); text('Ishga tushdi!', NEXT.x + NEXT.w / 2 + 30, NEXT.y + 63, 38, '#fff', 900, 'center'); }
    }
    const mp = eOut(prog(t, T7.sheet, T7.sheet + .45));
    if (mp > 0) {
      ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
      const sy = lerp(SY + SH, SY + SH - 640, mp);
      rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
      const c = eBack(prog(t, T7.sheet + .2, T7.sheet + .6));
      ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
      if (c > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T7.sheet + .45, T7.sheet + .8));
      withAlpha(prog(t, T7.sheet + .6, T7.sheet + .9), () => {
        text('Kampaniya ishga tushdi!', SX + SW / 2, sy + 300, 42, C.ink, 800, 'center');
        ['Hech qanday murakkab atama yoʻq', 'Har qadamda bitta savol', 'Oʻzbek tilida, sodda'].forEach((s, i) =>
          withAlpha(prog(t, T7.sheet + .9 + i * .25, T7.sheet + 1.15 + i * .25), () => {
            check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
            text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
          }));
      });
    }
  },
];
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Sodda va tushunarli');
    const enter = eBack(prog(t, 11.1, 11.75));
    const cuts = [T7.s1, T7.s2, T7.s3];
    let cur = 0; cuts.forEach(c => { if (t >= c) cur++; });
    const sp = cur > 0 ? eInOut(prog(t, cuts[cur - 1], cuts[cur - 1] + .4)) : 1;
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => {
        if (cur > 0 && sp < 1) { ctx.save(); ctx.translate(-SW * sp, 0); ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH); SCREENS[cur - 1](t); ctx.restore(); }
        ctx.save(); ctx.translate(cur > 0 ? SW * (1 - sp) : 0, 0); ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH); SCREENS[cur](t); ctx.restore();
      })));
    // cursor
    const ad = bigBtn(1), sh = choice(0), sl = SLIDER;
    const sliderX = v => sl.x + sl.w * (v - 100000) / 900000;
    const keys = [[11.9, W - 40, 1600], [T7.tapAd, ad.x + ad.w - 160, ad.y + 105], [13.55, sh.x + sh.w - 180, sh.y + 68], [T7.tapShop, sh.x + sh.w - 180, sh.y + 68],
      [T7.dragA, sliderX(100000), sl.y], [T7.dragB, sliderX(500000), sl.y], [T7.tapNext, NEXT.x + NEXT.w / 2 + 80, NEXT.y + 50],
      [16.4, NEXT.x + NEXT.w / 2 + 80, NEXT.y + 50], [T7.launch, NEXT.x + NEXT.w / 2 + 80, NEXT.y + 50]];
    if (t > 11.9 && t < 17.3) {
      const [cx, cy] = pathAt(t, keys);
      const press = Math.max(...[T7.tapAd, T7.tapShop, T7.tapNext, T7.launch].map(a => bump(t, a, .22)), t > T7.dragA && t < T7.dragB ? 1 : 0);
      withAlpha(Math.min(prog(t, 11.9, 12.1), 1 - prog(t, 17.0, 17.3)), () => cursor(cx, cy, press));
    }
    for (const [at, x, y] of [[T7.tapAd, ad.x + ad.w - 160, ad.y + 105], [T7.tapShop, sh.x + sh.w - 180, sh.y + 68], [T7.tapNext, NEXT.x + NEXT.w / 2 + 80, NEXT.y + 50], [T7.launch, NEXT.x + NEXT.w / 2 + 80, NEXT.y + 50]])
      ripple(x, y, prog(t, at, at + .6), '#16c784');
  });
  const dim = prog(t, T7.slam - .05, T7.slam + .1) * (1 - prog(t, T7.sheet - .2, T7.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T7.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T7.slam, W / 2, 880, 77, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T7.slam, '3 QADAM', W / 2, 840, 210, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T7.slam + .15, 'qoʻllanmasiz', W / 2, 1030, 76, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T7.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const ROWS = [['47 ta sozlama', '3 ta qadam'], ['12 ta notanish atama', '0 ta atama'], ['128 sahifa qoʻllanma', 'Qoʻllanma shart emas'], ['3 kun oʻrganish', '2 daqiqa']];
const IMPACTS3 = [[22.15, 22], [25.0, 16]];
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    glyph(kind, bx, by, 1.5);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {
    resultBg(t);
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha(1 - out, () => {
      withAlpha(prog(t, 22.2, 22.6), () => {
        text('NATIJA', W / 2, 190, 34, C.gold, 800, 'center');
        text('Sodda — demak tez', W / 2, 260, 60, '#fff', 800, 'center');
      });
      const cp = eOut(prog(t, 22.3, 22.9)), x = 90, y = lerp(410, 340, cp), w = 900, h = 640;
      withAlpha(cp, () => {
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
        rr(x, y, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
        text('Oldin', x + 60, y + 80, 30, C.grey, 800);
        rr(x + 470, y + 44, 200, 52, 26); ctx.fillStyle = '#d1fae5'; ctx.fill();
        text('ADUZ', x + 570, y + 80, 30, '#065f46', 900, 'center');
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + w / 2 - 20, y + 120, 2, h - 160);
        ROWS.forEach(([a, b], i) => {
          const ry = y + 190 + i * 115, st = eInOut(prog(t, 22.8 + i * .35, 23.1 + i * .35)), ok = eBack(prog(t, 23.0 + i * .35, 23.3 + i * .35));
          text(a, x + 60, ry, 30, st > 0 ? '#94a3b8' : '#334155', 700);
          if (st > 0) {
            ctx.font = `700 30px ${F}`; const tw = ctx.measureText(a).width;
            ctx.beginPath(); ctx.moveTo(x + 55, ry - 10); ctx.lineTo(x + 55 + (tw + 10) * st, ry - 10); ctx.lineWidth = 5; ctx.strokeStyle = C.red; ctx.stroke();
          }
          if (ok > 0) scaled(x + 470, ry - 10, ok, () => {
            ctx.beginPath(); ctx.arc(x + 490, ry - 10, 20, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(x + 490, ry - 9, 18, '#fff', 5);
            text(b, x + 525, ry, 30, '#059669', 900);
          });
        });
      });
      [['Sodda', 'tap'], ['Tushunarli', 'bulb'], ['Oʻzbekcha', 'chat']].forEach(([l, k], i) => {
        const p = eBack(prog(t, 25.2 + i * .25, 25.65 + i * .25));
        if (p > 0) badge(230 + i * 310, 1200, l, k, p);
      });
    });
  });
  shockwave(t, 25.0, W / 2, 800, C.gold, 900);
  sparks(t, 25.0, W - 200, 820, 79, [C.gold, '#fff', '#22e39a'], 34, 1100);
  confetti(t, 25.0);
  endCard(t, 27.0);
}

boot({
  scene1, scene2, scene3, captions: CAPTIONS,
  transitions: [
    { a: 10.55, b: 11.0, fn: (t, a, b, A, B) => squeegee(t, a, b, A, B, '#22e39a') },
    { a: 21.75, b: 22.15, fn: whipPan },
  ],
  overlay: t => { filmLook(t); flash(t, 11.0, '#ffffff', .3, .5); },
});
