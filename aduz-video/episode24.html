<script>
// ADUZ — 24-qism: "Doimiy hamroh (24/7 yordam)" — birinchi "MOTION REEL" qism (reel.js, foydalanuvchi referens videosi).
// Problem: at 23:40 a client writes to a support chat — six messages, grey single ticks, "offline", a timer racing to
// 3 hours; JAVOB YO'Q · OFFLINE · SOVUQ; full-bleed orange cut "SOVUQ." Vacuum: the last "Allo?" decodes into noise
// over a flat orange line. Transition: grid wave with the serif word "Yordam.". Solution: on a paper ground, flat
// UI cards — "Jonli menejer" toggle switched on, a live manager answers in 47 s, donut 98% solved, 24-hour bars;
// lime full-bleed "JAVOB BOR."; violet keyframe card "Siz yolg'iz emassiz.". Result: stripes "24/7", before/after card,
// palette badges. End: identity card (letters fall into ADUZ, orbit, underline). Sound: CUES_24 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Kechasi 23:40. Toʻlov oʻtmadi — yozasiz, yozasiz...'],
  [4.6, 9.4, '...javob yoʻq. Operator offline. Siz — yolgʻiz.'],
  [9.6, 10.3, '...hech kim yoʻq.'],
  [11.4, 16.2, 'ADUZ: jonli, malakali menejer — 47 soniyada javob.'],
  [16.4, 21.6, 'Kechasi ham, dam olishda ham. 24/7.'],
  [22.4, 27.0, 'Doimiy hamroh — har doim yoningizda.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
const SECTIONS = [[0, '00', 'IGNITION'], [1, '01', 'MUAMMO'], [9.5, '02', 'VAKUUM'], [10.3, '03', 'OTISH'], [11, '04', 'YECHIM'], [22, '05', 'NATIJA'], [27, '06', 'ADUZ']];
function glyph(kind, x, y, s = 1, col = R.ink) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'people') { [[-15, 0, .8], [15, 0, .8], [0, 4, 1]].forEach(([dx, dy, k]) => { ctx.beginPath(); ctx.arc(dx, dy - 14 * k, 9 * k, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(dx, dy + 18 * k, 16 * k, Math.PI, 0); ctx.fill(); }); }
  else if (kind === 'clock') { ctx.beginPath(); ctx.arc(0, 0, 28, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, 0); ctx.lineTo(12, 8); ctx.stroke(); }
  else if (kind === 'bolt') { ctx.beginPath(); ctx.moveTo(6, -32); ctx.lineTo(-16, 4); ctx.lineTo(0, 4); ctx.lineTo(-6, 32); ctx.lineTo(16, -6); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
// Chat bubble: side 'r' (client) / 'l' (manager). Returns height.
function bubble(x, y, maxW, s, side, fill, col, meta = '', metaCol = R.grey, size = 32) {
  const lines = wrap(s, maxW - 60, size, 600), lh = size * 1.3, w = Math.min(maxW, Math.max(...lines.map(l => { ctx.font = fnt(600, size); return ctx.measureText(l).width; })) + 60 + (meta ? 120 : 0)), h = lines.length * lh + 36;
  const bx = side === 'r' ? x - w : x;
  rr(bx, y, w, h, 26); ctx.fillStyle = fill; ctx.fill();
  lines.forEach((l, i) => text(l, bx + 30, y + 18 + lh * (i + .5) + 2, size, col, 600, 'left', 'middle'));
  if (meta) mono(meta, bx + w - 24, y + h - 22, 16, metaCol, 'right', .1, 700);
  return h;
}
const curve = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], eInOut(clamp((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])))); return keys[keys.length - 1][1]; };
// Tilted slab card with a heavy word (problem slams).
function slabCard(t, at, s, x, y, size, bg, fg, rot, hold) {
  const p = prog(t, at, at + .3), q = prog(t, at + hold, at + hold + .2); if (p <= 0 || q >= 1) return;
  ctx.save(); ctx.globalAlpha *= clamp(p * 3) * (1 - q); ctx.translate(x, y); ctx.rotate(rot * eOut(p) + (1 - eOut(p)) * -.4);
  const sc = lerp(1.8, 1, eBack(p)); ctx.scale(sc, sc);
  ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width;
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  rr(-w / 2 - size * .5, -size * .72, w + size, size * 1.44, size * .36); ctx.fillStyle = bg; ctx.fill(); ctx.shadowColor = 'transparent';
  text(s, 0, size * .04, size, fg, 900, 'center', 'middle'); ctx.restore();
}

// ---------- SCENE 1 — Muammo: left unanswered ----------
const MSGS = [[1.0, 'Assalomu alaykum! Toʻlov oʻtmadi', '23:40'], [2.2, 'Reklama ertaga chiqishi kerak edi...', '23:52'], [3.6, 'Javob bera olasizmi?', '00:31'], [4.8, '???', '01:15'], [6.0, 'Allo?', '02:08'], [7.0, 'Hech kim yoʻqmi...', '02:54']];
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const CH = { x: 90, y: 440, w: 900, h: 980 };
function waitClock(t) { const s = 10800 * eIn(prog(t, 1.0, 8.4)) + 47 * prog(t, 8.4, 9.5); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, Math.floor(s) % 60]; }
function chat1(t) {
  card(CH.x, CH.y, CH.w, CH.h, R.ink2, 34);
  ctx.save(); rr(CH.x, CH.y, CH.w, CH.h, 34); ctx.clip();
  ctx.fillStyle = '#1f1c23'; ctx.fillRect(CH.x, CH.y, CH.w, 130);
  ctx.beginPath(); ctx.arc(CH.x + 75, CH.y + 65, 38, 0, 7); ctx.fillStyle = '#3a373d'; ctx.fill(); glyph('people', CH.x + 75, CH.y + 68, .75, '#6c6870');
  text('Yordam xizmati', CH.x + 135, CH.y + 58, 34, R.off, 800);
  mono('OXIRGI MARTA: 3 KUN OLDIN', CH.x + 135, CH.y + 96, 15, R.grey, 'left', .2, 700);
  ctx.beginPath(); ctx.arc(CH.x + CH.w - 160, CH.y + 65, 8, 0, 7); ctx.fillStyle = R.orange; ctx.fill();
  mono('OFFLINE', CH.x + CH.w - 40, CH.y + 66, 18, R.orange, 'right', .3, 700);
  // messages stack from the bottom, older ones scroll up
  const shown = MSGS.filter(m => t > m[0]);
  let y = CH.y + CH.h - 40;
  for (let i = shown.length - 1; i >= 0; i--) {
    const [at, s, tm] = shown[i], p = eBack(prog(t, at, at + .3));
    ctx.font = fnt(600, 32); const lines = wrap(s, 560, 32, 600), h = lines.length * 41.6 + 36;
    y -= h + 22 * p; if (y < CH.y + 140) break;
    scaled(CH.x + CH.w - 40, y + h, p, () => bubble(CH.x + CH.w - 40, y, 620, s, 'r', R.off, R.ink, `${tm}  ✓`, '#8b8790'));
  }
  ctx.restore();
  // waiting timer
  const [hh, mm, ss] = waitClock(t), tp = prog(t, 1.2, 1.6);
  withAlpha(tp, () => {
    mono('JAVOB KUTILMOQDA', CH.x, 1475, 18, R.grey, 'left', .32, 700);
    ctx.save(); ctx.letterSpacing = '2px'; ctx.font = `700 76px ${MONO}`; ctx.fillStyle = hh >= 1 ? R.orange : R.off; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`, CH.x - 4, 1545); ctx.restore();
    tickLine(CH.x + CH.w - 220, 1545, 420, 1, R.orange, 'rgba(239,236,228,.35)');
  });
}
function scene1(t) {
  const stress = prog(t, 4.0, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera((1 + .05 * eInOut(prog(t, 0, 10.4))) * punch(t, MSGS.map(m => m[0]), .02), sr, sx, sy, () => {
    scramble(t, .1, '24-QISM', W / 2, 140, 26, R.orange, { dur: .6 });
    tickLine(W / 2, 172, 520, eInOut(prog(t, .1, .7)));
    heavy(t, .45, 'DOIMIY HAMROH', W / 2, 228, 84, R.off, { rot: -.08 });
    const sent = MSGS.filter(m => t > m[0]).length, [hh] = waitClock(t);
    counters(t, [[String(sent), 'xabar', '#fff'], ['0', 'javob', R.orange], [`${hh} soat`, 'kutish', R.orange]]);
    const enter = eOut(prog(t, 0, .7));
    camera(1, 0, 0, lerp(160, 0, enter), () => withAlpha(enter, () => chat1(t)));
  });
  slabCard(t, 5.6, 'JAVOB YOʻQ', 330, 650, 56, R.orange, R.ink, -.08, 2.9);
  slabCard(t, 6.6, 'OFFLINE', 760, 980, 60, R.violet, R.off, .07, 1.9);
  slabCard(t, 7.6, 'SOVUQ MUNOSABAT', 520, 1320, 48, R.off, R.ink, -.05, .9);
  // 8.5: full-bleed orange cut
  const cut = prog(t, 8.45, 8.6) * (1 - prog(t, 9.3, 9.45));
  if (t > 8.45 && t < 9.5) {
    const k = eOut(prog(t, 8.45, 8.62)), rw = lerp(500, W + 40, k), rh = lerp(260, H + 40, k);
    withAlpha(cut, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(130, 0, k)); ctx.fillStyle = R.orange; ctx.fill();
      heavy(t, 8.5, 'SOVUQ.', W / 2, 860, 250, R.ink, { rot: -.12, endRot: -.04 });
      withAlpha(prog(t, 8.7, 8.9), () => serif('va javobsiz qoldingiz', W / 2, 1050, 76, R.ink));
      // black disc with a sad dot grid (the reel's "MOVE" circle)
      const dp = eBack(prog(t, 8.6, 8.9)); if (dp > 0) scaled(810, 1360, dp, () => { ctx.beginPath(); ctx.arc(810, 1360, 150, 0, 7); ctx.fillStyle = R.ink; ctx.fill();
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(810 + (i - 1) * 50, 1360 + (j - 1) * 50, 17, 0, 7); ctx.fillStyle = (i + j) % 3 ? R.off : R.grey; ctx.fill(); } });
    });
  }
  // vacuum: flat line + the last "Allo?" decodes into noise
  if (t > 9.5) {
    ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H);
    tickLine(W / 2, 1040, 860, 1, R.orange, 'rgba(239,236,228,.4)');
    const p = prog(t, 9.6, 10.25);
    withAlpha(1 - eIn(prog(t, 9.95, 10.3)), () => {
      if (p < .35) bubble(W / 2 + 130, 820, 400, 'Allo?', 'r', R.off, R.ink, '02:08  ✓', '#8b8790', 48);
    });
    if (p >= .35) withAlpha(1 - eIn(prog(t, 9.95, 10.3)), () => mono([...'ALLO?'].map((c, i) => SCR[Math.abs(Math.floor(Math.sin((i + 1) * 9.1 + Math.floor(t * 30) * 3.3) * 999)) % SCR.length]).join(''), W / 2, 870, 64, R.off, 'center', .4, 700));
    disintegrate(W / 2 - 330, 790, 660, 170, clamp((p - .5) / .5), R.ink, 461, 10);
  }
}

// ---------- SCENE 2 — Yechim: live manager, 24/7 ----------
const T24 = { tog: 12.3, ask: 12.7, typing: 13.15, r1: 13.65, r2: 14.4, thx: 15.0, resp: 15.4, donut: 16.0, bars: 16.6, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T24.tog, 10], [T24.r1, 8], [T24.slam, 34]];
const CB = { x: 70, y: 550, w: 940, h: 560 };
const TOG = { x: 840, y: 413 };
function chat2(t) {
  card(CB.x, CB.y, CB.w, CB.h, R.card, 30);
  ctx.save(); rr(CB.x, CB.y, CB.w, CB.h, 30); ctx.clip();
  const on = t > T24.tog;
  ctx.beginPath(); ctx.arc(CB.x + 70, CB.y + 64, 36, 0, 7); ctx.fillStyle = R.violet; ctx.fill(); text('DN', CB.x + 70, CB.y + 66, 28, R.off, 900, 'center', 'middle');
  text('Dilnoza · ADUZ menejeri', CB.x + 125, CB.y + 58, 32, R.ink, 800);
  if (on) { ctx.beginPath(); ctx.arc(CB.x + 133, CB.y + 92, 7, 0, 7); ctx.fillStyle = '#5bbf2a'; ctx.fill(); }
  mono(on ? 'ONLAYN  /  24/7' : 'ULANMOQDA...', CB.x + (on ? 150 : 125), CB.y + 93, 15, on ? R.ink : R.grey, 'left', .25, 700);
  ctx.fillStyle = '#e4e1da'; ctx.fillRect(CB.x + 30, CB.y + 128, CB.w - 60, 2);
  let y = CB.y + 160;
  const add = (at, s, side, meta, mc) => { const p = eBack(prog(t, at, at + .3)); if (p <= 0) return;
    const x = side === 'r' ? CB.x + CB.w - 30 : CB.x + 30;
    let h = 0; scaled(x, y, p, () => { h = bubble(x, y, 640, s, side, side === 'r' ? R.ink : R.violet, R.off, meta, mc, 30); }); y += h + 16; };
  add(T24.ask, 'Toʻlov oʻtmadi, yordam bering!', 'r', '23:40  ✓✓', R.lime);
  if (t > T24.typing && t < T24.r1) { const p = eBack(prog(t, T24.typing, T24.typing + .25)); scaled(CB.x + 30, y + 30, p, () => { rr(CB.x + 30, y, 150, 64, 26); ctx.fillStyle = R.violetSoft; ctx.fill();
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(CB.x + 70 + i * 34, y + 32 - 8 * Math.max(0, Math.sin(t * 12 - i)), 9, 0, 7); ctx.fillStyle = R.violet; ctx.fill(); } }); }
  add(T24.r1, 'Assalomu alaykum! Hozir tekshiraman.', 'l', '23:40', R.violetSoft);
  add(T24.r2, 'Toʻlov oʻtdi. Reklamangiz ertaga 09:00 da chiqadi.', 'l', '23:41', R.violetSoft);
  add(T24.thx, 'Rahmat, tez ekan!', 'r', '23:41  ✓✓', R.lime);
  ctx.restore();
}
function cardsUI(t) {
  const fly = (i, fn) => { const p = eBack(prog(t, 11.25 + i * .12, 11.7 + i * .12)); if (p <= 0) return; ctx.save(); ctx.translate(0, (1 - p) * 220); ctx.globalAlpha *= clamp(p * 2); fn(); ctx.restore(); };
  fly(0, () => { // orange: live manager toggle
    card(70, 370, 940, 150, R.orange, 30);
    text('Jonli menejer', 110, 440, 54, R.ink, 900);
    mono('TEZKOR  /  MALAKALI  /  24/7', 112, 482, 16, R.ink, 'left', .28, 700);
    scaled(TOG.x + 65, TOG.y + 32, 1 + .08 * bump(t, T24.tog, .22), () => toggle(TOG.x, TOG.y, eInOut(prog(t, T24.tog, T24.tog + .25))));
  });
  fly(1, () => chat2(t));
  fly(2, () => { // white: response time
    card(70, 1140, 450, 250, R.card, 30);
    mono('JAVOB VAQTI', 105, 1185, 16, R.grey, 'left', .3, 700);
    const k = eOut(prog(t, T24.resp, T24.resp + 1.0));
    text(t > T24.resp ? `${Math.round(lerp(10800, 47, k)) > 3600 ? Math.round(lerp(10800, 47, k) / 60) + ' daq' : Math.round(lerp(10800, 47, k)) + ' s'}` : '—', 105, 1275, 84, R.ink, 900, 'left', 'middle');
    mono('OLDIN: 3 SOAT', 105, 1350, 16, R.orange, 'left', .3, 700);
    ctx.beginPath(); ctx.arc(480, 1180, 8, 0, 7); ctx.fillStyle = R.orange; ctx.fill();
  });
  fly(3, () => { // black: donut solved
    card(550, 1140, 460, 250, R.ink, 30);
    const k = eOut(prog(t, T24.donut, T24.donut + 1.0));
    donut(650, 1265, 62, .98 * k, R.orange);
    text(`${Math.round(98 * k)}%`, 740, 1255, 72, R.off, 900, 'left', 'middle');
    mono('HAL QILINDI', 742, 1310, 15, R.grey, 'left', .3, 700);
  });
  fly(4, () => { // lime: 24h bars
    card(70, 1420, 940, 170, R.lime, 30);
    mono('MUROJAATLAR  /  24 SOAT', 105, 1462, 16, R.ink, 'left', .3, 700);
    serif('Har soatda — jonli odam.', 105, 1530, 46, R.ink, 'left');
    const H24 = [3, 2, 2, 1, 1, 2, 4, 6, 8, 9, 9, 8, 7, 8, 9, 9, 8, 7, 6, 7, 8, 7, 5, 4];
    H24.forEach((v, i) => { const k = eBack(clamp((t - T24.bars - i * .03) / .35)); if (k <= 0) return; const bh = v * 10 * k; rr(620 + i * 15, 1560 - bh, 10, bh, 3); ctx.fillStyle = i === 23 ? R.orange : R.ink; ctx.fill(); });
  });
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera((1.03 - .03 * eOut(prog(t, 11, 12)) + .02 * eInOut(prog(t, 12, 21.8))) * punch(t, [T24.tog, T24.r1, T24.r2, T24.thx], .02), sr, sx, sy, () => {
    solutionBg(t, 'Jonli menejer — 24/7');
    cardsUI(t);
    if (t > 11.8 && t < 13.0) {
      const [cx, cy] = pathAt(t, [[11.8, W - 60, 1500], [T24.tog, TOG.x + 65, TOG.y + 32], [13.0, W - 40, 1650]]);
      withAlpha(Math.min(prog(t, 11.8, 12.0), 1 - prog(t, 12.8, 13.0)), () => { cursor(cx, cy, bump(t, T24.tog, .22)); });
    }
    ripple(TOG.x + 65, TOG.y + 32, prog(t, T24.tog, T24.tog + .6), R.ink);
    sparks(t, T24.tog, TOG.x + 98, TOG.y + 32, 467, [R.lime, R.ink, R.off], 22, 500);
  });
  // 18.5: lime full-bleed "JAVOB BOR."
  if (t > T24.slam - .05 && t < T24.sheet + .3) {
    const k = eOut(prog(t, T24.slam - .05, T24.slam + .12)), out = prog(t, T24.sheet - .15, T24.sheet + .25);
    const rw = lerp(420, W + 40, k), rh = lerp(240, H + 40, k);
    withAlpha(1 - out, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(120, 0, k)); ctx.fillStyle = R.lime; ctx.fill();
      dotGrid(t, .12, .5, 1, W / 2, 900);
      heavy(t, T24.slam, 'JAVOB', W / 2, 760, 250, R.ink, { rot: .14, endRot: -.03 });
      heavy(t, T24.slam + .1, 'BOR.', W / 2, 990, 250, R.ink, { rot: -.14, endRot: .02 });
      withAlpha(prog(t, T24.slam + .3, T24.slam + .55), () => serif('47 soniyada — kechasi ham', W / 2, 1170, 72, R.ink));
    });
  }
  // 19.7: violet "keyframes" card
  const mp = eOut(prog(t, T24.sheet, T24.sheet + .45));
  if (mp > 0) {
    withAlpha(.35 * mp, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); });
    const y0 = lerp(H, 640, mp);
    card(80, y0, 920, 720, R.violet, 34);
    withAlpha(prog(t, T24.sheet + .3, T24.sheet + .6), () => { serif('Siz yolgʻiz', W / 2, y0 + 130, 104, R.off); serif('emassiz.', W / 2, y0 + 240, 104, R.off); });
    const rows = [['MUROJAAT', [0, .08, .16]], ['JAVOB', [.3, .38, .46, .54]], ['YECHIM', [.66, .74, .82]]];
    const ph = eInOut(prog(t, T24.sheet + .5, T24.sheet + 1.7)), x0 = 300, x1 = 940;
    rows.forEach(([l, ks], i) => { const ry = y0 + 380 + i * 80; mono(l, 130, ry, 17, R.violetSoft, 'left', .3, 700);
      ctx.fillStyle = 'rgba(239,236,228,.25)'; ctx.fillRect(x0, ry, x1 - x0, 2);
      ks.forEach(k => { const x = lerp(x0, x1, k), lit = ph > k; ctx.save(); ctx.translate(x, ry); ctx.rotate(Math.PI / 4); ctx.fillStyle = lit ? R.lime : 'rgba(239,236,228,.5)'; ctx.fillRect(-11, -11, 22, 22); ctx.restore(); }); });
    const px = lerp(x0, x1, ph); ctx.fillStyle = R.orange; ctx.fillRect(px - 2, y0 + 340, 4, 280);
    const dn = eBack(prog(t, T24.sheet + 1.6, T24.sheet + 1.9)); if (dn > 0) scaled(840, y0 + 650, dn, () => { rr(760, y0 + 622, 160, 56, 28); ctx.fillStyle = R.lime; ctx.fill(); mono('HAL QILINDI', 840, y0 + 651, 15, R.ink, 'center', .15, 800); });
  }
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['3 soat kutish', '47 soniyada javob'], ['Bot yoki jimlik', 'Jonli menejer'], ['Faqat ish vaqtida', '24/7, bayramda ham']];
const IMPACTS3 = [[22.15, 22], [22.6, 10], [23.2, 10], [25.0, 16]];
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera((1 + .03 * eInOut(prog(t, 22, 27))) * punch(t, [22.6, 23.2, 25.0], .03), sr, sx, sy, () => {
    resultBg(t);
    halftone(t, W / 2, 1350, 'rgba(0,0,0,0)', 'rgba(106,92,242,.55)', prog(t, 24.8, 25.4) * .5);
    // 22–23: stripes "24/7"
    const sa = 1 - prog(t, 22.85, 23.15);
    if (sa > 0) withAlpha(sa, () => { stripes(t); heavy(t, 22.1, '24/7', W / 2, 900, 380, R.off, { rot: -.25, endRot: -.05 });
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20; mono('DOIMIY HAMROH', W / 2, 1150, 30, R.off, 'center', .4, 800); ctx.restore(); });
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha((1 - out) * prog(t, 22.9, 23.1), () => {
