<script>
// ADUZ — 9-qism: "Aqlli kampaniya yaratish" (2-variant, 7-qism uslubida)
// Idea: one goal picked → ADUZ fills all 20 settings itself (a domino cascade down the same list
// that defeated the user in the problem scene). Editing: J-cuts, a crumpled-draft "sound vacuum",
// squeegee + whip-pan transitions. Sound from the cue sheet in audio.py (CUES_9) — SOUND_ARCHITECTURE_9.md.

const CAPTIONS = [
  [0.4, 5.0, 'Kampaniya sozlamalari: yigirmata maydon, koʻpi majburiy...'],
  [5.2, 9.4, 'Strategiya, chastota, istisno auditoriya... va yana xato.'],
  [9.6, 10.5, '...qoralama savatga.'],
  [11.4, 16.2, 'ADUZʼda faqat maqsadni tanlaysiz — qolgan sozlamalarni ADUZ oʻzi toʻldiradi.'],
  [16.4, 21.6, 'Bir tanlov, bir bosish — va kampaniya ishga tushdi.'],
  [22.4, 27.0, 'Murakkab sozlamalar yoʻq — aqlli tavsiyalar bor.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];

function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'shop') { rr(-22, -6, 44, 30, 4); ctx.fill(); ctx.beginPath(); ctx.moveTo(-26, -6); ctx.lineTo(-18, -24); ctx.lineTo(18, -24); ctx.lineTo(26, -6); ctx.closePath(); ctx.fill(); }
  else if (kind === 'people') { for (const [dx, sc] of [[-16, .8], [16, .8], [0, 1]]) { ctx.beginPath(); ctx.arc(dx, -10 * sc, 11 * sc, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(dx, 20 * sc, 19 * sc, 13 * sc, 0, Math.PI, 0); ctx.fill(); } }
  else if (kind === 'tag') { ctx.beginPath(); ctx.moveTo(-26, -8); ctx.lineTo(-8, -26); ctx.lineTo(26, -26); ctx.lineTo(26, 8); ctx.lineTo(8, 26); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(14, -14, 6, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill(); }
  else if (kind === 'gear') { ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.lineWidth = 9; ctx.stroke(); for (let k = 0; k < 8; k++) { const a = k * .785; rr(Math.cos(a) * 26 - 6, Math.sin(a) * 26 - 6, 12, 12, 3); ctx.fill(); } }
  else if (kind === 'star') { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 12 : 28; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
  else if (kind === 'bolt') { ctx.beginPath(); ctx.moveTo(6, -30); ctx.lineTo(-16, 4); ctx.lineTo(0, 4); ctx.lineTo(-6, 30); ctx.lineTo(16, -6); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill(); }
  else if (kind === 'sliders') { for (const [dx, k] of [[-16, -8], [0, 10], [16, -2]]) { ctx.beginPath(); ctx.moveTo(dx, -24); ctx.lineTo(dx, 24); ctx.lineWidth = 5; ctx.stroke(); ctx.beginPath(); ctx.arc(dx, k, 8, 0, 7); ctx.fill(); } }
  ctx.restore();
}

// The same 20 settings appear in both scenes: red & empty for the user, auto-filled by ADUZ.
const ROWS = [
  ['ASOSIY'], ['Kampaniya nomi', 'input', 'Kuzgi aksiya'], ['Maqsad', 'select', 'Doʻkonga mijoz'], ['Byudjet turi', 'select', 'Kunlik'], ['Valyuta', 'select', 'soʻm'], ['Narx strategiyasi', 'select', 'Avto'],
  ['AUDITORIYA'], ['Hudud', 'select', 'Fargʻona vodiysi'], ['Yosh oraligʻi', 'select', '20–45'], ['Jins', 'select', 'Hammasi'], ['Qiziqishlar', 'select', 'Moda, xarid'], ['Istisno auditoriya', 'select', 'Yoʻq'],
  ['JOYLASHTIRISH'], ['Kanal toifasi', 'select', 'Moda, shahar'], ['Post formati', 'select', 'Rasm + matn'], ['Til', 'select', 'Oʻzbekcha'], ['Vaqt jadvali', 'select', '19:00–21:00'], ['Chastota cheklovi', 'select', '2 marta/kun'],
  ['KENGAYTIRILGAN'], ['A/B test', 'toggle', 'on'], ['Retargeting', 'toggle', 'on'], ['UTM belgilari', 'toggle', 'on'], ['Konversiya oynasi', 'select', '7 kun'], ['Avto-optimallashtirish', 'toggle', 'on'],
];
const SETTINGS_N = ROWS.filter(r => r.length > 1).length; // 20
const REQUIRED = new Set(['Kampaniya nomi', 'Maqsad', 'Byudjet turi', 'Narx strategiyasi', 'Hudud', 'Yosh oraligʻi', 'Qiziqishlar', 'Kanal toifasi', 'Post formati', 'Vaqt jadvali', 'Chastota cheklovi', 'Konversiya oynasi']);
const ROW_H = 80, HEAD_H = 58;
const rowY = (() => { let y = 0; return ROWS.map(r => { const v = y; y += r.length === 1 ? HEAD_H : ROW_H; return v; }); })();
const LIST_H = rowY[rowY.length - 1] + ROW_H;
// fill(i) in 0..1 for 'good' mode; mode 'bad' shows empty/red
function settingsList(t, top, scroll, mode, fill) {
  ctx.save(); ctx.beginPath(); ctx.rect(SX, top, SW, SY + SH - top); ctx.clip();
  ROWS.forEach((r, i) => {
    const y = top + rowY[i] - scroll;
    if (y < top - 90 || y > SY + SH) return;
    if (r.length === 1) { text(r[0], SX + 40, y + 40, 20, mode === 'bad' ? '#6b7280' : '#059669', 900); return; }
    const f = mode === 'good' ? fill(i) : 0, req = mode === 'bad' && REQUIRED.has(r[0]);
    if (f > 0 && f < 1) withAlpha(1 - f, () => { ctx.fillStyle = '#bbf7d0'; ctx.fillRect(SX, y, SW, ROW_H); });
    ctx.fillStyle = mode === 'bad' ? '#e5e7eb' : '#eef2f1'; ctx.fillRect(SX + 40, y + ROW_H - 2, SW - 80, 2);
    text(r[0] + (req ? ' *' : ''), SX + 40, y + 50, 27, req ? '#b91c1c' : '#111827', 600);
    const rx = SX + SW - 40;
    if (r[1] === 'toggle') {
      const on = f > .5;
      rr(rx - 76, y + 22, 76, 40, 20); ctx.fillStyle = on ? '#16c784' : '#d1d5db'; ctx.fill();
      ctx.beginPath(); ctx.arc(rx - 56 + 36 * eOut(clamp((f - .3) * 2)), y + 42, 16, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    } else if (f > .4) {
      const p = eBack(clamp((f - .4) / .6));
      scaled(rx - 20, y + 42, p, () => {
        ctx.font = `800 25px ${F}`; const w = ctx.measureText(r[2]).width;
        text(r[2], rx - 40, y + 51, 25, '#059669', 800, 'right');
        ctx.beginPath(); ctx.arc(rx - 12, y + 42, 13, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(rx - 12, y + 43, 12, '#fff', 3.5);
      });
    } else text(r[1] === 'input' ? 'Kiriting...' : 'Tanlang  ›', rx, y + 51, 25, req ? '#ef4444' : '#9ca3af', 600, 'right');
  });
  ctx.restore();
}

// ---------- SCENE 1 — Muammo ----------
const GEARS = (() => { const r = rnd(97); return Array.from({ length: 14 }, (_, i) => ({ x: r() * W, y: 380 + r() * 1300, s: .8 + r() * 1.6, sp: (r() - .5) * 2, at: .4 + i * .45 })); })();
const IMPACTS1 = [[5.0, 8], [5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const DROP = [2.0, 3.0], TOAST = [5.0, 6.6], SAVE = 7.6, ERR = [7.8, 9.3], CRUMPLE = 9.55;
function problemScreen(t) {
  ctx.fillStyle = '#f3f4f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#fff'; ctx.fillRect(SX, SY, SW, 150);
  text('←', SX + 40, SY + 104, 36, '#6b7280', 700);
  text('Kampaniya sozlamalari', SX + 100, SY + 102, 32, '#111827', 800);
  const sp = bump(t, SAVE, .25);
  scaled(SX + SW - 90, SY + 94, 1 - .08 * sp, () => text('Saqlash', SX + SW - 40, SY + 104, 28, '#2563eb', 800, 'right'));
  ctx.fillStyle = '#fff7ed'; ctx.fillRect(SX, SY + 150, SW, 70);
  text('Toʻldirildi: 3 / 20', SX + 40, SY + 196, 24, '#9a3412', 800);
  rr(SX + 300, SY + 178, SW - 340, 14, 7); ctx.fillStyle = '#fed7aa'; ctx.fill(); rr(SX + 300, SY + 178, (SW - 340) * .15, 14, 7); ctx.fillStyle = '#ea580c'; ctx.fill();
  const scroll = (LIST_H - 720) * (.25 * eInOut(prog(t, 1.0, 1.8)) + .35 * eInOut(prog(t, 3.2, 4.4)) + .4 * eInOut(prog(t, 5.8, 7.2)));
  settingsList(t, SY + 220, scroll, 'bad', () => 0);
  // jargon dropdown on "Narx strategiyasi"
  const dp = eBack(prog(t, DROP[0], DROP[0] + .25)) * (1 - prog(t, DROP[1], DROP[1] + .15));
  if (dp > 0) scaled(SX + SW / 2, SY + 600, dp, () => {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 30; rr(SX + 60, SY + 440, SW - 120, 330, 18); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    text('Narx strategiyasi', SX + 90, SY + 490, 26, '#111827', 800);
    ['Lowest cost', 'Cost cap', 'Bid cap', 'Target ROAS', 'Value optimization'].forEach((s, i) => text(s, SX + 100, SY + 545 + i * 48, 25, '#374151', 600));
  });
  // red toast
  const tp = eOut(prog(t, TOAST[0], TOAST[0] + .3)) * (1 - prog(t, TOAST[1], TOAST[1] + .3));
  if (tp > 0) {
    const y = lerp(SY + SH, SY + SH - 150, tp);
    rr(SX + 30, y, SW - 60, 110, 20); ctx.fillStyle = '#dc2626'; ctx.fill();
    text('12 ta majburiy maydon', SX + 70, y + 48, 28, '#fff', 800); text('toʻldirilmagan', SX + 70, y + 86, 26, '#fecaca', 600);
  }
  // save error modal
  const mp = eBack(prog(t, ERR[0], ERR[0] + .3)) * (1 - prog(t, ERR[1], ERR[1] + .2));
  if (mp > 0) {
    withAlpha(Math.min(1, mp), () => { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(SX, SY, SW, SH); });
    scaled(SX + SW / 2, SY + 560, mp, () => {
      rr(SX + 60, SY + 420, SW - 120, 290, 28); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(SX + SW / 2, SY + 490, 36, 0, 7); ctx.fillStyle = '#dc2626'; ctx.fill(); cross(SX + SW / 2, SY + 490, 13, '#fff', 7);
      text('Saqlanmadi', SX + SW / 2, SY + 572, 32, '#111827', 900, 'center');
      text('Narx strategiyasi tanlanmagan', SX + SW / 2, SY + 614, 24, '#6b7280', 600, 'center');
      rr(SX + SW / 2 - 90, SY + 640, 180, 50, 25); ctx.fillStyle = '#2563eb'; ctx.fill(); text('OK', SX + SW / 2, SY + 674, 24, '#fff', 800, 'center');
    });
  }
}
function crumpled(t) {
  // the draft gets crumpled into a paper ball and dropped
  const c = prog(t, CRUMPLE, CRUMPLE + .4), fall = prog(t, CRUMPLE + .4, CRUMPLE + .85);
  if (c <= 0) return false;
  if (c < 1) {
    const s = lerp(1, .18, eIn(c)), cx = SX + SW / 2, cy = SY + SH / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(c * 1.6); ctx.scale(s, s * (1 - .2 * Math.sin(c * 9)));
    ctx.beginPath(); rr(-SW / 2, -SH / 2, SW, SH, lerp(60, SW / 2, eIn(c))); ctx.clip(); ctx.translate(-cx, -cy); problemScreen(t);
    withAlpha(c * .6, () => { ctx.fillStyle = '#9ca3af'; ctx.fillRect(SX, SY, SW, SH); }); ctx.restore();
  } else {
    const x = SX + SW / 2 + fall * 60, y = SY + SH / 2 + eIn(fall) * 900, r = 80;
    ctx.save(); ctx.translate(x, y); ctx.rotate(fall * 4);
    ctx.beginPath(); for (let k = 0; k < 14; k++) { const a = k / 14 * 6.28, rr2 = r * (.85 + .15 * Math.sin(k * 2.7)); ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } ctx.closePath();
    ctx.fillStyle = '#e5e7eb'; ctx.fill(); ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 3;
    for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(Math.cos(k) * 20, Math.sin(k * 1.3) * 20); ctx.lineTo(Math.cos(k * 2.1) * 60, Math.sin(k * 1.7) * 60); ctx.stroke(); }
    ctx.restore();
  }
  return true;
}
function scene1(t) {
  const stress = prog(t, 5, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr - .01 * stress * Math.sin(t * 1.3), sx, sy, () => {
    for (const g of GEARS) {
      const p = eBack(prog(t, g.at, g.at + .4)); if (p <= 0) continue;
      withAlpha(.13 + .1 * stress, () => {
        ctx.save(); ctx.translate(g.x, g.y + Math.sin(t + g.x) * 20); ctx.rotate(t * g.sp * (1 + 2 * stress));
        glyph('gear', 0, 0, g.s * p, '#cbd5e1'); ctx.restore();
      });
    }
    episodeTitle(t, '9-QISM', 'Aqlli kampaniya', 64);
    counters(t, [['20', 'sozlama', '#fff'], ['12', 'majburiy maydon', C.red], ['0', 'reklama', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#000', 0, lerp(160, 0, enter), 0, () => {
      if (!crumpled(t)) problemScreen(t);
      ctx.fillStyle = `rgba(255,40,60,${.07 * stress})`; ctx.fillRect(SX, SY, SW, SH);
    });
    // cursor: opens the jargon dropdown, scrolls, taps Save
    const keys = [[1.2, W - 40, 1600], [DROP[0], SX + SW - 120, SY + 560], [2.9, SX + SW - 120, SY + 560], [4.0, SX + SW / 2, SY + 900], [5.0, SX + SW / 2, SY + 700], [6.4, SX + SW / 2, SY + 950], [SAVE, SX + SW - 100, SY + 94], [8.4, SX + SW - 100, SY + 94]];
    if (t > 1.2 && t < 8.6) {
      const [cx, cy] = pathAt(t, keys);
      withAlpha(Math.min(prog(t, 1.2, 1.4), 1 - prog(t, 8.3, 8.6)), () => cursor(cx, cy, Math.max(bump(t, DROP[0], .22), bump(t, SAVE, .22))));
    }
    slam(t, 5.6, 'MAJBURIY *', 320, 560, 54, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
    slam(t, 6.6, 'QAYSI STRATEGIYA?', 720, 820, 44, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
    slam(t, 7.6, 'YANA XATO!', 360, 1420, 54, '#fff', { slab: C.red, rot: .05, hold: .9 });
  });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 97, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, '20 TA SOZLAMA', W / 2, 880, 140, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'bitta reklama uchun', W / 2, 1040, 54, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  const vac = prog(t, 9.7, 10.1);
  if (vac > 0) withAlpha(vac * .5, () => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); });
}

// ---------- SCENE 2 — Yechim ----------
const T9 = { home: 11.6, pick: 13.0, auto: 13.2, fill0: 13.55, step: .105, plan: 15.95, launch: 16.8, live: 18.2, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T9.launch, 8], [T9.slam, 34]];
const GOALS = [['Doʻkonga mijoz', 'shop', '#f59e0b'], ['Kanalga obunachi', 'people', '#3b82f6'], ['Aksiya / chegirma', 'tag', '#ec4899']];
const goalBtn = i => ({ x: SX + 40, y: SY + 300 + i * 240, w: SW - 80, h: 210 });
const SETTING_IDX = ROWS.map((r, i) => r.length > 1 ? i : -1).filter(i => i >= 0);
const fillAt = i => T9.fill0 + SETTING_IDX.indexOf(i) * T9.step;
const NEXT = { x: SX + 40, y: SY + SH - 150, w: SW - 80, h: 100 };
function bigButton(b, label, kind, col, sel, press) {
  scaled(b.x + b.w / 2, b.y + b.h / 2, 1 - .04 * press, () => {
    ctx.save(); ctx.shadowColor = 'rgba(15,23,42,.1)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    rr(b.x, b.y, b.w, b.h, 30); ctx.fillStyle = sel ? '#ecfdf5' : '#fff'; ctx.fill(); ctx.restore();
    if (sel) { rr(b.x, b.y, b.w, b.h, 30); ctx.lineWidth = 5; ctx.strokeStyle = '#16c784'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(b.x + 90, b.y + b.h / 2, 56, 0, 7); ctx.fillStyle = col; ctx.fill();
    glyph(kind, b.x + 90, b.y + b.h / 2, 1.3);
    text(label, b.x + 180, b.y + b.h / 2 + 15, 40, C.ink, 900);
    if (sel) { ctx.beginPath(); ctx.arc(b.x + b.w - 60, b.y + b.h / 2, 26, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(b.x + b.w - 60, b.y + b.h / 2 + 1, 24, '#fff', 6); }
  });
}
function homeScreen(t) {
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 230);
  text('Yangi kampaniya', SX + 50, SY + 96, 30, '#d1fae5', 700);
  text('Maqsadingiz nima?', SX + 50, SY + 170, 52, '#fff', 900);
  GOALS.forEach(([l, k, c], i) => {
    const p = eBack(prog(t, T9.home + i * .15, T9.home + .45 + i * .15));
    if (p > 0) scaled(SX + SW / 2, goalBtn(i).y + 105, p, () => bigButton(goalBtn(i), l, k, c, i === 0 && t > T9.pick, i === 0 ? bump(t, T9.pick, .25) : 0));
  });
}
function autoScreen(t) {
  ctx.fillStyle = '#fff'; ctx.fillRect(SX, SY, SW, 150);
  text('←', SX + 40, SY + 104, 36, C.grey, 700);
  text('Doʻkonga mijoz', SX + 100, SY + 102, 34, C.ink, 900);
  const done = SETTING_IDX.filter(i => t > fillAt(i) + .2).length;
  ctx.fillStyle = '#ecfdf5'; ctx.fillRect(SX, SY + 150, SW, 70);
  glyph('star', SX + 56, SY + 186, .55, '#0ea371');
  text(done < 20 ? 'ADUZ avtomatik toʻldirmoqda...' : 'Hammasi toʻldirildi', SX + 86, SY + 196, 24, '#065f46', 800);
  text(`${done} / 20`, SX + SW - 40, SY + 196, 26, '#059669', 900, 'right');
  rr(SX, SY + 214, SW * done / 20, 6, 3); ctx.fillStyle = '#16c784'; ctx.fill();
  // the list scrolls to follow the cascade
  const cur = clamp((t - T9.fill0) / (T9.step * 20)), scroll = (LIST_H - 760) * eInOut(clamp(cur * 1.1 - .05));
  settingsList(t, SY + 220, scroll, 'good', i => prog(t, fillAt(i), fillAt(i) + .3));
  // recommended plan sheet
  const pp = eOut(prog(t, T9.plan, T9.plan + .45));
  if (pp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.4 * pp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + 470, pp);
    rr(SX, sy, SW, SH, 44); ctx.fillStyle = '#fff'; ctx.fill();
    glyph('star', SX + 60, sy + 70, .7, '#0ea371');
    text('Tavsiya etilgan reja', SX + 100, sy + 82, 34, C.ink, 900);
    [['Byudjet', '500 000 soʻm'], ['Mos kanallar', '6 ta'], ['Eng yaxshi vaqt', '19:00–21:00'], ['Taxminiy koʻrish', '≈ 9 000']].forEach(([a, b], i) => {
      const y = sy + 150 + i * 82;
      text(a, SX + 50, y + 34, 28, C.grey, 600); text(b, SX + SW - 50, y + 34, 30, C.ink, 900, 'right');
      ctx.fillStyle = '#eef2f1'; ctx.fillRect(SX + 50, y + 60, SW - 100, 2);
    });
    if (t < T9.launch + .1) {
      const press = bump(t, T9.launch, .25);
      scaled(NEXT.x + NEXT.w / 2, NEXT.y + NEXT.h / 2, 1 - .05 * press, () => {
        rr(NEXT.x, NEXT.y, NEXT.w, NEXT.h, 50); ctx.fillStyle = '#0ea371'; ctx.fill();
        text('Ishga tushirish', NEXT.x + NEXT.w / 2, NEXT.y + 63, 38, '#fff', 900, 'center');
      });
    } else {
      const lp = prog(t, T9.launch + .1, T9.live), done2 = t > T9.live;
      rr(NEXT.x, NEXT.y, NEXT.w, NEXT.h, 50); ctx.fillStyle = done2 ? '#065f46' : '#0ea371'; ctx.fill();
      if (!done2) { ctx.beginPath(); ctx.arc(NEXT.x + 120, NEXT.y + 50, 24, -Math.PI / 2, -Math.PI / 2 + lp * 6.28); ctx.lineWidth = 7; ctx.strokeStyle = '#fff'; ctx.stroke(); text('Ishga tushmoqda...', NEXT.x + NEXT.w / 2 + 30, NEXT.y + 63, 36, '#fff', 800, 'center'); }
      else { check(NEXT.x + 150, NEXT.y + 50, 30, '#fff', 8, prog(t, T9.live, T9.live + .3)); text('Ishga tushdi!', NEXT.x + NEXT.w / 2 + 30, NEXT.y + 63, 38, '#fff', 900, 'center'); }
    }
  }
  const mp = eOut(prog(t, T9.sheet, T9.sheet + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T9.sheet + .2, T9.sheet + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T9.sheet + .45, T9.sheet + .8));
    withAlpha(prog(t, T9.sheet + .6, T9.sheet + .9), () => {
      text('Kampaniya ishga tushdi!', SX + SW / 2, sy + 300, 42, C.ink, 800, 'center');
      ['Maqsad boʻyicha avtomatik sozlash', 'Istalgan sozlamani oʻzgartirish mumkin', 'Majburiy maydonlarsiz'].forEach((s, i) =>
        withAlpha(prog(t, T9.sheet + .9 + i * .25, T9.sheet + 1.15 + i * .25), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Aqlli sozlash');
    const enter = eBack(prog(t, 11.1, 11.75)), sp = eInOut(prog(t, T9.auto, T9.auto + .4));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => {
        if (sp < 1) { ctx.save(); ctx.translate(-SW * sp, 0); ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH); homeScreen(t); ctx.restore(); }
        if (sp > 0) { ctx.save(); ctx.translate(SW * (1 - sp), 0); ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH); autoScreen(t); ctx.restore(); }
      })));
    const g = goalBtn(0), gx = g.x + g.w - 160, gy = g.y + 105, lx = NEXT.x + NEXT.w / 2 + 80, ly = NEXT.y + 50;
    if (t > 11.9 && t < 13.5) {
      const [cx, cy] = pathAt(t, [[11.9, W - 40, 1600], [T9.pick, gx, gy]]);
      withAlpha(Math.min(prog(t, 11.9, 12.1), 1 - prog(t, 13.2, 13.5)), () => cursor(cx, cy, bump(t, T9.pick, .22)));
    }
    if (t > 16.2 && t < 17.2) {
      const [cx, cy] = pathAt(t, [[16.2, W - 40, 1600], [T9.launch, lx, ly]]);
      withAlpha(Math.min(prog(t, 16.2, 16.4), 1 - prog(t, 16.95, 17.2)), () => cursor(cx, cy, bump(t, T9.launch, .22)));
    }
    ripple(gx, gy, prog(t, T9.pick, T9.pick + .6), '#16c784');
    ripple(lx, ly, prog(t, T9.launch, T9.launch + .6), '#ffffff');
  });
  const dim = prog(t, T9.slam - .05, T9.slam + .1) * (1 - prog(t, T9.sheet - .2, T9.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T9.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T9.slam, W / 2, 880, 99, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T9.slam, '1 TANLOV', W / 2, 840, 200, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T9.slam + .15, '20 ta sozlama — avtomatik', W / 2, 1030, 60, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T9.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['20 ta sozlama', '1 ta tanlov'], ['12 ta majburiy maydon', '0 ta majburiy'], ['“Saqlanmadi” xatosi', 'Avtomatik tekshiruv'], ['1 soat', '1 daqiqa']];
const IMPACTS3 = [[22.15, 22], [25.0, 16]];
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    glyph(kind, bx, by, 1.5);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {
    resultBg(t);
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha(1 - out, () => {
      withAlpha(prog(t, 22.2, 22.6), () => {
        text('NATIJA', W / 2, 190, 34, C.gold, 800, 'center');
        text('Aqlli — demak oson', W / 2, 260, 60, '#fff', 800, 'center');
      });
      const cp = eOut(prog(t, 22.3, 22.9)), x = 90, y = lerp(410, 340, cp), w = 900, h = 640;
      withAlpha(cp, () => {
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
        rr(x, y, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
        text('Oldin', x + 60, y + 80, 30, C.grey, 800);
        rr(x + 470, y + 44, 200, 52, 26); ctx.fillStyle = '#d1fae5'; ctx.fill();
        text('ADUZ', x + 570, y + 80, 30, '#065f46', 900, 'center');
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + w / 2 - 20, y + 120, 2, h - 160);
        CMP.forEach(([a, b], i) => {
          const ry = y + 190 + i * 115, st = eInOut(prog(t, 22.8 + i * .35, 23.1 + i * .35)), ok = eBack(prog(t, 23.0 + i * .35, 23.3 + i * .35));
          text(a, x + 60, ry, 29, st > 0 ? '#94a3b8' : '#334155', 700);
          if (st > 0) { ctx.font = `700 29px ${F}`; const tw = ctx.measureText(a).width; ctx.beginPath(); ctx.moveTo(x + 55, ry - 10); ctx.lineTo(x + 55 + (tw + 10) * st, ry - 10); ctx.lineWidth = 5; ctx.strokeStyle = C.red; ctx.stroke(); }
          if (ok > 0) scaled(x + 470, ry - 10, ok, () => {
            ctx.beginPath(); ctx.arc(x + 490, ry - 10, 20, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(x + 490, ry - 9, 18, '#fff', 5);
            text(b, x + 525, ry, 29, '#059669', 900);
          });
        });
      });
      [['Aqlli', 'star'], ['Avtomatik', 'bolt'], ['Moslashuvchan', 'sliders']].forEach(([l, k], i) => {
        const p = eBack(prog(t, 25.2 + i * .25, 25.65 + i * .25));
        if (p > 0) badge(230 + i * 310, 1200, l, k, p);
      });
    });
  });
  shockwave(t, 25.0, W / 2, 800, C.gold, 900);
  sparks(t, 25.0, W - 200, 820, 101, [C.gold, '#fff', '#22e39a'], 34, 1100);
  confetti(t, 25.0);
  endCard(t, 27.0);
}

boot({
  scene1, scene2, scene3, captions: CAPTIONS,
  transitions: [
    { a: 10.55, b: 11.0, fn: (t, a, b, A, B) => squeegee(t, a, b, A, B, '#22e39a') },
    { a: 21.75, b: 22.15, fn: whipPan },
  ],
  overlay: t => { filmLook(t); flash(t, 11.0, '#ffffff', .3, .5); },
});
</script>
