<canvas id="c" width="1080" height="1920"></canvas>

<script src="reel.js"></script>
<script>
// ADUZ — 27-qism: "Aqlli byudjet taqsimoti" — INSTAGRAM REELS uchun ("motion reel" uslubi, reel.js).
// Reels rules applied: hook on frame 0 (no fade-in — the orange "62%" card is already on screen), a cut every ~1–2 s,
// all text inside the Reels safe area (igSafe: top 250, bottom 1460, right column from y 1060 kept clear), large
// burned-in captions for muted viewing, a comment-keyword CTA + "save" prompt, and a seamless loop: the last 0.6 s
// rebuild the exact opening frame so the reel replays without a seam.
// Story: a 3 000 000 so'm budget pours into six channels; four are dead (bots, ERR 0.3%) and the coins burn to ash;
// O'LIK KANAL · BOTLAR KO'RADI · PUL KUYDI; orange cut "KUL.". Vacuum: the last coin turns to ash. Transition (new):
// barsWipe "Optimallash.". Solution: live optimisation — scan, dead channels stopped, budget re-routed to live ones,
// saved 1 860 000, 100% to profitable; lime "HAR SO'M ISHLAYDI."; violet keyframe card. Result: stripes "×3",
// before/after, badges. End: identity card + "IZOHGA 'BYUDJET' DEB YOZING" → loop. Sound: CUES_27.

const CAPTIONS = [
  [0.15, 1.55, 'Reklama pulingizning 62% i kuyyapti.'],
  [1.7, 5.4, 'Byudjet hamma kanalga teng boʻlinadi...'],
  [5.5, 9.4, '...toʻrttasi oʻlik: botlar koʻradi, pul kuyadi.'],
  [11.4, 16.2, 'ADUZ jonli optimizatsiyasi oʻlik kanallarni toʻxtatadi.'],
  [16.4, 21.6, 'Pul — faqat foyda keltirayotgan kanallarga.'],
  [22.4, 27.0, 'Oʻsha byudjet — 3 barobar koʻp mijoz.'],
];
window.captions = igCaptions;
const SECTIONS = [[0, '00', 'HOOK'], [1.6, '01', 'MUAMMO'], [9.5, '02', 'VAKUUM'], [10.3, '03', 'OTISH'], [11, '04', 'YECHIM'], [22, '05', 'NATIJA'], [27, '06', 'ADUZ']];
const IGX = 480;   // visual centre for elements low on screen (keeps clear of the right-hand buttons)
function glyph(kind, x, y, s = 1, col = R.ink) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'flame') { ctx.beginPath(); ctx.moveTo(0, -30); ctx.quadraticCurveTo(24, -6, 18, 12); ctx.quadraticCurveTo(12, 28, 0, 28); ctx.quadraticCurveTo(-12, 28, -18, 12); ctx.quadraticCurveTo(-22, -4, -6, -14); ctx.quadraticCurveTo(-2, -2, 4, -6); ctx.quadraticCurveTo(6, -18, 0, -30); ctx.fill(); }
  else if (kind === 'coin') { ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill(); ctx.font = `900 28px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = R.ink; ctx.fillText('S', 0, 2); }
  else if (kind === 'bot') { rr(-24, -18, 48, 38, 10); ctx.stroke(); ctx.beginPath(); ctx.arc(-9, 0, 5, 0, 7); ctx.arc(9, 0, 5, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, -28); ctx.stroke(); }
  else if (kind === 'route') { ctx.beginPath(); ctx.moveTo(-26, 18); ctx.bezierCurveTo(-10, 18, -10, -18, 22, -18); ctx.stroke(); ctx.beginPath(); ctx.moveTo(12, -28); ctx.lineTo(24, -18); ctx.lineTo(12, -8); ctx.stroke(); }
  else if (kind === 'scan') { ctx.beginPath(); ctx.arc(-4, -4, 18, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(10, 10); ctx.lineTo(26, 26); ctx.stroke(); }
  else if (kind === 'chart') { [[-20, 10], [-4, -4], [12, -18]].forEach(([x, h]) => { rr(x - 6, h, 12, 26 - h, 3); ctx.fill(); }); }
  ctx.restore();
}
function slabCard(t, at, s, x, y, size, bg, fg, rot, hold) {
  const p = prog(t, at, at + .3), q = prog(t, at + hold, at + hold + .2); if (p <= 0 || q >= 1) return;
  ctx.save(); ctx.globalAlpha *= clamp(p * 3) * (1 - q); ctx.translate(x, y); ctx.rotate(rot * eOut(p) + (1 - eOut(p)) * -.4);
  const sc = lerp(1.8, 1, eBack(p)); ctx.scale(sc, sc);
  ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width;
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  rr(-w / 2 - size * .5, -size * .72, w + size, size * 1.44, size * .36); ctx.fillStyle = bg; ctx.fill(); ctx.shadowColor = 'transparent';
  text(s, 0, size * .04, size, fg, 900, 'center', 'middle'); ctx.restore();
}

// ---------- HOOK (frame 0 = loop target): orange card, "62%" ----------
// u: hook-local time. At the start u = t; in the loop bridge (t 31.4–32) u = t − 32, so t = 32 draws the same frame as t = 0.
function hookFrame(u, t) {
  ctx.fillStyle = R.orange; ctx.fillRect(0, 0, W, H);
  dotGrid(u + 40, .1, .42, 1, W / 2, 820);
  mono('REKLAMA BYUDJETI', W / 2, 470, 26, R.ink, 'center', .4, 800);
  heavy(u, -.3, '62%', W / 2, 720, 330, R.ink, { rot: -.2, endRot: -.04 });
  heavy(u, -.15, 'KUYYAPTI', W / 2, 960, 130, R.ink, { rot: .12, endRot: .02 });
  serif('oʻlik kanallarda — havoga', W / 2, 1100, 66, R.ink);
  // burning bills drifting up
  for (let i = 0; i < 7; i++) { const ph = ((u + 2) * .35 + i / 7) % 1, x = 120 + i * 120 + Math.sin(ph * 6 + i) * 20, y = 1380 - ph * 900;
    withAlpha(Math.sin(Math.PI * ph) * .85, () => { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(ph * 5 + i) * .5); rr(-40, -22, 80, 44, 6); ctx.fillStyle = '#e9e7e2'; ctx.fill(); ctx.fillStyle = R.ink; ctx.fillRect(-40, -22 + 44 * (1 - ph), 80, 44 * ph); ctx.restore(); glyph('flame', x, y - 30, .7, R.ink); }); }
}

// ---------- SCENE 1 — Muammo: budget burning in dead channels ----------
const CH = [['Vodiy Mem', 0, '0.3%'], ['Fargʻona 24', 1, '4.8%'], ['Qiziq Faktlar', 0, '0.2%'], ['Kino Yangi', 0, '0.4%'], ['Andijon Savdo', 1, '5.6%'], ['Top Musiqa', 0, '0.1%']];
const card6 = i => ({ x: 70 + (i % 3) * 280, y: 790 + Math.floor(i / 3) * 250, w: 260, h: 230 });
const DROPS = Array.from({ length: 18 }, (_, k) => ({ at: 2.0 + k * .38, ch: k % 6 }));
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const burned = t => DROPS.filter(d => t > d.at + .45 && !CH[d.ch][1]).length;
function budgetScene(t) {
  // wallet
  const spent = DROPS.filter(d => t > d.at).length / DROPS.length;
  rr(70, 560, 820, 170, 26); ctx.fillStyle = R.ink2; ctx.fill();
  mono('BYUDJET', 110, 605, 18, R.grey, 'left', .32, 700);
  text(`${fmt(3000000 * (1 - spent))} soʻm`, 110, 680, 62, R.off, 900, 'left', 'middle');
  rr(560, 650, 290, 18, 9); ctx.fillStyle = '#2b2830'; ctx.fill(); rr(560, 650, 290 * (1 - spent), 18, 9); ctx.fillStyle = R.lime; ctx.fill();
  // channels
  CH.forEach(([nm, live, err], i) => {
    const c = card6(i), pop = eBack(prog(t, 1.75 + i * .06, 2.1 + i * .06)); if (pop <= 0) return;
    const hits = DROPS.filter(d => d.ch === i && t > d.at + .45).length, heat = live ? 0 : clamp(hits / 3);
    scaled(c.x + c.w / 2, c.y + c.h / 2, pop * (1 + .06 * DROPS.filter(d => d.ch === i).reduce((n, d) => n + bump(t, d.at + .45, .25), 0)), () => {
      rr(c.x, c.y, c.w, c.h, 22); ctx.fillStyle = live ? '#1f2a14' : lerpRGB([30, 28, 33], [70, 22, 12], heat); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = live ? R.lime : `rgba(240,74,30,${.3 + .7 * heat})`; ctx.stroke();
      text(nm, c.x + 20, c.y + 48, 26, R.off, 800);
      mono(`ERR ${err}`, c.x + 20, c.y + 92, 16, live ? R.lime : R.grey, 'left', .2, 800);
      if (live) { glyph('chart', c.x + c.w - 45, c.y + 160, 1, R.lime); mono('JONLI', c.x + 20, c.y + 190, 18, R.lime, 'left', .3, 800); }
      else { glyph('bot', c.x + c.w - 50, c.y + 160, 1, R.grey); mono('OʻLIK', c.x + 20, c.y + 190, 18, R.orange, 'left', .3, 800);
        if (heat > 0) for (let k = 0; k < 3; k++) withAlpha(heat * (.6 + .4 * Math.sin(t * 9 + k * 2 + i)), () => glyph('flame', c.x + 70 + k * 45, c.y + 150 - 6 * Math.sin(t * 7 + k), .8 + .2 * Math.sin(t * 5 + k), k % 2 ? R.orange : '#ffb04a')); }
    });
  });
  // coins flying out of the wallet
  DROPS.forEach((d, k) => { const p = prog(t, d.at, d.at + .45); if (p <= 0 || p >= 1) return; const c = card6(d.ch), e = eInOut(p);
    glyph('coin', lerp(470, c.x + c.w / 2, e), lerp(700, c.y + 100, e) - Math.sin(Math.PI * p) * 120, .8, R.lime); });
  DROPS.forEach((d, k) => { if (!CH[d.ch][1]) { const c = card6(d.ch); sparks(t, d.at + .45, c.x + c.w / 2, c.y + 110, 700 + k, [R.orange, '#ffb04a', R.grey], 12, 320); } });
}
function lerpRGB(a, b, k) { return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`; }
function scene1(t) {
  if (t < 1.6) { hookFrame(t, t); const cut = prog(t, 1.45, 1.6); if (cut > 0) withAlpha(cut, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); }); return; }
  const stress = prog(t, 4.0, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera((1 + .04 * eInOut(prog(t, 1.6, 10.4))) * punch(t, DROPS.map(d => d.at + .45), .008), sr, sx, sy, () => {
    scramble(t, 1.6, '27-QISM', W / 2, 300, 26, R.orange, { dur: .5 });
    heavy(t, 1.75, 'BYUDJET', W / 2, 375, 84, R.off, { rot: -.08 });
    const b = burned(t);
    withAlpha(prog(t, 1.9, 2.2), () => [['6', 'kanal'], ['4', 'oʻlik'], [fmt(b * 166667), 'kuydi, soʻm']].forEach(([a, l], i) => {
      const x = 205 + i * 270; ctx.save(); ctx.strokeStyle = R.line; ctx.lineWidth = 2; rr(x - 125, 430, 250, 100, 18); ctx.stroke(); ctx.restore();
      text(a, x, 475, i === 2 ? 36 : 46, i ? R.orange : R.off, 900, 'center', 'middle'); mono(l.toUpperCase(), x, 512, 14, R.grey, 'center', .28, 700); }));
    budgetScene(t);
  });
  slabCard(t, 5.6, 'OʻLIK KANAL', 330, 790, 54, R.orange, R.ink, -.08, 2.9);
  slabCard(t, 6.6, 'BOTLAR KOʻRADI', 560, 1045, 48, R.violet, R.off, .07, 1.9);
  slabCard(t, 7.6, 'PUL KUYDI', 330, 1170, 60, R.off, R.ink, -.05, .9);
  if (t > 8.45 && t < 9.5) {
    const k = eOut(prog(t, 8.45, 8.62)), cut = 1 - prog(t, 9.3, 9.45), rw = lerp(500, W + 40, k), rh = lerp(260, H + 40, k);
    withAlpha(cut, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(130, 0, k)); ctx.fillStyle = R.orange; ctx.fill();
      heavy(t, 8.5, 'KUL.', W / 2, 820, 300, R.ink, { rot: -.12, endRot: -.04 });
      withAlpha(prog(t, 8.7, 8.9), () => serif('byudjetning 62% i — havoga', W / 2, 1040, 70, R.ink));
      sparks(t, 8.55, W / 2, 900, 731, [R.ink, '#7a2410', '#efece4'], 40, 1100);
    });
  }
  // vacuum: the last coin falls into a dead channel and turns to ash
  if (t > 9.5) {
    ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H);
    const p = prog(t, 9.55, 10.25), y = lerp(500, 820, eIn(clamp(p * 1.6)));
    if (p < .62) glyph('coin', W / 2, y, 3.2, R.lime);
    withAlpha(clamp((p - .5) * 3), () => glyph('flame', W / 2, 820, 3, R.orange));
    disintegrate(W / 2 - 180, 650, 360, 340, clamp((p - .6) / .4), R.ink, 741, 10);
  }
}

// ---------- SCENE 2 — Yechim: live optimisation ----------
const T27 = { on: 12.2, scan: [12.55, 13.4], move: 13.7, saved: 14.6, donut: 15.4, ok: 16.4, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T27.on, 10], [T27.move, 12], [T27.slam, 34]];
const TOG = { x: 760, y: 333 }, MOVE = { x: 110, y: 930, w: 860, h: 76 };
function listCard(t) {
  card(70, 450, 940, 580, R.card, 30);
  mono('KANALLAR  /  JONLI TAHLIL', 110, 498, 16, R.grey, 'left', .3, 700);
  const sp = prog(t, ...T27.scan), mv = eInOut(prog(t, T27.move, T27.move + .9));
  CH.forEach(([nm, live, err], i) => {
    const y = 530 + i * 64, scanned = sp > (i + .5) / 6;
    if (i % 2) { ctx.fillStyle = '#f1efea'; ctx.fillRect(90, y, 900, 60); }
    text(nm, 110, y + 40, 26, scanned && !live ? '#a8a4ac' : R.ink, 700);
    if (scanned && !live) { ctx.font = fnt(700, 26); const tw = ctx.measureText(nm).width; ctx.fillStyle = R.orange; ctx.fillRect(105, y + 30, (tw + 10) * eOut(clamp((sp - (i + .5) / 6) * 6)), 4); }
    mono(`ERR ${err}`, 360, y + 32, 15, live ? '#5d7a12' : R.grey, 'left', .2, 800);
    // budget bar: equal share → re-routed
    const share = live ? lerp(1 / 6, .5, mv) : lerp(1 / 6, 0, mv);
    rr(500, y + 22, 300, 16, 8); ctx.fillStyle = '#e4e1da'; ctx.fill(); rr(500, y + 22, 300 * share * 2, 16, 8); ctx.fillStyle = live ? R.lime : R.orange; ctx.fill();
    mono(`${Math.round(share * 100)}%`, 820, y + 31, 15, R.ink, 'left', .1, 800);
    if (scanned) { const q = eBack(clamp((sp - (i + .5) / 6) * 6)); scaled(930, y + 30, q, () => { rr(870, y + 12, 120, 38, 19); ctx.fillStyle = live ? R.lime : R.ink; ctx.fill(); mono(live ? 'FOYDALI' : 'STOP', 930, y + 31, 13, live ? R.ink : R.orange, 'center', .2, 800); }); }
  });
  if (sp > 0 && sp < 1) { const y = 530 + sp * 384; ctx.fillStyle = 'rgba(214,240,58,.35)'; ctx.fillRect(90, y - 30, 900, 30); ctx.fillStyle = R.lime; ctx.fillRect(90, y, 900, 4); }
  scaled(MOVE.x + MOVE.w / 2, MOVE.y + 38, 1 - .05 * bump(t, T27.move, .22), () => { rr(MOVE.x, MOVE.y, MOVE.w, MOVE.h, 38); ctx.fillStyle = t > T27.move ? R.ink : R.orange; ctx.fill();
    text(t > T27.move ? 'Qayta taqsimlandi ✓' : 'Qayta taqsimlash', MOVE.x + MOVE.w / 2, MOVE.y + 48, 32, t > T27.move ? R.lime : R.ink, 900, 'center'); });
}
function cardsUI(t) {
  const fly = (i, fn) => { const p = eBack(prog(t, 11.25 + i * .12, 11.7 + i * .12)); if (p <= 0) return; ctx.save(); ctx.translate(0, (1 - p) * 220); ctx.globalAlpha *= clamp(p * 2); fn(); ctx.restore(); };
  fly(0, () => { card(70, 290, 940, 140, R.orange, 30); text('Jonli optimizatsiya', 110, 365, 46, R.ink, 900); mono('AVTO  /  24/7  /  ERR NAZORAT', 112, 405, 14, R.ink, 'left', .28, 700);
    scaled(TOG.x + 65, TOG.y + 32, 1 + .08 * bump(t, T27.on, .22), () => toggle(TOG.x + 60, TOG.y, eInOut(prog(t, T27.on, T27.on + .25)))); });
  fly(1, () => listCard(t));
  fly(2, () => { card(70, 1060, 410, 250, R.card, 30); mono('TEJALDI', 105, 1105, 16, R.grey, 'left', .3, 700);
    const k = eOut(prog(t, T27.saved, T27.saved + 1.2)); text(fmt(Math.round(1860000 * k / 1000) * 1000), 105, 1185, 56, R.ink, 900, 'left', 'middle'); mono('SOʻM', 105, 1240, 15, R.orange, 'left', .3, 700);
    glyph('route', 430, 1110, .8, R.orange); });
  fly(3, () => { card(500, 1060, 400, 250, R.ink, 30); const k = eOut(prog(t, T27.donut, T27.donut + 1.0)); donut(590, 1185, 58, k, R.lime);
    text(`${Math.round(100 * k)}%`, 670, 1175, 64, R.off, 900, 'left', 'middle'); mono('FOYDALI KANALGA', 672, 1228, 13, R.grey, 'left', .25, 700); });
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera((1.03 - .03 * eOut(prog(t, 11, 12)) + .015 * eInOut(prog(t, 12, 21.8))) * punch(t, [T27.on, T27.move, T27.ok], .02), sr, sx, sy, () => {
    ctx.fillStyle = R.paper; ctx.fillRect(0, 0, W, H);
    cardsUI(t);
    const taps = [[T27.on, TOG.x + 125, TOG.y + 32], [T27.move, MOVE.x + MOVE.w / 2 + 120, MOVE.y + 38]];
    if (t > 11.8 && t < 14.4) {
      const [cx, cy] = pathAt(t, [[11.8, 850, 1350], taps[0], [13.0, 850, 1300], taps[1], [14.4, 850, 1400]]);
      withAlpha(Math.min(prog(t, 11.8, 12.0), 1 - prog(t, 14.2, 14.4)), () => cursor(cx, cy, Math.max(...taps.map(([a]) => bump(t, a, .22)))));
    }
    taps.forEach(([a, x, y]) => ripple(x, y, prog(t, a, a + .6), R.ink));
    sparks(t, T27.move + .9, 700, 650, 751, [R.lime, R.ink, R.orange], 26, 600);
  });
  if (t > T27.slam - .05 && t < T27.sheet + .3) {
    const k = eOut(prog(t, T27.slam - .05, T27.slam + .12)), out = prog(t, T27.sheet - .15, T27.sheet + .25);
    const rw = lerp(420, W + 40, k), rh = lerp(240, H + 40, k);
    withAlpha(1 - out, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(120, 0, k)); ctx.fillStyle = R.lime; ctx.fill();
      dotGrid(t, .12, .5, 1, W / 2, 820);
      heavy(t, T27.slam, 'HAR SOʻM', W / 2, 700, 180, R.ink, { rot: .14, endRot: -.03 });
      heavy(t, T27.slam + .1, 'ISHLAYDI.', W / 2, 900, 170, R.ink, { rot: -.14, endRot: .02 });
      withAlpha(prog(t, T27.slam + .3, T27.slam + .55), () => serif('pul — faqat jonli kanallarga', W / 2, 1060, 66, R.ink));
    });
  }
  const mp = eOut(prog(t, T27.sheet, T27.sheet + .45));
  if (mp > 0) {
    withAlpha(.35 * mp, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); });
    const y0 = lerp(H, 360, mp);
    card(70, y0, 840, 700, R.violet, 34);
    withAlpha(prog(t, T27.sheet + .3, T27.sheet + .6), () => { serif('Byudjet —', 490, y0 + 115, 96, R.off); serif('aqlli taqsimotda.', 490, y0 + 215, 96, R.off); });
    const rows = [['TAHLIL', [0, .06, .12]], ['STOP', [.28, .34]], ['TAQSIMLASH', [.5, .56, .62]], ['NATIJA', [.78, .84, .9]]];
    const ph = eInOut(prog(t, T27.sheet + .5, T27.sheet + 1.7)), x0 = 340, x1 = 860;
    rows.forEach(([l, ks], i) => { const ry = y0 + 340 + i * 70; mono(l, 115, ry, 17, R.violetSoft, 'left', .3, 700);
      ctx.fillStyle = 'rgba(239,236,228,.25)'; ctx.fillRect(x0, ry, x1 - x0, 2);
      ks.forEach(k => { const x = lerp(x0, x1, k), lit = ph > k; ctx.save(); ctx.translate(x, ry); ctx.rotate(Math.PI / 4); ctx.fillStyle = lit ? R.lime : 'rgba(239,236,228,.5)'; ctx.fillRect(-11, -11, 22, 22); ctx.restore(); }); });
    ctx.fillStyle = R.orange; ctx.fillRect(lerp(x0, x1, ph) - 2, y0 + 300, 4, 300);
    const dn = eBack(prog(t, T27.sheet + 1.6, T27.sheet + 1.9)); if (dn > 0) scaled(490, y0 + 640, dn, () => { rr(320, y0 + 612, 340, 56, 28); ctx.fillStyle = R.lime; ctx.fill(); mono('BYUDJET ISHLAYAPTI', 490, y0 + 641, 15, R.ink, 'center', .15, 800); });
  }
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Hamma kanalga teng', 'Faqat jonli kanallarga'], ['62% kuyadi', '0% isrof'], ['Natija — taxmin', 'Natija — ×3 mijoz']];
const IMPACTS3 = [[22.15, 22], [22.6, 10], [23.2, 10], [25.0, 16]];
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera((1 + .03 * eInOut(prog(t, 22, 27))) * punch(t, [22.6, 23.2, 25.0], .03), sr, sx, sy, () => {
    resultBg(t);
    const sa = 1 - prog(t, 22.85, 23.15);
    if (sa > 0) withAlpha(sa, () => { stripes(t); heavy(t, 22.1, '×3', W / 2, 780, 420, R.off, { rot: -.25, endRot: -.05 });
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 20; mono('KOʻP MIJOZ', W / 2, 1060, 34, R.off, 'center', .4, 800); ctx.restore(); });
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha((1 - out) * prog(t, 22.9, 23.1), () => {
