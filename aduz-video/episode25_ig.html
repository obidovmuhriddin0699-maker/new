<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Theme switcher (25-qism): all three design systems in one episode. Each theme script replaces the same
// lib.js helpers, so a snapshot is taken after each one loads and useTheme() swaps them in per drawing pass.
const THEMED = ['problemBg', 'episodeTitle', 'counters', 'solutionBg', 'logo', 'resultBg', 'captions', 'endCard'];
function snapTheme() { return { fns: Object.fromEntries(THEMED.map(n => [n, window[n]])), C: { ...C }, F, FD, conf: CONFETTI.map(c => c.c) }; }
function useTheme(th) { Object.assign(window, th.fns); Object.assign(C, th.C); F = th.F; FD = th.FD; CONFETTI.forEach((c, i) => { c.c = th.conf[i]; }); }
const TH_CLASSIC = snapTheme();
</script>
<script src="neon.js"></script>
<script>const TH_NEON = snapTheme();</script>
<script src="reel.js"></script>
<script>FD = null; const TH_REEL = snapTheme();</script>
<script>
// ADUZ — 25-qism: "Mutlaq erkinlik (mobil boshqaruv)". Uchala dizayn tizimi bitta qismda:
// Problem (CLASSIC navy/red): the business lives on one office computer — orders pile up unanswered while the owner,
// a pin on the map, is pulled back by a cable; OFISGA BOG'LIQ · BUYURTMA KUTMOQDA · KECH QOLDINGIZ; chains: QARAMLIK.
// Vacuum: padlock, the monitor dies like an old TV. Transition (new): pocketZoom — the whole office shrinks into a phone.
// Solution: the phone travels through three worlds, each in its own design system — Marg'ilon bazaar 10:15 (CLASSIC
// green), the night road 22:40 (NEON), a choyxona 13:05 (MOTION REEL, HUD) → lime "ISTALGAN JOYDAN." → violet
// keyframe card of the day. Result: a triptych of the three worlds, before/after card, gold badges. End: the three
// logos stutter, then the reel identity card. Sound: CUES_25 in audio.py (every library at once).

const CAPTIONS = [
  [0.4, 4.4, 'Buyurtmalar kelyapti — lekin hammasi ofisdagi kompyuterda.'],
  [4.6, 9.4, 'Siz tashqaridasiz — biznes esa stolga bogʻlangan.'],
  [9.6, 10.3, '...ofis qulf.'],
  [11.4, 14.2, 'ADUZ — biznesingiz choʻntagingizda. Bozorda ham.'],
  [14.6, 17.5, 'Yoʻlda, kechasi ham.'],
  [17.9, 21.6, 'Choy ustida ham. Bir telefon — butun biznes.'],
  [22.4, 27.0, 'Mutlaq erkinlik: istalgan joydan boshqaring.'],
  [27.6, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
// caption / theme per moment
const capTheme = t => t < 14.45 ? TH_CLASSIC : t < 17.75 ? TH_NEON : t < 21.95 ? TH_REEL : t < 27.0 ? TH_CLASSIC : TH_REEL;

function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'pin') { ctx.beginPath(); ctx.moveTo(0, 30); ctx.quadraticCurveTo(-24, 4, -22, -10); ctx.arc(0, -10, 22, Math.PI, 0); ctx.quadraticCurveTo(24, 4, 0, 30); ctx.fill(); ctx.beginPath(); ctx.arc(0, -10, 8, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill(); }
  else if (kind === 'phone') { rr(-16, -28, 32, 56, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 19, 3, 0, 7); ctx.fill(); }
  else if (kind === 'eye') { ctx.beginPath(); ctx.moveTo(-28, 0); ctx.quadraticCurveTo(0, -24, 28, 0); ctx.quadraticCurveTo(0, 24, -28, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill(); }
  else if (kind === 'bell') { ctx.beginPath(); ctx.moveTo(-22, 14); ctx.quadraticCurveTo(-16, 8, -16, -4); ctx.quadraticCurveTo(-16, -24, 0, -26); ctx.quadraticCurveTo(16, -24, 16, -4); ctx.quadraticCurveTo(16, 8, 22, 14); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0, 20, 6, 0, 7); ctx.fill(); }
  else if (kind === 'lock') { rr(-24, -4, 48, 38, 8); ctx.fill(); ctx.beginPath(); ctx.arc(0, -6, 16, Math.PI, 0); ctx.lineWidth = 8; ctx.stroke(); }
  ctx.restore();
}
const curve = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], eInOut(clamp((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])))); return keys[keys.length - 1][1]; };
// Chain of links from (x0,y0) to (x1,y1); p = how much of it is laid (0..1).
function chain(x0, y0, x1, y1, p, col = '#9aa3b2') {
  const len = Math.hypot(x1 - x0, y1 - y0), n = Math.floor(len / 46), a = Math.atan2(y1 - y0, x1 - x0);
  for (let i = 0; i < n * p; i++) { const k = i / n, x = lerp(x0, x1, k), y = lerp(y0, y1, k);
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.lineWidth = 10; ctx.strokeStyle = '#2b3140';
    rr(-30, i % 2 ? -8 : -15, 60, i % 2 ? 16 : 30, 15); ctx.stroke(); ctx.lineWidth = 6; ctx.strokeStyle = col; ctx.stroke(); ctx.restore(); }
}

// ---------- SCENE 1 — Muammo (CLASSIC): tied to the office computer ----------
const NOTIF = [1.4, 2.3, 3.1, 3.9, 4.6, 5.3, 6.0, 6.7, 7.3, 7.9];
const CHN = ['Fargʻona 24', 'Andijon Savdo', 'Vodiy Bozor', 'Namangan Shop', 'Qoʻqon Market'];
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const MON = { x: 160, y: 430, w: 760, h: 500 };
const pathP = s => [200 + 680 * s, 1300 + Math.sin(s * 3.4) * 110];
const walk = t => clamp(curve(t, [[0, 0], [1.0, 0], [4.4, .86], [5.6, .86], [5.75, .8], [6.6, .8], [6.75, .73], [7.6, .73], [7.75, .62], [9.5, .62]]), 0, 1);
function monitor(t, alive = 1) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  rr(MON.x, MON.y, MON.w, MON.h, 26); ctx.fillStyle = '#11151c'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.moveTo(500, MON.y + MON.h); ctx.lineTo(580, MON.y + MON.h); ctx.lineTo(620, 985); ctx.lineTo(460, 985); ctx.closePath(); ctx.fillStyle = '#1b2130'; ctx.fill();
  rr(400, 980, 280, 18, 9); ctx.fillStyle = '#1b2130'; ctx.fill();
  const sx = MON.x + 18, sy = MON.y + 18, sw = MON.w - 36, sh = MON.h - 36;
  if (alive <= 0) { rr(sx, sy, sw, sh, 12); ctx.fillStyle = '#05070d'; ctx.fill(); return [sx, sy, sw, sh]; }
  ctx.save(); rr(sx, sy, sw, sh, 12); ctx.clip();
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(sx, sy, sw, sh);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(sx, sy, sw, 70);
  text('ADUZ · Boshqaruv paneli', sx + 30, sy + 47, 28, '#fff', 800);
  const n = NOTIF.filter(a => t > a).length;
  if (n) { const p = eBack(prog(t, NOTIF[n - 1], NOTIF[n - 1] + .25)); scaled(sx + sw - 50, sy + 35, .8 + .2 * p, () => { ctx.beginPath(); ctx.arc(sx + sw - 50, sy + 35, 24, 0, 7); ctx.fillStyle = C.red; ctx.fill(); text(String(n), sx + sw - 50, sy + 44, 26, '#fff', 900, 'center'); }); }
  const shown = NOTIF.map((a, i) => [a, i]).filter(([a]) => t > a).reverse();
  shown.slice(0, 6).forEach(([a, i], k) => {
    const p = eOut(prog(t, a, a + .25)), y = sy + 90 + (k - (k === 0 ? 1 - p : 0)) * 64 + (k ? 64 * (1 - eOut(prog(t, shown[0][0], shown[0][0] + .25))) * 0 : 0);
    withAlpha(k === 0 ? p : 1, () => {
      rr(sx + 20, y, sw - 40, 54, 12); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#e2e8f0'; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx + 48, y + 27, 9, 0, 7); ctx.fillStyle = C.red; ctx.fill();
      text(`Yangi buyurtma · ${CHN[i % 5]}`, sx + 70, y + 36, 24, '#334155', 700);
      const w = Math.max(0, t - a) * 340, mm = Math.floor(w / 60);
      text(`javobsiz ${Math.floor(mm / 60)}:${String(mm % 60).padStart(2, '0')}`, sx + sw - 40, y + 36, 22, C.red, 800, 'right');
    });
  });
  ctx.restore();
  return [sx, sy, sw, sh];
}
function mapStrip(t, tense) {
  rr(90, 1060, 900, 460, 30); ctx.fillStyle = '#0f1629'; ctx.fill();
  ctx.save(); rr(90, 1060, 900, 460, 30); ctx.clip();
  ctx.strokeStyle = 'rgba(148,163,184,.08)'; ctx.lineWidth = 2; for (let x = 90; x < 990; x += 60) { ctx.beginPath(); ctx.moveTo(x, 1060); ctx.lineTo(x, 1520); ctx.stroke(); } for (let y = 1060; y < 1520; y += 60) { ctx.beginPath(); ctx.moveTo(90, y); ctx.lineTo(990, y); ctx.stroke(); }
  ctx.setLineDash([18, 14]); ctx.lineWidth = 8; ctx.strokeStyle = '#334155'; ctx.beginPath(); for (let s = 0; s <= 1.001; s += .02) { const [x, y] = pathP(s); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]);
  [[0, 'OFIS'], [.45, 'BOZOR'], [.86, 'TOʻY']].forEach(([s, l]) => { const [x, y] = pathP(s); ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fillStyle = s ? '#64748b' : '#94a3b8'; ctx.fill(); text(l, x, y + 48, 22, '#94a3b8', 800, 'center'); });
  ctx.restore();
  // cable from the monitor to the owner
  const s = walk(t), [px, py] = pathP(s), jit = tense * Math.sin(t * 60) * 3;
  ctx.save(); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(MON.x + 40, MON.y + MON.h - 20); ctx.quadraticCurveTo(lerp(60, (MON.x + px) / 2, tense), lerp(1250, (MON.y + MON.h + py) / 2, tense) + jit, px, py - 40);
  ctx.lineWidth = 10 + 4 * tense; ctx.strokeStyle = tense > .5 ? C.red : '#475569'; ctx.shadowColor = C.red; ctx.shadowBlur = 30 * tense; ctx.stroke(); ctx.restore();
  glyph('pin', px, py - 40, 1.6, '#fff');
  const km = 14.2 * s; text(`Ofisdan: ${km.toFixed(1)} km`, px, py - 120, 26, tense > .5 ? '#fecaca' : '#e2e8f0', 800, 'center');
}
function scene1(t) {
  useTheme(TH_CLASSIC);
  const stress = prog(t, 4.0, 9.4), tense = prog(t, 4.0, 4.5);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera((1 + .05 * eInOut(prog(t, 0, 10.4))) * punch(t, NOTIF, .015), sr, sx, sy, () => {
    kText(t, .15, '25-QISM', W / 2, 105, 30, C.red, 'charsDown', { weight: 800 });
    kText(t, .3, 'Mutlaq erkinlik', W / 2, 165, 56, '#fff', 'blurUp', { weight: 800 });
    counters(t, [['9–18', 'ish vaqti', '#fff'], ['1', 'kompyuter', C.red], [String(NOTIF.filter(a => t > a + .5).length), 'javobsiz', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    camera(1, 0, 0, lerp(140, 0, enter), () => { monitor(t); mapStrip(t, tense); });
    const c = prog(t, 8.5, 8.85); if (c > 0) { chain(MON.x - 60, MON.y - 40, MON.x + MON.w + 60, MON.y + MON.h + 60, c); chain(MON.x + MON.w + 60, MON.y - 40, MON.x - 60, MON.y + MON.h + 60, c, '#b6bfcc'); }
  });
  slam(t, 5.6, 'OFISGA BOGʻLIQ', 330, 1000, 50, '#fff', { slab: C.red, rot: -.07, hold: 2.9 });
  slam(t, 6.6, 'BUYURTMA KUTMOQDA', 680, 1580, 46, '#fff', { slab: C.red, rot: .06, hold: 1.9 });
  slam(t, 7.6, 'KECH QOLDINGIZ', 330, 380, 50, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 680, C.red, 1100);
  sparks(t, 8.5, W / 2, 680, 501, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'QARAMLIK', W / 2, 660, 150, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  kText(t, 8.7, 'biznes — stolga zanjirband', W / 2, 820, 52, '#ffb4bc', 'blurUp', { weight: 700, hold: .55, stagger: .05 });
  flash(t, 8.5, C.red, .4, .45);
  // vacuum: chained monitor, padlock, dies like an old TV
  if (t > 9.5) {
    ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H);
    const off = prog(t, 9.8, 10.05);
    const [sx2, sy2, sw2, sh2] = monitor(t, 1);
    if (off > 0) { // CRT collapse
      ctx.fillStyle = '#05070d'; ctx.fillRect(sx2, sy2, sw2, sh2);
      const hh = sh2 * (1 - eIn(clamp(off * 2))), ww = sw2 * (1 - eIn(clamp(off * 2 - 1)));
      if (off < 1) { ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 30; ctx.fillStyle = '#e8f6ff'; ctx.fillRect(sx2 + sw2 / 2 - ww / 2, sy2 + sh2 / 2 - Math.max(3, hh) / 2, Math.max(4, ww), Math.max(3, hh)); ctx.restore(); }
    }
    chain(MON.x - 60, MON.y - 40, MON.x + MON.w + 60, MON.y + MON.h + 60, 1); chain(MON.x + MON.w + 60, MON.y - 40, MON.x - 60, MON.y + MON.h + 60, 1, '#b6bfcc');
    const lp = eBack(prog(t, 9.58, 9.8)); if (lp > 0) scaled(W / 2, MON.y + MON.h / 2 + 10, lp * 2.2, () => glyph('lock', W / 2, MON.y + MON.h / 2 + 10, 1, '#cbd5e1'));
  }
}

// Transition (new): the office frame shrinks into the phone screen; the phone lights up.
function pocketZoom(t, a, b, drawA, drawB) {
  const p = prog(t, a, b), e = eInOut(clamp(p / .8));
  drawB(t);
  const s = lerp(1, SH / H, e), cx = lerp(W / 2, SX + SW / 2, e), cy = lerp(H / 2, SY + SH / 2, e), r = lerp(0, PR - SI, e);
  const fade = 1 - clamp((p - .8) / .2);
  if (fade > 0) withAlpha(fade, () => {
    ctx.save(); rr(cx - W * s / 2, cy - H * s / 2, W * s, H * s, r); ctx.clip();
    ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); drawA(t); ctx.restore();
    ctx.save(); rr(cx - W * s / 2 - 22 * e, cy - H * s / 2 - 22 * e, W * s + 44 * e, H * s + 44 * e, r + 22 * e); ctx.lineWidth = 44 * e; ctx.strokeStyle = '#11151c'; ctx.stroke(); ctx.restore();
  });
  withAlpha(Math.sin(Math.PI * clamp((p - .7) / .3)) * .7, () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); });
}

// ---------- SCENE 2 — Yechim: one phone, three worlds ----------
const T25 = { note: 11.9, ok: 12.6, safe: 13.2, sw1: [14.3, 14.75], ping: 15.3, budget: 15.9, auto: 16.6, sw2: [17.6, 18.0], reply: 18.15, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 20], [T25.ok, 10], [T25.budget, 8], [T25.slam, 34]];
// --- world 1: Marg'ilon bazaar (CLASSIC) ---
function world1(t) {
  useTheme(TH_CLASSIC);
  solutionBg(t, 'Margʻilon bozori · 10:15');
  for (let i = 0; i < 6; i++) { // market awnings along the bottom
    const x = i * 200 - 40, y = 1560 + Math.sin(t * 1.5 + i) * 4;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, 200, 120); ctx.clip();
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#ffffff' : (i % 2 ? '#0ea371' : '#f2c14e'); ctx.fillRect(x + k * 34, y, 34, 120); }
    ctx.restore(); ctx.beginPath(); for (let k = 0; k <= 5; k++) ctx.arc(x + 20 + k * 34, y + 120, 17, 0, Math.PI); ctx.fillStyle = i % 2 ? '#0ea371' : '#f2c14e'; ctx.fill();
  }
}
function app1(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Buyurtmalar', SX + 50, SY + 108, 40, '#fff', 900); glyph('bell', SX + SW - 80, SY + 92, 1, 'rgba(255,255,255,.9)');
  const np = eBack(prog(t, T25.note, T25.note + .35)), nq = prog(t, T25.note + 1.2, T25.note + 1.5);
  if (np > 0 && nq < 1) withAlpha(1 - nq, () => { const y = SY + lerp(20, 170, Math.min(1, np)); rr(SX + 24, y, SW - 48, 96, 22); ctx.fillStyle = '#0f172a'; ctx.fill(); glyph('bell', SX + 74, y + 48, .7, '#ffc83d'); text('Yangi buyurtma!', SX + 120, y + 42, 26, '#fff', 800); text('Fargʻona 24 · hozirgina', SX + 120, y + 76, 22, '#94a3b8', 600); });
  const cp = eOut(prog(t, 11.5, 11.9)), y0 = SY + 300;
  withAlpha(cp, () => {
    rr(SX + 30, y0, SW - 60, 600, 26); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#e2e8f0'; ctx.stroke();
    ctx.beginPath(); ctx.arc(SX + 100, y0 + 80, 40, 0, 7); ctx.fillStyle = '#14b8a6'; ctx.fill(); text('F24', SX + 100, y0 + 90, 26, '#fff', 900, 'center');
    text('Fargʻona 24', SX + 160, y0 + 72, 34, C.ink, 800); text('128 000 obunachi', SX + 160, y0 + 108, 24, C.grey, 600);
    [['Post', '1 ta · ertaga 09:00'], ['Narx', '290 000 soʻm'], ['Toʻlov', 'ADUZ kafolatida']].forEach(([a, b], i) => { text(a, SX + 70, y0 + 200 + i * 70, 26, C.grey, 700); text(b, SX + SW - 70, y0 + 200 + i * 70, 28, C.ink, 800, 'right'); });
    const ok = t > T25.ok;
    scaled(SX + SW / 2, y0 + 495, 1 - .05 * bump(t, T25.ok, .22), () => { rr(SX + 70, y0 + 450, SW - 140, 90, 45); ctx.fillStyle = ok ? '#065f46' : '#0ea371'; ctx.fill(); text(ok ? 'Tasdiqlandi ✓' : 'Tasdiqlash', SX + SW / 2, y0 + 507, 34, '#fff', 900, 'center'); shine(SX + 70, y0 + 450, SW - 140, 90, prog(t, T25.ok, T25.ok + .5), 45); });
  });
  const st = eBack(prog(t, T25.ok + .1, T25.ok + .45));
  if (st > 0 && t < T25.sw1[1]) scaled(SX + SW / 2, SY + 1010, st, () => { ctx.beginPath(); ctx.arc(SX + SW / 2, SY + 1010, 56, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(SX + SW / 2, SY + 1012, 50, '#fff', 10, prog(t, T25.ok + .3, T25.ok + .6)); });
}
// --- world 2: night road (NEON) ---
const SKY = (() => { const r = rnd(503); let x = -20; const out = []; while (x < W + 40) { const w = 70 + r() * 110, h = 180 + r() * 380; out.push([x, w, h, r()]); x += w + 6; } return out; })();
function world2(t) {
  useTheme(TH_NEON);
  neonGround(t, .7, [W + 40, 300, '8,192,200', .3, 1000]);
  SKY.forEach(([x, w, h, k]) => { ctx.fillStyle = '#0b0910'; ctx.fillRect(x, 1560 - h, w, h + 400);
    for (let yy = 1560 - h + 24; yy < 1540; yy += 40) for (let xx = x + 14; xx < x + w - 14; xx += 30) { const on = Math.sin(xx * 7.1 + yy * 3.3 + k * 9) > .2; if (!on) continue; ctx.fillStyle = (xx + yy) % 3 ? 'rgba(248,120,136,.5)' : 'rgba(8,192,200,.5)'; ctx.fillRect(xx, yy, 12, 18); } });
  ctx.fillStyle = '#08060c'; ctx.fillRect(0, 1560, W, 360);
  for (let k = 0; k < 7; k++) { const z = ((t * 1.6 + k / 7) % 1), y = 1570 + z * z * 350, w2 = 8 + z * 40, l = 20 + z * 140; ctx.fillStyle = `rgba(248,64,88,${.3 + .6 * z})`; ctx.fillRect(W / 2 - w2 / 2, y, w2, l * .3); }
  glowText('YOʻLDA · 22:40', W / 2, 190, 64, N.ink, 900, 'center', 'middle', 'rgba(252,252,252,.6)', .7);
  text('Fargʻona — Toshkent', W / 2, 270, 38, N.muted, it(500), 'center');
}
function app2(t) {
  ctx.fillStyle = '#151120'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0b5f66'; ctx.fillRect(SX, SY, SW, 150);
  text('Kampaniya', SX + 50, SY + 108, 40, N.ink, 900);
  chipCard(SX + 30, SY + 180, SW - 60, 430, 18);
  text('Yozgi chegirma', SX + 60, SY + 240, 32, N.ink, 800);
  ctx.beginPath(); ctx.arc(SX + SW - 150, SY + 230, 8, 0, 7); ctx.fillStyle = N.cyan; ctx.fill(); text('faol', SX + SW - 130, SY + 240, 24, N.cyan, it(600));
  const k = eOut(prog(t, 14.6, 17.4)), pts = Array.from({ length: 13 }, (_, i) => [SX + 60 + i * 50, SY + 540 - (60 + i * 18 + Math.sin(i * 1.7) * 30) * (i / 12 < k ? 1 : 0)]);
  ctx.save(); ctx.shadowColor = N.pink; ctx.shadowBlur = 20; ctx.beginPath(); pts.forEach(([x, y], i) => { if (i / 12 > k + .001) return; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.lineWidth = 6; ctx.strokeStyle = N.pinkSoft; ctx.stroke(); ctx.restore();
  text(`Koʻrishlar: ${fmt(12400 + 6200 * k)}`, SX + 60, SY + 585, 26, N.muted, it(500));
  // budget button + bar
