<script>
// ADUZ — 26-qism: "Ulashing va daromad ko'ring" — "motion reel" uslubi (24-qism dizayni, reel.js).
// Problem: you recommend a service to eight friends — the message flies along a network graph, every friend signs up
// (lime "+1"), and your wallet stays at 0 so'm; BEPUL REKLAMA · RAHMAT HAM YO'Q · 0 SO'M; orange cut "BEHUDA.".
// Vacuum: the links snap away, the "0 SO'M" wallet decodes into noise and turns to dust. Transition (new): stripe wipe
// with the serif word "Ulashing.". Solution on paper: referral-link card (copy), share to friends, sign-ups each paying
// a bonus, income counter + sparkline, 10% donut, monthly bars; lime "PASSIV DAROMAD."; violet keyframe card.
// Result: halftone "10%", before/after, palette badges, particle sphere. End: identity card. Sound: CUES_26 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Doʻstlarga tavsiya qildingiz — hammasi roʻyxatdan oʻtdi...'],
  [4.6, 9.4, '...sizga esa — nol. Rahmat ham yoʻq.'],
  [9.6, 10.3, '...behuda mehnat.'],
  [11.4, 16.2, 'ADUZ referal havolasi: ulashing — har roʻyxatdan foiz oling.'],
  [16.4, 21.6, 'Siz uxlaysiz — havola ishlaydi.'],
  [22.4, 27.0, 'Tavsiya — endi daromad.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
const SECTIONS = [[0, '00', 'IGNITION'], [1, '01', 'MUAMMO'], [9.5, '02', 'VAKUUM'], [10.3, '03', 'OTISH'], [11, '04', 'YECHIM'], [22, '05', 'NATIJA'], [27, '06', 'ADUZ']];
function glyph(kind, x, y, s = 1, col = R.ink) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'link') { [-1, 1].forEach(k => { ctx.save(); ctx.rotate(-Math.PI / 4); rr(k * 14 - 18, -11, 36, 22, 11); ctx.stroke(); ctx.restore(); }); }
  else if (kind === 'people') { [[-15, 0, .8], [15, 0, .8], [0, 4, 1]].forEach(([dx, dy, k]) => { ctx.beginPath(); ctx.arc(dx, dy - 14 * k, 9 * k, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(dx, dy + 18 * k, 16 * k, Math.PI, 0); ctx.fill(); }); }
  else if (kind === 'coin') { ctx.beginPath(); ctx.arc(0, 0, 28, 0, 7); ctx.stroke(); ctx.font = `900 30px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('S', 0, 2); }
  else if (kind === 'plane') { ctx.beginPath(); ctx.moveTo(-26, 2); ctx.lineTo(28, -20); ctx.lineTo(14, 24); ctx.lineTo(4, 8); ctx.closePath(); ctx.fill(); }
  else if (kind === 'wallet') { rr(-30, -20, 60, 42, 8); ctx.stroke(); ctx.beginPath(); ctx.arc(16, 1, 5, 0, 7); ctx.fill(); }
  ctx.restore();
}
const curve = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], eInOut(clamp((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])))); return keys[keys.length - 1][1]; };
function slabCard(t, at, s, x, y, size, bg, fg, rot, hold) {
  const p = prog(t, at, at + .3), q = prog(t, at + hold, at + hold + .2); if (p <= 0 || q >= 1) return;
  ctx.save(); ctx.globalAlpha *= clamp(p * 3) * (1 - q); ctx.translate(x, y); ctx.rotate(rot * eOut(p) + (1 - eOut(p)) * -.4);
  const sc = lerp(1.8, 1, eBack(p)); ctx.scale(sc, sc);
  ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width;
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  rr(-w / 2 - size * .5, -size * .72, w + size, size * 1.44, size * .36); ctx.fillStyle = bg; ctx.fill(); ctx.shadowColor = 'transparent';
  text(s, 0, size * .04, size, fg, 900, 'center', 'middle'); ctx.restore();
}
function initials(x, y, r, s, col, fg = R.ink) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = col; ctx.fill(); text(s, x, y + 2, r * .8, fg, 900, 'center', 'middle'); }

// ---------- SCENE 1 — Muammo: recommending for nothing ----------
const NET = { cx: 540, cy: 870 };
const FR = ['DS', 'MA', 'JN', 'SH', 'OK', 'NR', 'BX', 'ZT'].map((s, i) => { const a = -Math.PI / 2 + i / 8 * Math.PI * 2; return { s, x: NET.cx + Math.cos(a) * 330, y: NET.cy + Math.sin(a) * 300, c: [R.orange, R.lime, R.violet, R.off][i % 4], send: 1.0 + i * .55 }; });
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
function network(t, alive = 1) {
  rr(90, 440, 900, 880, 34); ctx.fillStyle = R.ink2; ctx.fill();
  mono('TAVSIYA TARMOGʻI', 130, 490, 16, R.grey, 'left', .3, 700);
  FR.forEach((f, i) => {
    const sent = prog(t, f.send, f.send + .5), joined = t > f.send + .55;
    const snap = 1 - alive;
    // edge
    if (sent > 0) { ctx.save(); ctx.lineWidth = 3; ctx.strokeStyle = joined ? 'rgba(214,240,58,.55)' : 'rgba(239,236,228,.3)';
      if (snap > 0) ctx.setLineDash([10, 12]);
      const k = 1 - snap; ctx.beginPath(); ctx.moveTo(NET.cx, NET.cy); ctx.lineTo(lerp(NET.cx, f.x, sent * k), lerp(NET.cy, f.y, sent * k)); ctx.stroke(); ctx.restore(); }
    // message plane flying out
    if (sent > 0 && sent < 1) { const e = eInOut(sent); glyph('plane', lerp(NET.cx, f.x, e), lerp(NET.cy, f.y, e), .7, R.off); }
    // friend node
    const pop = eBack(prog(t, .5 + i * .06, .85 + i * .06)); if (pop <= 0) return;
    withAlpha(alive > 0 ? 1 : 0, () => scaled(f.x, f.y, pop * (1 + .15 * bump(t, f.send + .55, .25)), () => {
      initials(f.x, f.y, 46, f.s, joined ? f.c : '#3a373d', joined ? (f.c === R.violet ? R.off : R.ink) : R.grey);
      if (joined) { ctx.beginPath(); ctx.arc(f.x + 36, f.y - 36, 17, 0, 7); ctx.fillStyle = R.lime; ctx.fill(); check(f.x + 36, f.y - 35, 16, R.ink, 4); }
    }));
    const lp = prog(t, f.send + .55, f.send + 1.2); if (lp > 0 && lp < 1) withAlpha(1 - lp, () => mono('+1 ROʻYXAT', f.x, f.y - 70 - 40 * lp, 15, R.lime, 'center', .2, 800));
  });
  // you
  initials(NET.cx, NET.cy, 64, 'SIZ', R.off, R.ink);
}
function wallet(t) {
  const joins = FR.filter(f => t > f.send + .55).length, hit = FR.reduce((n, f) => n + bump(t, f.send + .55, .3), 0);
  withAlpha(prog(t, 1.0, 1.4), () => {
    mono('SIZNING DAROMADINGIZ', 90, 1385, 18, R.grey, 'left', .32, 700);
    ctx.save(); ctx.translate(90, 1460); ctx.translate(Math.sin(t * 70) * 6 * hit, 0);
    ctx.letterSpacing = '2px'; ctx.font = `700 84px ${MONO}`; ctx.fillStyle = joins ? R.orange : R.off; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('0 SOʻM', 0, 0); ctx.restore();
    glyph('wallet', 930, 1455, 1.2, R.orange);
    tickLine(720, 1540, 400, 1, R.orange, 'rgba(239,236,228,.3)');
  });
}
function scene1(t) {
  const stress = prog(t, 4.0, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera((1 + .05 * eInOut(prog(t, 0, 10.4))) * punch(t, FR.map(f => f.send + .55), .015), sr, sx, sy, () => {
    scramble(t, .1, '26-QISM', W / 2, 140, 26, R.orange, { dur: .6 });
    tickLine(W / 2, 172, 520, eInOut(prog(t, .1, .7)));
    heavy(t, .45, 'ULASHING', W / 2, 228, 84, R.off, { rot: -.08 });
    const joins = FR.filter(f => t > f.send + .55).length, sent = FR.filter(f => t > f.send).length;
    counters(t, [[String(sent), 'tavsiya', '#fff'], [String(joins), 'qoʻshildi', R.lime], ['0', 'sizga, soʻm', R.orange]]);
    const enter = eOut(prog(t, 0, .7));
    camera(1, 0, 0, lerp(160, 0, enter), () => withAlpha(enter, () => { network(t); wallet(t); }));
  });
  slabCard(t, 5.6, 'BEPUL REKLAMA', 340, 560, 52, R.orange, R.ink, -.08, 2.9);
  slabCard(t, 6.6, 'RAHMAT HAM YOʻQ', 700, 1210, 48, R.violet, R.off, .07, 1.9);
  slabCard(t, 7.6, '0 SOʻM', 300, 1000, 64, R.off, R.ink, -.05, .9);
  if (t > 8.45 && t < 9.5) {
    const k = eOut(prog(t, 8.45, 8.62)), cut = 1 - prog(t, 9.3, 9.45), rw = lerp(500, W + 40, k), rh = lerp(260, H + 40, k);
    withAlpha(cut, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(130, 0, k)); ctx.fillStyle = R.orange; ctx.fill();
      heavy(t, 8.5, 'BEHUDA.', W / 2, 860, 220, R.ink, { rot: -.12, endRot: -.04 });
      withAlpha(prog(t, 8.7, 8.9), () => serif('tavsiyangiz — boshqalarga foyda', W / 2, 1050, 66, R.ink));
      const dp = eBack(prog(t, 8.6, 8.9)); if (dp > 0) scaled(810, 1360, dp, () => { ctx.beginPath(); ctx.arc(810, 1360, 150, 0, 7); ctx.fillStyle = R.ink; ctx.fill(); glyph('coin', 810, 1360, 2.6, R.grey); ctx.beginPath(); ctx.moveTo(740, 1290); ctx.lineTo(880, 1430); ctx.lineWidth = 10; ctx.strokeStyle = R.orange; ctx.stroke(); });
    });
  }
  // vacuum: the links snap away, the wallet decodes into noise and turns to dust
  if (t > 9.5) {
    ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H);
    const p = prog(t, 9.55, 10.25);
    network(t, 1 - eOut(clamp(p * 2)));
    const n = Math.floor(t * 30);
    withAlpha(1 - eIn(prog(t, 9.95, 10.3)), () => mono(p < .3 ? '0 SOʻM' : [...'0 SOʻM'].map((c, i) => c === ' ' ? ' ' : SCR[Math.abs(Math.floor(Math.sin((i + 1) * 9.1 + n * 3.3) * 999)) % SCR.length]).join(''), W / 2, 1460, 90, R.orange, 'center', .1, 700));
    disintegrate(200, 1380, 680, 160, clamp((p - .45) / .55), R.ink, 601, 10);
  }
}

// ---------- SCENE 2 — Yechim: referral link → passive income ----------
const T26 = { copy: 12.3, share: 12.95, joins: [13.6, 14.2, 14.8, 15.4], income: 15.6, donut: 16.1, bars: 16.6, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T26.copy, 10], [T26.share, 8], [T26.slam, 34]];
const JOIN = [['Dilshod', 'Andijon'], ['Madina', 'Fargʻona'], ['Jasur', 'Namangan'], ['Shahlo', 'Qoʻqon']];
const COPY = { x: 790, y: 455 }, SHARE = { x: 790, y: 640 };
function cardsUI(t) {
  const fly = (i, fn) => { const p = eBack(prog(t, 11.25 + i * .12, 11.7 + i * .12)); if (p <= 0) return; ctx.save(); ctx.translate(0, (1 - p) * 220); ctx.globalAlpha *= clamp(p * 2); fn(); ctx.restore(); };
  fly(0, () => { // orange: referral link
    card(70, 360, 940, 170, R.orange, 30);
    text('Referal havola', 110, 425, 50, R.ink, 900);
    rr(110, 450, 520, 56, 28); ctx.fillStyle = 'rgba(14,13,15,.14)'; ctx.fill(); glyph('link', 145, 478, .6, R.ink);
    mono('aduz.uz/r/AZIZ24', 175, 479, 22, R.ink, 'left', .08, 800);
    const cp = t > T26.copy;
    scaled(COPY.x + 90, COPY.y + 23, 1 - .06 * bump(t, T26.copy, .22), () => { rr(COPY.x, COPY.y - 5, 180, 56, 28); ctx.fillStyle = R.ink; ctx.fill(); mono(cp ? 'NUSXALANDI' : 'NUSXA', COPY.x + 90, COPY.y + 23, 15, cp ? R.lime : R.off, 'center', .2, 800); });
  });
  fly(1, () => { // white: share + sign-ups
    card(70, 560, 940, 560, R.card, 30);
    mono('ULASHILDI  /  ROʻYXATDAN OʻTDI', 110, 610, 16, R.grey, 'left', .3, 700);
    scaled(SHARE.x + 90, SHARE.y + 23, 1 - .06 * bump(t, T26.share, .22), () => { rr(SHARE.x, SHARE.y - 5, 180, 56, 28); ctx.fillStyle = t > T26.share ? R.violet : R.ink; ctx.fill(); mono('ULASHISH', SHARE.x + 90, SHARE.y + 23, 15, R.off, 'center', .2, 800); });
    // share targets
    ['DS', 'MA', 'JN', 'SH', 'OK'].forEach((s, i) => { const p = eBack(prog(t, T26.share + .05 + i * .06, T26.share + .35 + i * .06)); if (p > 0) scaled(140 + i * 100, 668, p, () => initials(140 + i * 100, 668, 36, s, [R.orange, R.lime, R.violet, R.off, R.orange][i], i === 2 ? R.off : R.ink)); });
    JOIN.forEach(([nm, city], i) => { const a = T26.joins[i], p = eOut(prog(t, a, a + .3)); if (p <= 0) return;
      const y = 740 + i * 90; withAlpha(p, () => { ctx.save(); ctx.translate((1 - p) * 80, 0);
        rr(100, y, 880, 74, 18); ctx.fillStyle = i % 2 ? '#efede8' : '#f3f1ec'; ctx.fill();
        initials(150, y + 37, 26, nm.slice(0, 2).toUpperCase(), [R.orange, R.lime, R.violet, R.off][i], i === 2 ? R.off : R.ink);
        text(`${nm} roʻyxatdan oʻtdi`, 195, y + 46, 28, R.ink, 700); mono(city.toUpperCase(), 600, y + 38, 14, R.grey, 'left', .25, 700);
        rr(800, y + 15, 160, 44, 22); ctx.fillStyle = R.lime; ctx.fill(); text('+15 000', 880, y + 46, 24, R.ink, 900, 'center');
        ctx.restore(); }); });
  });
  fly(2, () => { // white: income
    card(70, 1150, 450, 260, R.card, 30);
    mono('DAROMAD', 105, 1195, 16, R.grey, 'left', .3, 700);
    const k = eOut(prog(t, T26.income, T26.income + 1.4)), sum = Math.round(1240000 * k / 1000) * 1000;
    text(fmt(sum), 105, 1270, 66, R.ink, 900, 'left', 'middle'); mono('SOʻM / OY', 105, 1320, 15, R.orange, 'left', .3, 700);
    ctx.save(); ctx.beginPath(); for (let i = 0; i <= 20; i++) { const x = 110 + i * 19, y = 1385 - (i / 20) ** 1.8 * 50 * k - Math.sin(i) * 4; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.lineWidth = 4; ctx.strokeStyle = R.orange; ctx.stroke(); ctx.restore();
  });
  fly(3, () => { // black donut: commission
    card(550, 1150, 460, 260, R.ink, 30);
    const k = eOut(prog(t, T26.donut, T26.donut + 1.0));
    donut(650, 1280, 62, .1 * k, R.lime);
    text(`${Math.round(10 * k)}%`, 745, 1268, 76, R.off, 900, 'left', 'middle');
    mono('HAR TOʻLOVDAN', 747, 1325, 14, R.grey, 'left', .3, 700);
  });
  fly(4, () => { // lime: monthly bars
    card(70, 1440, 940, 160, R.lime, 30);
    mono('OYLIK DAROMAD', 105, 1480, 16, R.ink, 'left', .3, 700);
    serif('Siz uxlaysiz — havola ishlaydi.', 105, 1545, 44, R.ink, 'left');
    [2, 3, 3, 5, 6, 8, 9, 12].forEach((v, i) => { const k = eBack(clamp((t - T26.bars - i * .05) / .35)); if (k <= 0) return; const bh = v * 8 * k; rr(745 + i * 30, 1580 - bh, 20, bh, 4); ctx.fillStyle = i === 7 ? R.orange : R.ink; ctx.fill(); });
  });
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera((1.03 - .03 * eOut(prog(t, 11, 12)) + .02 * eInOut(prog(t, 12, 21.8))) * punch(t, [T26.copy, T26.share, ...T26.joins], .018), sr, sx, sy, () => {
    solutionBg(t, 'Ulashing va daromad koʻring');
    cardsUI(t);
    const taps = [[T26.copy, COPY.x + 90, COPY.y + 23], [T26.share, SHARE.x + 90, SHARE.y + 23]];
    if (t > 11.8 && t < 13.6) {
      const [cx, cy] = pathAt(t, [[11.8, W - 60, 1500], taps[0], taps[1], [13.6, W - 40, 1650]]);
      withAlpha(Math.min(prog(t, 11.8, 12.0), 1 - prog(t, 13.4, 13.6)), () => cursor(cx, cy, Math.max(...taps.map(([a]) => bump(t, a, .22)))));
    }
    taps.forEach(([a, x, y]) => ripple(x, y, prog(t, a, a + .6), R.ink));
    T26.joins.forEach((a, i) => sparks(t, a + .1, 880, 777 + i * 90, 611 + i, [R.lime, R.ink, R.orange], 14, 380));
  });
  // 18.5: lime full-bleed "PASSIV DAROMAD."
  if (t > T26.slam - .05 && t < T26.sheet + .3) {
    const k = eOut(prog(t, T26.slam - .05, T26.slam + .12)), out = prog(t, T26.sheet - .15, T26.sheet + .25);
    const rw = lerp(420, W + 40, k), rh = lerp(240, H + 40, k);
    withAlpha(1 - out, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(120, 0, k)); ctx.fillStyle = R.lime; ctx.fill();
      dotGrid(t, .12, .5, 1, W / 2, 900);
      heavy(t, T26.slam, 'PASSIV', W / 2, 770, 230, R.ink, { rot: .14, endRot: -.03 });
      heavy(t, T26.slam + .1, 'DAROMAD.', W / 2, 980, 176, R.ink, { rot: -.14, endRot: .02 });
      withAlpha(prog(t, T26.slam + .3, T26.slam + .55), () => serif('bir havola — doimiy foyda', W / 2, 1160, 72, R.ink));
    });
  }
  // 19.7: violet keyframe card — the money path
  const mp = eOut(prog(t, T26.sheet, T26.sheet + .45));
  if (mp > 0) {
    withAlpha(.35 * mp, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); });
    const y0 = lerp(H, 620, mp);
    card(80, y0, 920, 760, R.violet, 34);
    withAlpha(prog(t, T26.sheet + .3, T26.sheet + .6), () => { serif('Ulashing —', W / 2, y0 + 120, 100, R.off); serif('daromad koʻring.', W / 2, y0 + 225, 100, R.off); });
    const rows = [['HAVOLA', [0, .06]], ['ROʻYXAT', [.24, .3, .36]], ['TOʻLOV', [.5, .56, .62]], ['DAROMAD', [.74, .8, .86, .92]]];
    const ph = eInOut(prog(t, T26.sheet + .5, T26.sheet + 1.7)), x0 = 330, x1 = 940;
    rows.forEach(([l, ks], i) => { const ry = y0 + 350 + i * 70; mono(l, 130, ry, 17, R.violetSoft, 'left', .3, 700);
      ctx.fillStyle = 'rgba(239,236,228,.25)'; ctx.fillRect(x0, ry, x1 - x0, 2);
      ks.forEach(k => { const x = lerp(x0, x1, k), lit = ph > k; ctx.save(); ctx.translate(x, ry); ctx.rotate(Math.PI / 4); ctx.fillStyle = lit ? R.lime : 'rgba(239,236,228,.5)'; ctx.fillRect(-11, -11, 22, 22); ctx.restore(); }); });
    ctx.fillStyle = R.orange; ctx.fillRect(lerp(x0, x1, ph) - 2, y0 + 310, 4, 300);
    const dn = eBack(prog(t, T26.sheet + 1.6, T26.sheet + 1.9)); if (dn > 0) scaled(800, y0 + 680, dn, () => { rr(640, y0 + 652, 320, 56, 28); ctx.fillStyle = R.lime; ctx.fill(); mono('HISOBGA TUSHDI', 800, y0 + 681, 15, R.ink, 'center', .15, 800); });
  }
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Bepul tavsiya', 'Har tavsiyadan foiz'], ['Rahmat ham yoʻq', 'Hisobga pul'], ['Bir martalik', 'Passiv, har oy']];
const IMPACTS3 = [[22.15, 22], [22.6, 10], [23.2, 10], [25.0, 16]];
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera((1 + .03 * eInOut(prog(t, 22, 27))) * punch(t, [22.6, 23.2, 25.0], .03), sr, sx, sy, () => {
    resultBg(t);
    // 22–23: halftone "10%"
    const sa = 1 - prog(t, 22.85, 23.15);
    if (sa > 0) withAlpha(sa, () => { halftone(t, W / 2, 900); heavy(t, 22.1, '10%', W / 2, 900, 360, R.off, { rot: .25, endRot: .04 });
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20; mono('HAR TAVSIYADAN', W / 2, 1150, 30, R.off, 'center', .4, 800); ctx.restore(); });
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha((1 - out) * prog(t, 22.9, 23.1), () => {
      scramble(t, 22.95, 'NATIJA', W / 2, 190, 26, R.lime, { dur: .4 });
      heavy(t, 23.0, 'TAVSIYA = DAROMAD', W / 2, 270, 70, R.off, { rot: .06 });
      serif('havola · roʻyxat · har oy foiz', W / 2, 360, 46, R.violetSoft);
      const cp = eOut(prog(t, 23.0, 23.5)), x = 90, y = lerp(500, 460, cp), w = 900, h = 450;
      withAlpha(cp, () => {
        card(x, y, w, h, R.card, 30);
        mono('OLDIN', x + 60, y + 66, 20, R.grey, 'left', .3, 800);
        rr(x + 470, y + 36, 180, 54, 27); ctx.fillStyle = R.orange; ctx.fill();
        mono('ADUZ', x + 560, y + 64, 20, R.ink, 'center', .3, 800);
        ctx.fillStyle = '#e4e1da'; ctx.fillRect(x + w / 2 - 20, y + 110, 2, h - 140);
        CMP.forEach(([a, b], i) => {
