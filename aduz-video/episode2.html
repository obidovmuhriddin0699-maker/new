<script>
// ADUZ — 2-qism: "Auditoriyani topish muammosi"
// Scenes for this episode; shared helpers live in lib.js.

const CAPTIONS = [
  [0.4, 5.6, 'Katta kanalga reklama berdingiz: koʻrishlar koʻp, mijoz yoʻq.'],
  [5.8, 10.8, 'Chunki oʻquvchilar boshqa shahar, boshqa yosh, boshqa qiziqishda.'],
  [11.4, 16.2, 'ADUZʼda auditoriyani oldindan tanlaysiz: hudud, jins, yosh, qiziqish.'],
  [16.4, 21.8, 'Algoritm faqat sizning mijozlaringiz oʻqiydigan kanallarni topadi.'],
  [22.4, 27.0, 'Koʻrishlar kamroq — mijozlar esa 32 barobar koʻp.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];

// ---------- SCENE 1 — Muammo ----------
const COMMENTS = [
  [3.3, 'Toshkentga yetkazib berasizmi?', '#f59e0b'],
  [4.1, 'Erkaklar uchun yoʻqmi?', '#3b82f6'],
  [4.9, 'Samarqanddanman, kelolmayman', '#a855f7'],
];
const STATS = [
  ['Hudud', [['Toshkent', 64, C.red], ['Boshqa viloyatlar', 29, '#f87171'], ['Fargʻona vodiysi', 7, C.green]]],
  ['Jins', [['Erkaklar', 81, C.red], ['Ayollar', 19, C.green]]],
  ['Yosh', [['14–18 yosh', 58, C.red]]],
];
const ERRORS = [
  [6.6, 'Boshqa shahar', 40, 470, -.07],
  [7.1, 'Boshqa yosh', 690, 640, .07],
  [7.6, 'Boshqa qiziqish', 30, 1420, .05],
  [8.1, 'Pul havoga', 680, 1470, -.06],
];
// Viewers raining onto a target and mostly missing it.
const VIEWERS = (() => {
  const r = rnd(11);
  return Array.from({ length: 80 }, (_, i) => {
    const hit = r() < .07, a = r() * Math.PI * 2, d = hit ? r() * 120 : 380 + r() * 520;
    return { at: 1 + i * .095, x0: r() * W, x: W / 2 + Math.cos(a) * d, y: 960 + Math.sin(a) * d * 1.1, hit };
  });
})();
function target(cx, cy, k, alpha) {
  [820, 640, 460, 280, 120].forEach((rad, i) => {
    ctx.beginPath(); ctx.arc(cx, cy, rad * k, 0, 7);
    ctx.lineWidth = 4; ctx.strokeStyle = i === 4 ? `rgba(22,199,132,${alpha * 2})` : `rgba(255,255,255,${alpha})`; ctx.stroke();
  });
}
function eye(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(0, -12, 14, 0); ctx.quadraticCurveTo(0, 12, -14, 0);
  ctx.lineWidth = 2.5; ctx.strokeStyle = color; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function dress(cx, cy, s, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-18, -70); ctx.lineTo(-30, -40); ctx.lineTo(-20, -10); ctx.lineTo(-70, 80); ctx.quadraticCurveTo(0, 95, 70, 80);
  ctx.lineTo(20, -10); ctx.lineTo(30, -40); ctx.lineTo(18, -70); ctx.quadraticCurveTo(0, -55, -18, -70);
  ctx.fill(); ctx.restore();
}
function scene1(t) {
  const stress = prog(t, 5.5, 10);
  problemBg(t, stress);

  // target + viewers missing it
  target(W / 2, 960, eOut(prog(t, .2, 1.2)), .07);
  for (const d of VIEWERS) {
    const p = prog(t, d.at, d.at + .6);
    if (p <= 0) continue;
    const e = eOut(p), x = lerp(d.x0, d.x, e), y = lerp(-30, d.y, e);
    const land = prog(t, d.at + .6, d.at + 1);
    if (land > 0 && land < 1) { ctx.beginPath(); ctx.arc(x, y, 12 + 30 * land, 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,255,255,${.4 * (1 - land)})`; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fillStyle = d.hit ? C.green : C.red; ctx.fill();
  }

  episodeTitle(t, '2-QISM', 'Auditoriyani topish muammosi', 56);
  const views = 38000 * eInOut(prog(t, 1, 9)), clients = t < 6 ? 0 : t < 8.5 ? 1 : 2;
  counters(t, [[fmt(views), 'koʻrish', '#fff'], [String(clients), 'mijoz', C.red], ['1,2 mln', 'soʻm sarflandi', C.red]]);

  const shake = t > 6.5 ? Math.sin(t * 47) * 7 * stress : 0;
  const enter = eOut(prog(t, 0, .7));
  phone('#0e1621', shake, lerp(120, 0, enter), shake * .002, () => {
    // channel header
    ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150);
    ctx.beginPath(); ctx.arc(SX + 80, SY + 95, 36, 0, 7); ctx.fillStyle = '#e11d48'; ctx.fill();
    text('TM', SX + 80, SY + 97, 28, '#fff', 800, 'center', 'middle');
    text('Toshkent Memlar', SX + 135, SY + 88, 34, '#fff', 700);
    text('128 ming obunachi', SX + 135, SY + 126, 24, '#7f91a4', 500);
    // the ad post
    const pp = eOut(prog(t, .6, 1.2));
    const px = SX + 30, py = SY + 180 + lerp(60, 0, pp), pw = SW - 60;
    withAlpha(pp, () => {
      rr(px, py, pw, 560, 28); ctx.fillStyle = '#182533'; ctx.fill();
      ctx.save(); rr(px, py, pw, 330, 28); ctx.clip();
      const ig = ctx.createLinearGradient(px, py, px + pw, py + 330);
      ig.addColorStop(0, '#f472b6'); ig.addColorStop(1, '#7c3aed'); ctx.fillStyle = ig; ctx.fillRect(px, py, pw, 330);
      dress(px + pw / 2, py + 165, 1.25, 'rgba(255,255,255,.92)');
      ctx.restore();
      ctx.beginPath(); ctx.arc(px + pw - 90, py + 80, 56, 0, 7); ctx.fillStyle = C.gold; ctx.fill();
      text('-30%', px + pw - 90, py + 82, 32, C.ink, 900, 'center', 'middle');
      text('Ayollar koʻylaklari — 30% chegirma!', px + 28, py + 385, 31, '#fff', 800);
      text('Fargʻona sh., Mustaqillik koʻchasi', px + 28, py + 430, 27, '#b6c2cf', 500);
      eye(px + 40, py + 510, 1.3, '#7f91a4');
      text(fmt(views), px + 70, py + 520, 26, '#7f91a4', 600);
      text('12:04', px + pw - 28, py + 520, 24, '#7f91a4', 500, 'right');
    });
    // comments from the wrong audience
    COMMENTS.forEach(([at, s, col], i) => {
      const p = prog(t, at, at + .35);
      if (p <= 0) return;
      const y = SY + 770 + i * 105;
      withAlpha(p, () => scaled(SX + 30, y + 40, lerp(.6, 1, eBack(p)), () => {
        ctx.beginPath(); ctx.arc(SX + 66, y + 40, 30, 0, 7); ctx.fillStyle = col; ctx.fill();
        ctx.font = `500 29px ${F}`; const bw = ctx.measureText(s).width + 50;
        rr(SX + 112, y, bw, 80, 24); ctx.fillStyle = '#182533'; ctx.fill();
        text(s, SX + 137, y + 50, 29, '#e9eef3', 500);
      }));
    });
    // post statistics sheet
    const sp = eOut(prog(t, 5.7, 6.2));
    if (sp > 0) {
      ctx.fillStyle = `rgba(0,0,0,${.5 * sp})`; ctx.fillRect(SX, SY, SW, SH);
      const sy = lerp(SY + SH, SY + 290, sp);
      rr(SX, sy, SW, SH, 44); ctx.fillStyle = '#17212b'; ctx.fill();
      rr(SX + SW / 2 - 50, sy + 18, 100, 8, 4); ctx.fillStyle = '#3a4a5c'; ctx.fill();
      text('Post statistikasi', SX + 40, sy + 90, 36, '#fff', 800);
      let y = sy + 160, k = 0;
      for (const [sec, rows] of STATS) {
        text(sec.toUpperCase(), SX + 40, y, 22, '#7f91a4', 700);
        y += 26;
        for (const [label, val, col] of rows) {
          const bp = eOut(prog(t, 6.1 + k * .2, 6.9 + k * .2));
          text(label, SX + 40, y + 34, 28, '#e9eef3', 600);
          text(`${Math.round(val * bp)}%`, SX + SW - 40, y + 34, 28, col, 800, 'right');
          rr(SX + 40, y + 50, SW - 80, 12, 6); ctx.fillStyle = '#243444'; ctx.fill();
          if (bp > 0) { rr(SX + 40, y + 50, Math.max(12, (SW - 80) * val / 100 * bp), 12, 6); ctx.fillStyle = col; ctx.fill(); }
          if (label === 'Fargʻona vodiysi' && t > 8.6) {
            const a = .5 + .5 * Math.sin(t * 8);
            rr(SX + 24, y - 6, SW - 48, 80, 16); ctx.lineWidth = 4; ctx.strokeStyle = `rgba(22,199,132,${a})`; ctx.stroke();
          }
          y += 74; k++;
        }
        y += 22;
      }
    }
    ctx.fillStyle = `rgba(255,40,60,${.14 * stress})`; ctx.fillRect(SX, SY, SW, SH);
  });

  errorBadges(t, ERRORS);
}

// ---------- SCENE 2 — Yechim ----------
// Filter screen layout (screen coordinates), shared by drawing and the cursor path.
function chipRow(labels, x0, y, size = 28) {
  ctx.font = `700 ${size}px ${F}`;
  let x = x0;
  return labels.map(s => { const w = ctx.measureText(s).width + 92; const r = { s, x, y, w, h: 64, cx: x + w / 2, cy: y + 32 }; x += w + 14; return r; });
}
function layout() {
  const region = chipRow(['Fargʻona', 'Margʻilon', 'Qoʻqon'], SX + 40, SY + 235)
    .concat(chipRow(['Andijon', 'Namangan'], SX + 40, SY + 313));
  const segW = (SW - 80) / 3, seg = { x: SX + 40, y: SY + 450, w: SW - 80, h: 72, segW };
  const slider = { x: SX + 70, y: SY + 625, w: SW - 140 };
  const interests = chipRow(['Moda', 'Kiyim-kechak', 'Goʻzallik'], SX + 40, SY + 725);
  const button = { x: SX + 40, y: SY + SH - 150, w: SW - 80, h: 100 };
  return { region, seg, slider, interests, button };
}
const AGE_MIN = 14, AGE_MAX = 65;
const ageX = (s, a) => s.x + s.w * (a - AGE_MIN) / (AGE_MAX - AGE_MIN);
const TAPS = { f: 11.9, m: 12.3, q: 12.7, seg: 13.1, dragA: 13.5, dragB: 14.2, moda: 14.55, kiyim: 14.95, list: 15.3, order: 17.6 };
// Matching channels left after each filter step.
const COUNT_STEPS = [[0, 214], [TAPS.f, 168], [TAPS.m, 131], [TAPS.q, 97], [TAPS.seg, 54], [TAPS.dragB - .3, 31], [TAPS.moda, 18], [TAPS.kiyim, 12]];
function channelCount(t) {
  let v = COUNT_STEPS[0][1];
  for (let i = 1; i < COUNT_STEPS.length; i++) v = lerp(v, COUNT_STEPS[i][1], eOut(prog(t, COUNT_STEPS[i][0], COUNT_STEPS[i][0] + .35)));
  return Math.round(v);
}
function chip(c, on) {
  rr(c.x, c.y, c.w, c.h, 32);
  ctx.fillStyle = on > .5 ? '#16c784' : '#fff'; ctx.fill();
  if (on <= .5) { ctx.lineWidth = 3; ctx.strokeStyle = '#dbe3e0'; ctx.stroke(); }
  if (on > .5) check(c.x + 34, c.cy, 20, '#fff', 5, prog(on, .5, 1));
  text(c.s, c.x + (on > .5 ? 58 : 46), c.cy + 10, 28, on > .5 ? '#fff' : '#334155', 700);
}
const RESULTS = [
  { name: 'Ayollar Klubi · Fargʻona', init: 'AK', col: '#ec4899', match: 94 },
  { name: 'Margʻilon Moda', init: 'MM', col: '#3b82f6', match: 91 },
  { name: 'Qoʻqon Ayollari', init: 'QA', col: '#a855f7', match: 87 },
];
function filterScreen(t, L) {
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Kimga reklama beramiz?', SX + 50, SY + 112, 38, '#fff', 800);
  text('HUDUD', SX + 40, SY + 215, 22, C.grey, 800);
  const regionOn = [TAPS.f, TAPS.m, TAPS.q];
  L.region.forEach((c, i) => chip(c, i < 3 ? prog(t, regionOn[i], regionOn[i] + .3) : 0));
  text('JINS', SX + 40, SY + 430, 22, C.grey, 800);
  const s = L.seg;
  rr(s.x, s.y, s.w, s.h, 36); ctx.fillStyle = '#e8eeec'; ctx.fill();
  const sp = eInOut(prog(t, TAPS.seg, TAPS.seg + .3));
  rr(s.x + 6 + s.segW * sp, s.y + 6, s.segW - 12, s.h - 12, 30); ctx.fillStyle = '#16c784'; ctx.fill();
  ['Hammasi', 'Ayollar', 'Erkaklar'].forEach((l, i) => {
    const active = (i === 0 && sp < .5) || (i === 1 && sp >= .5);
    text(l, s.x + s.segW * i + s.segW / 2, s.y + 46, 28, active ? '#fff' : '#334155', 700, 'center');
  });
  // age range slider
  const dp = eInOut(prog(t, TAPS.dragA, TAPS.dragB));
  const lo = Math.round(lerp(18, 20, dp)), hi = Math.round(lerp(65, 40, dp));
  text('YOSH', SX + 40, SY + 575, 22, C.grey, 800);
  text(`${lo}–${hi} yosh`, SX + SW - 40, SY + 577, 28, C.ink, 800, 'right');
  const sl = L.slider, xl = ageX(sl, lerp(18, 20, dp)), xh = ageX(sl, lerp(65, 40, dp));
  rr(sl.x, sl.y - 6, sl.w, 12, 6); ctx.fillStyle = '#e2e8f0'; ctx.fill();
  rr(xl, sl.y - 6, xh - xl, 12, 6); ctx.fillStyle = '#16c784'; ctx.fill();
  for (const x of [xl, xh]) {
    ctx.beginPath(); ctx.arc(x, sl.y, 24, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#16c784'; ctx.stroke();
  }
  text('QIZIQISH', SX + 40, SY + 705, 22, C.grey, 800);
  L.interests.forEach((c, i) => chip(c, i < 2 ? prog(t, [TAPS.moda, TAPS.kiyim][i], [TAPS.moda, TAPS.kiyim][i] + .3) : 0));
  // matching channels counter + button
  const n = channelCount(t);
  const flash = Math.max(...COUNT_STEPS.slice(1).map(([at]) => bump(t, at, .5)));
  rr(SX + 40, SY + 860, SW - 80, 170, 28); ctx.fillStyle = '#ecfdf5'; ctx.fill();
  text('Mos kanallar', SX + 80, SY + 935, 30, '#065f46', 700);
  text('Fargʻona vodiysi · ayollar · 20–40', SX + 80, SY + 980, 23, '#059669', 500);
  scaled(SX + SW - 110, SY + 945, 1 + .15 * flash, () => text(String(n), SX + SW - 80, SY + 970, 76, '#059669', 900, 'right'));
  const b = L.button, press = bump(t, TAPS.list);
  scaled(b.x + b.w / 2, b.y + b.h / 2, 1 - .05 * press, () => {
    rr(b.x, b.y, b.w, b.h, 50); ctx.fillStyle = '#0ea371'; ctx.fill();
    text(`${n} ta kanalni koʻrish  →`, b.x + b.w / 2, b.y + b.h / 2 + 2, 34, '#fff', 800, 'center', 'middle');
  });
}
function resultsScreen(t, L) {
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Eng mos kanallar', SX + 50, SY + 112, 38, '#fff', 800);
  // top match card with gauge
  const x = SX + 40, y = SY + 185, w = SW - 80, h = 500, top = RESULTS[0];
  ctx.save(); ctx.shadowColor = 'rgba(15,23,42,.12)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  rr(x, y, w, h, 30); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
  const sel = prog(t, 17.5, 17.8);
  rr(x, y, w, h, 30); ctx.lineWidth = 4 + 3 * sel; ctx.strokeStyle = '#16c784'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x + 70, y + 72, 42, 0, 7); ctx.fillStyle = top.col; ctx.fill();
  text(top.init, x + 70, y + 74, 30, '#fff', 800, 'center', 'middle');
  text(top.name, x + 130, y + 66, 31, C.ink, 800);
  text('34 ming obunachi · ERR 29%', x + 130, y + 106, 24, C.grey, 600);
  const gp = eOut(prog(t, 15.7, 16.8)), gx = x + 140, gy = y + 300;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(gx, gy, 100, 0, 7); ctx.lineWidth = 22; ctx.strokeStyle = '#e2e8f0'; ctx.stroke();
  ctx.beginPath(); ctx.arc(gx, gy, 100, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * .94 * gp); ctx.strokeStyle = '#16c784'; ctx.stroke();
  text(`${Math.round(94 * gp)}%`, gx, gy + 6, 52, C.ink, 900, 'center', 'middle');
  text('moslik', gx, gy + 50, 22, C.grey, 600, 'center', 'middle');
  [['Fargʻona vodiysi', 88], ['Ayollar', 91], ['20–40 yosh', 76]].forEach(([l, v], i) => {
    const bp = eOut(prog(t, 15.9 + i * .2, 16.9 + i * .2)), bx = x + 290, by = y + 200 + i * 80, bw = w - 330;
    text(l, bx, by, 24, '#334155', 600);
    text(`${Math.round(v * bp)}%`, bx + bw, by, 24, '#059669', 800, 'right');
    rr(bx, by + 16, bw, 12, 6); ctx.fillStyle = '#e2e8f0'; ctx.fill();
    if (bp > 0) { rr(bx, by + 16, Math.max(12, bw * v / 100 * bp), 12, 6); ctx.fillStyle = '#16c784'; ctx.fill(); }
  });
  text('290 000 soʻm', x + 40, y + h - 40, 32, '#059669', 900);
  text('~9 500 koʻrish', x + w - 40, y + h - 40, 26, C.grey, 600, 'right');
  RESULTS.slice(1).forEach((c, i) => {
    const p = eOut(prog(t, 16.2 + i * .25, 16.8 + i * .25));
    if (p <= 0) return;
    const cx = x + lerp(SW, 0, p), cy = y + h + 24 + i * 120;
    rr(cx, cy, w, 104, 24); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 56, cy + 52, 32, 0, 7); ctx.fillStyle = c.col; ctx.fill();
    text(c.init, cx + 56, cy + 54, 24, '#fff', 800, 'center', 'middle');
    text(c.name, cx + 104, cy + 62, 29, C.ink, 800);
    text(`${c.match}%`, cx + w - 30, cy + 62, 30, '#059669', 900, 'right');
  });
  const bp = eBack(prog(t, 16.8, 17.2)), b = L.button;
  if (bp > 0) {
    const press = bump(t, TAPS.order);
    scaled(b.x + b.w / 2, b.y + b.h / 2, bp * (1 - .05 * press), () => {
      rr(b.x, b.y, b.w, b.h, 50); ctx.fillStyle = '#0ea371'; ctx.fill();
      text('Buyurtma berish  →', b.x + b.w / 2, b.y + b.h / 2 + 2, 36, '#fff', 800, 'center', 'middle');
    });
  }
  // confirmation sheet
  const mp = eOut(prog(t, 18.1, 18.6));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const cp = eBack(prog(t, 18.4, 18.9));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * cp, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (cp > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, 18.7, 19.1));
    withAlpha(prog(t, 18.9, 19.3), () => {
      text('Reklama aniq manzilga yetadi!', SX + SW / 2, sy + 300, 40, C.ink, 800, 'center');
      ['88% oʻquvchi — Fargʻona vodiysida', '91% oʻquvchi — ayollar', 'Natijani real vaqtda kuzatasiz'].forEach((s, i) =>
        withAlpha(prog(t, 19.3 + i * .35, 19.6 + i * .35), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  solutionBg(t, 'Aniq maqsadli qidiruv');

  const L = layout();
  const enter = eOut(prog(t, 11.3, 12)), slide = eInOut(prog(t, TAPS.list + .1, TAPS.list + .6));
  phone('#f4f7f6', 0, lerp(200, 0, enter), 0, () => {
    if (slide < 1) { ctx.save(); ctx.translate(-SW * slide, 0); filterScreen(t, L); ctx.restore(); }
    if (slide > 0) { ctx.save(); ctx.translate(SW * (1 - slide), 0); ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH); resultsScreen(t, L); ctx.restore(); }
  });

  // finger cursor: taps the filters, drags the age slider, then orders
  const R = L.region, I = L.interests, s = L.seg, sl = L.slider, b = L.button;
  const segX = s.x + s.segW * 1.5, hiStart = ageX(sl, 65), hiEnd = ageX(sl, 40);
  const keys = [
    [11.4, W - 40, 1560], [TAPS.f, R[0].cx, R[0].cy], [TAPS.m, R[1].cx, R[1].cy], [TAPS.q, R[2].cx, R[2].cy],
    [TAPS.seg, segX, s.y + 36], [TAPS.dragA, hiStart, sl.y], [TAPS.dragB, hiEnd, sl.y],
    [TAPS.moda, I[0].cx, I[0].cy], [TAPS.kiyim, I[1].cx, I[1].cy], [TAPS.list, b.x + b.w / 2 + 60, b.y + 50],
  ];
  if (t > 11.4 && t < 15.7) {
    const [cx, cy] = pathAt(t, keys);
    const press = Math.max(...[TAPS.f, TAPS.m, TAPS.q, TAPS.seg, TAPS.moda, TAPS.kiyim, TAPS.list].map(at => bump(t, at, .2)),
      t > TAPS.dragA && t < TAPS.dragB ? 1 : 0);
    withAlpha(Math.min(prog(t, 11.4, 11.6), 1 - prog(t, 15.45, 15.7)), () => cursor(cx, cy, press));
  }
  for (const [at, x, y] of keys.slice(1)) if (at !== TAPS.dragB) ripple(x, y, prog(t, at, at + .6), '#16c784');
  if (t > 16.9 && t < 18.2) {
    const a = eInOut(prog(t, 16.9, 17.5)), cx = lerp(W - 60, b.x + b.w / 2 + 40, a), cy = lerp(1560, b.y + 50, a);
    withAlpha(Math.min(prog(t, 16.9, 17.1), 1 - prog(t, 17.95, 18.2)), () => cursor(cx, cy, bump(t, TAPS.order, .25)));
  }
  ripple(b.x + b.w / 2 + 40, b.y + 50, prog(t, TAPS.order + .05, TAPS.order + .7), '#ffffff');
}

// ---------- SCENE 3 — Natija ----------
// Viewers now landing in the bullseye (callback to scene 1).
const HITS = (() => {
  const r = rnd(5);
  return Array.from({ length: 36 }, (_, i) => {
    const a = r() * Math.PI * 2, d = r() * 70;
    return { at: 22.7 + i * .05, x0: r() * W, x: W / 2 + Math.cos(a) * d, y: 650 + Math.sin(a) * d };
  });
})();
function scene3(t) {
  resultBg(t);
  const out = eInOut(prog(t, 26.6, 27.3));
  withAlpha(1 - out, () => {
    withAlpha(prog(t, 22.2, 22.7), () => {
      text('NATIJA', W / 2, 190, 34, C.gold, 800, 'center');
      text('Toʻgʻri auditoriya', W / 2, 260, 60, '#fff', 800, 'center');
    });
    // bullseye
    const tp = eBack(prog(t, 22.3, 22.8));
    scaled(W / 2, 650, tp, () => {
      [[260, 'rgba(255,255,255,.18)'], [195, 'rgba(255,255,255,.28)'], [130, '#ffffff'], [70, C.gold]].forEach(([rad, col]) => {
        ctx.beginPath(); ctx.arc(W / 2, 650, rad, 0, 7); ctx.fillStyle = col; ctx.fill();
      });
    });
    for (const d of HITS) {
      const p = prog(t, d.at, d.at + .45);
      if (p <= 0) continue;
      const e = eOut(p), x = lerp(d.x0, d.x, e), y = lerp(-30, d.y, e);
      ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fillStyle = C.green; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    }
    // before / after card
    const cp = eOut(prog(t, 22.9, 23.5));
    const x = 90, y = lerp(1060, 990, cp), w = 900, h = 440;
    withAlpha(cp, () => {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
      rr(x, y, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
      const c1 = x + 470, c2 = x + 750;
      text('Oldin', c1, y + 70, 28, C.grey, 700, 'center');
      rr(c2 - 120, y + 34, 240, 52, 26); ctx.fillStyle = '#d1fae5'; ctx.fill();
      text('ADUZ bilan', c2, y + 70, 28, '#065f46', 800, 'center');
      const np = eOut(prog(t, 23.3, 25.0)), clients = Math.max(1, Math.round(64 * np));
      const rows = [
        ['Koʻrishlar', '38 000', fmt(9500 * np), C.ink, C.ink],
        ['Mijozlar', '2', String(clients), C.red, '#059669'],
        ['1 mijoz narxi', '600 000', fmt(Math.round(290000 / clients / 100) * 100), C.red, '#059669'],
      ];
      rows.forEach(([l, a, b2, ca, cb], i) => {
        const ry = y + 160 + i * 100;
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + 40, ry - 62, w - 80, 2);
        text(l, x + 50, ry, 32, '#334155', 700);
        text(a, c1, ry, 40, ca, 800, 'center');
        text(b2, c2, ry, 44, cb, 900, 'center');
      });
      text('soʻm', x + 50, y + 400, 22, C.grey, 500);
    });
    const pp = eBack(prog(t, 25.0, 25.4));
    if (pp > 0) scaled(W / 2, 1515, pp, () => {
      ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
      rr(W / 2 - 280, 1465, 560, 100, 50);
      const gg = ctx.createLinearGradient(W / 2 - 280, 0, W / 2 + 280, 0);
      gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
      text('×32 koʻp mijoz', W / 2, 1517, 48, C.ink, 900, 'center', 'middle');
    });
  });
  confetti(t, 24.9);
  endCard(t, 27.0);
}

boot({ scene1, scene2, scene3, captions: CAPTIONS });
