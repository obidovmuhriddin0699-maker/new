<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// ADUZ — 10-qism: "Matching algoritmi ishda" (7-qism uslubida)
// Problem: the channel is picked on a fortune wheel. The wheel physics (linear deceleration) is shared with
// audio.py (WHEEL_* in CUES_10) so every peg tick in the sound lands on the frame where a peg passes the pointer.
// Solution: a scan line scores every channel, the list re-sorts, the top match opens as a radar chart.

const CAPTIONS = [
  [0.4, 4.8, 'Yuzlab kanal — qaysi biri sizning mijozingizga mos? Hech kim bilmaydi.'],
  [5.0, 9.4, 'Shuning uchun tanlov taxminga, omadga qoladi...'],
  [9.6, 10.5, '...natija: 12% moslik.'],
  [11.4, 16.2, 'ADUZʼning Matching algoritmi har bir kanalni auditoriyangiz bilan solishtiradi.'],
  [16.4, 21.6, 'Eng mos kanallar tepada — har biri uchun aniq moslik foizi.'],
  [22.4, 27.0, 'Taxmin emas — hisob. Natija ham shunga yarasha.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];

function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'target') { for (const r of [24, 14]) { ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke(); } ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill(); }
  else if (kind === 'chart') { [[-18, 8], [-2, 18], [14, 28]].forEach(([dx, h]) => { rr(dx - 6, 18 - h, 12, h, 3); ctx.fill(); }); }
  else if (kind === 'bolt') { ctx.beginPath(); ctx.moveTo(6, -30); ctx.lineTo(-16, 4); ctx.lineTo(0, 4); ctx.lineTo(-6, 30); ctx.lineTo(16, -6); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill(); }
  else if (kind === 'dice') { rr(-24, -24, 48, 48, 10); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.45)'; for (const [dx, dy] of [[-11, -11], [0, 0], [11, 11]]) { ctx.beginPath(); ctx.arc(dx, dy, 5, 0, 7); ctx.fill(); } }
  ctx.restore();
}
const CH = [
  ['Toshkent Memlar', 'TM', '#e11d48', '128 ming', 12], ['Ayollar Klubi', 'AK', '#ec4899', '34 ming', 94], ['Sport Vodiy', 'SV', '#16c784', '52 ming', 23],
  ['Margʻilon Moda', 'MM', '#3b82f6', '19 ming', 91], ['Kino Olami', 'KO', '#a855f7', '88 ming', 31], ['Qoʻqon Ayollari', 'QA', '#f59e0b', '22 ming', 88],
  ['IT Yangiliklar', 'IT', '#06b6d4', '41 ming', 18], ['Fargʻona Style', 'FS', '#84cc16', '48 ming', 76],
];
const scoreCol = v => v >= 75 ? '#16c784' : v >= 50 ? '#f59e0b' : '#ef4444';

// ---------- SCENE 1 — Muammo: the fortune wheel ----------
const SEG = ['Toshkent Memlar', 'Avto Bozor', 'Ayollar Klubi', 'Taomlar', 'Sport Vodiy', 'Biznes UZ', 'Kino Olami', 'Talaba', 'IT Yangiliklar', 'Margʻilon Moda', 'Qoʻqon Ayollari', 'Fargʻona Style'];
const SEG_COLS = ['#e11d48', '#334155', '#ec4899', '#475569', '#16c784', '#334155', '#a855f7', '#475569', '#06b6d4', '#3b82f6', '#f59e0b', '#84cc16'];
const WHEEL_T0 = 5.0, WHEEL_T = 4.5, LAND = 0;               // shared with audio.py
const WHEEL_FINAL = -Math.PI / 2 - (LAND + .5) * Math.PI / 6 + 2 * Math.PI * 6;
const WHEEL_W0 = 2 * WHEEL_FINAL / WHEEL_T;
function wheelAngle(t) { const s = clamp(t - WHEEL_T0, 0, WHEEL_T); return WHEEL_W0 * (s - s * s / (2 * WHEEL_T)); }
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46], [9.5, 10]];
const RANDOM_BTN = { x: SX + 40, y: SY + SH - 150, w: SW - 80, h: 100 };
function catalog(t) {
  ctx.fillStyle = '#0e1621'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150);
  text('Kanallar katalogi', SX + 50, SY + 96, 38, '#fff', 800);
  text('120+ kanal · auditoriya maʼlumoti yoʻq', SX + 50, SY + 132, 23, '#7f91a4', 500);
  CH.forEach(([n, i, c, subs], k) => {
    const p = eOut(prog(t, .6 + k * .12, 1.0 + k * .12)); if (p <= 0) return;
    const y = SY + 170 + k * 100;
    withAlpha(p, () => {
      ctx.beginPath(); ctx.arc(SX + 76, y + 46, 34, 0, 7); ctx.fillStyle = c; ctx.fill(); text(i, SX + 76, y + 48, 22, '#fff', 800, 'center', 'middle');
      text(n, SX + 130, y + 40, 29, '#fff', 700); text(`${subs} obunachi`, SX + 130, y + 76, 22, '#7f91a4', 500);
      text('moslik: ?', SX + SW - 40, y + 56, 24, '#ff8a96', 800, 'right');
      ctx.fillStyle = '#17212b'; ctx.fillRect(SX + 130, y + 96, SW - 160, 2);
    });
  });
  const bp = eBack(prog(t, 3.4, 3.8));
  if (bp > 0) scaled(RANDOM_BTN.x + RANDOM_BTN.w / 2, RANDOM_BTN.y + 50, bp * (1 - .05 * bump(t, 4.3, .25)), () => {
    rr(RANDOM_BTN.x, RANDOM_BTN.y, RANDOM_BTN.w, RANDOM_BTN.h, 50); ctx.fillStyle = '#7c3aed'; ctx.fill();
    glyph('dice', RANDOM_BTN.x + 110, RANDOM_BTN.y + 50, .8);
    text('Tasodifiy tanlash', RANDOM_BTN.x + RANDOM_BTN.w / 2 + 30, RANDOM_BTN.y + 63, 36, '#fff', 900, 'center');
  });
}
function wheel(t) {
  const ap = eBack(prog(t, 4.5, 4.95)); if (ap <= 0) return;
  const cx = W / 2, cy = 940, R = 420, th = wheelAngle(t);
  scaled(cx, cy, ap, () => {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 60;
    ctx.beginPath(); ctx.arc(cx, cy, R + 26, 0, 7); ctx.fillStyle = '#1f2937'; ctx.fill(); ctx.restore();
    SEG.forEach((name, i) => {
      const a0 = th + i * Math.PI / 6, a1 = a0 + Math.PI / 6;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
      const landed = t > WHEEL_T0 + WHEEL_T + .05 && i === LAND;
      ctx.fillStyle = landed ? (Math.floor(t * 6) % 2 ? '#ff4d5e' : '#b91c1c') : SEG_COLS[i]; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = '#111827'; ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + Math.PI / 12);
      text(name, R - 30, 9, 25, '#fff', 800, 'right'); ctx.restore();
    });
    for (let i = 0; i < 12; i++) { const a = th + i * Math.PI / 6; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (R + 12), cy + Math.sin(a) * (R + 12), 9, 0, 7); ctx.fillStyle = '#fbbf24'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx, cy, 70, 0, 7); ctx.fillStyle = '#111827'; ctx.fill();
    glyph('dice', cx, cy, 1.2, '#fbbf24');
    // pointer at the top, flicks back on every peg
    const pegs = Math.floor(th / (Math.PI / 6)), frac = th / (Math.PI / 6) - pegs, flick = t < WHEEL_T0 + WHEEL_T ? Math.max(0, 1 - frac * 3) * .35 : 0;
    ctx.save(); ctx.translate(cx, cy - R - 30); ctx.rotate(-flick);
    ctx.beginPath(); ctx.moveTo(-34, -40); ctx.lineTo(34, -40); ctx.lineTo(0, 46); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = '#111827'; ctx.stroke(); ctx.restore();
  });
  // verdict in the silence
  const vp = eBack(prog(t, 9.75, 10.05));
  if (vp > 0) scaled(W / 2, 1460, vp, () => {
    rr(W / 2 - 300, 1405, 600, 110, 55); ctx.fillStyle = '#b91c1c'; ctx.fill();
    text('Moslik: 12%', W / 2, 1478, 52, '#fff', 900, 'center');
  });
}
function scene1(t) {
  const stress = prog(t, 5, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr, sx, sy, () => {
    episodeTitle(t, '10-QISM', 'Matching algoritmi', 60);
    counters(t, [['120+', 'kanal', '#fff'], ['?', 'moslik', C.red], ['0', 'maʼlumot', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#0e1621', 0, lerp(160, 0, enter), 0, () => catalog(t));
    const wd = prog(t, 4.4, 4.9);
    if (wd > 0) withAlpha(wd * .65, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
    wheel(t);
    // indecisive cursor hovering between channels, then the dice button
    const rows = k => [SX + SW - 160, SY + 216 + k * 100];
    const keys = [[1.2, W - 40, 1600], [1.7, ...rows(1)], [2.1, ...rows(4)], [2.5, ...rows(2)], [2.9, ...rows(6)], [3.3, ...rows(3)], [4.3, RANDOM_BTN.x + RANDOM_BTN.w / 2 + 160, RANDOM_BTN.y + 50]];
    if (t > 1.2 && t < 4.6) {
      const [cx, cy] = pathAt(t, keys);
      withAlpha(Math.min(prog(t, 1.2, 1.4), 1 - prog(t, 4.4, 4.6)), () => { cursor(cx, cy, bump(t, 4.3, .22)); if (t < 3.9) text('?', cx + 34, cy - 30, 44, '#fff', 900, 'center'); });
    }
    slam(t, 5.6, 'TAXMIN?', 250, 520, 56, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
    slam(t, 6.6, 'OMAD?', 850, 680, 56, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
    slam(t, 7.6, 'TAVAKKAL!', 300, 1520, 56, '#fff', { slab: C.red, rot: .05, hold: .9 });
  });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .45, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 103, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, '50 / 50', W / 2, 880, 220, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'omadga ishonib reklama', W / 2, 1060, 52, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
}

// ---------- SCENE 2 — Yechim: scan, score, sort, radar ----------
const T10 = { list: 11.7, scan: [12.2, 13.8], sort: 14.1, medal: 14.8, pick: 15.6, sheet: 15.8, radar: [16.0, 16.8], choose: 17.6, chosen: 17.85, slam: 18.5, done: 19.7 };
const IMPACTS2 = [[11.0, 26], [T10.choose, 8], [T10.slam, 34]];
const SORTED = [...CH.keys()].sort((a, b) => CH[b][4] - CH[a][4]);
const LTOP = SY + 262, LROW = 100;
const scanAt = k => T10.scan[0] + (k + .5) / CH.length * (T10.scan[1] - T10.scan[0]);
const rankOf = (k, t) => lerp(k, SORTED.indexOf(k), eInOut(prog(t, T10.sort, T10.sort + .6)));
const AXES = [['Hudud', 96], ['Yosh', 92], ['Jins', 97], ['Qiziqish', 94], ['Faollik', 91]];
const CHOOSE = { x: SX + 40, y: SY + SH - 150, w: SW - 80, h: 100 };
function matchScreen(t) {
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Matching', SX + 50, SY + 112, 42, '#fff', 900);
  ctx.fillStyle = '#ecfdf5'; ctx.fillRect(SX, SY + 150, SW, 100);
  text('Auditoriyangiz:', SX + 40, SY + 212, 23, '#065f46', 800);
  let cx = SX + 230;
  ['Fargʻona', 'Ayollar 20–40', 'Moda'].forEach(s => { ctx.font = `800 22px ${F}`; const w = ctx.measureText(s).width + 32; rr(cx, SY + 180, w, 44, 22); ctx.fillStyle = '#16c784'; ctx.fill(); text(s, cx + w / 2, SY + 209, 22, '#fff', 800, 'center'); cx += w + 10; });
  ctx.save(); ctx.beginPath(); ctx.rect(SX, LTOP - 10, SW, CH.length * LROW + 20); ctx.clip();
  CH.forEach(([n, i, c, subs, score], k) => {
    const p = eOut(prog(t, T10.list + k * .06, T10.list + .35 + k * .06)); if (p <= 0) return;
    const y = LTOP + rankOf(k, t) * LROW, sc = prog(t, scanAt(k), scanAt(k) + .35), v = Math.round(score * eOut(sc));
    const medal = SORTED.indexOf(k) < 3 && t > T10.medal + SORTED.indexOf(k) * .12, top = SORTED.indexOf(k) === 0 && t > T10.pick;
    withAlpha(p, () => {
      rr(SX + 20, y + 4, SW - 40, LROW - 10, 20); ctx.fillStyle = top ? '#fff7db' : '#fff'; ctx.fill();
      if (top) { rr(SX + 20, y + 4, SW - 40, LROW - 10, 20); ctx.lineWidth = 4; ctx.strokeStyle = C.gold; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(SX + 76, y + 50, 32, 0, 7); ctx.fillStyle = c; ctx.fill(); text(i, SX + 76, y + 52, 21, '#fff', 800, 'center', 'middle');
      text(n, SX + 126, y + 44, 27, C.ink, 800); text(`${subs} obunachi`, SX + 126, y + 78, 21, C.grey, 600);
      const rx = SX + SW - 80, ry = y + 50;
      ctx.beginPath(); ctx.arc(rx, ry, 32, 0, 7); ctx.lineWidth = 8; ctx.strokeStyle = '#eef2f1'; ctx.stroke();
      if (sc > 0) { ctx.beginPath(); ctx.arc(rx, ry, 32, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * v / 100); ctx.strokeStyle = scoreCol(score); ctx.lineCap = 'round'; ctx.stroke(); }
      text(sc > 0 ? `${v}` : '—', rx, ry + 9, 24, sc > 0 ? scoreCol(score) : '#94a3b8', 900, 'center');
      if (medal) { const mp = eBack(prog(t, T10.medal + SORTED.indexOf(k) * .12, T10.medal + .3 + SORTED.indexOf(k) * .12));
        scaled(SX + 46, y + 22, mp, () => { ctx.beginPath(); ctx.arc(SX + 46, y + 22, 18, 0, 7); ctx.fillStyle = ['#fbbf24', '#cbd5e1', '#d97706'][SORTED.indexOf(k)]; ctx.fill(); text(String(SORTED.indexOf(k) + 1), SX + 46, y + 23, 20, C.ink, 900, 'center', 'middle'); }); }
    });
  });
  // scan beam
  const sp = prog(t, T10.scan[0], T10.scan[1]);
  if (sp > 0 && sp < 1) {
    const y = LTOP + sp * CH.length * LROW;
    const g = ctx.createLinearGradient(0, y - 60, 0, y); g.addColorStop(0, 'rgba(22,199,132,0)'); g.addColorStop(1, 'rgba(22,199,132,.35)');
    ctx.fillStyle = g; ctx.fillRect(SX, y - 60, SW, 60); ctx.fillStyle = '#16c784'; ctx.fillRect(SX, y, SW, 4);
  }
  ctx.restore();
  // detail sheet with radar chart
  const dp = eOut(prog(t, T10.sheet, T10.sheet + .45));
  if (dp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.45 * dp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + 260, dp);
    rr(SX, sy, SW, SH, 44); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(SX + 80, sy + 75, 34, 0, 7); ctx.fillStyle = '#ec4899'; ctx.fill(); text('AK', SX + 80, sy + 77, 22, '#fff', 800, 'center', 'middle');
    text('Ayollar Klubi', SX + 130, sy + 70, 32, C.ink, 900); text('Nega mos?', SX + 130, sy + 106, 23, C.grey, 700);
    rr(SX + SW - 200, sy + 46, 160, 60, 30); ctx.fillStyle = '#16c784'; ctx.fill(); text('94%', SX + SW - 120, sy + 88, 34, '#fff', 900, 'center');
    const rcx = SX + SW / 2, rcy = sy + 390, R = 200, gp = eOut(prog(t, T10.radar[0], T10.radar[1]));
    const pt = (i, v) => { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; return [rcx + Math.cos(a) * R * v, rcy + Math.sin(a) * R * v]; };
    for (const lv of [.25, .5, .75, 1]) { ctx.beginPath(); for (let i = 0; i <= 5; i++) { const [x, y] = pt(i % 5, lv); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke(); }
    for (let i = 0; i < 5; i++) { const [x, y] = pt(i, 1); ctx.beginPath(); ctx.moveTo(rcx, rcy); ctx.lineTo(x, y); ctx.stroke(); }
    // target (dashed) vs channel (filled)
    ctx.setLineDash([10, 8]); ctx.beginPath(); for (let i = 0; i <= 5; i++) { const [x, y] = pt(i % 5, 1); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); AXES.forEach(([, v], i) => { const [x, y] = pt(i, v / 100 * gp); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
    ctx.fillStyle = 'rgba(22,199,132,.35)'; ctx.fill(); ctx.strokeStyle = '#16c784'; ctx.lineWidth = 5; ctx.stroke();
    AXES.forEach(([l, v], i) => { const [x, y] = pt(i, 1.22); text(l, x, y, 24, C.ink, 800, 'center'); text(`${Math.round(v * gp)}%`, x, y + 28, 22, '#059669', 900, 'center'); });
    text('— — sizning auditoriyangiz', SX + 60, sy + 690, 22, C.ink, 700); text('■ kanal auditoriyasi', SX + 420, sy + 690, 22, '#059669', 800);
    const chosen = t > T10.chosen;
    scaled(CHOOSE.x + CHOOSE.w / 2, CHOOSE.y + 50, 1 - .05 * bump(t, T10.choose, .25), () => {
      rr(CHOOSE.x, CHOOSE.y, CHOOSE.w, CHOOSE.h, 50); ctx.fillStyle = chosen ? '#065f46' : '#0ea371'; ctx.fill();
      if (chosen) check(CHOOSE.x + 200, CHOOSE.y + 50, 30, '#fff', 8, prog(t, T10.chosen, T10.chosen + .3));
      text(chosen ? 'Tanlandi' : 'Tanlash', CHOOSE.x + CHOOSE.w / 2 + (chosen ? 30 : 0), CHOOSE.y + 63, 38, '#fff', 900, 'center');
    });
  }
  const mp = eOut(prog(t, T10.done, T10.done + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T10.done + .2, T10.done + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T10.done + .45, T10.done + .8));
    withAlpha(prog(t, T10.done + .6, T10.done + .9), () => {
      text('Eng mos kanallar tanlandi!', SX + SW / 2, sy + 300, 42, C.ink, 800, 'center');
      ['Har bir kanal uchun moslik foizi', 'Hudud, yosh, jins, qiziqish, faollik', 'Eng mos kanallar doim tepada'].forEach((s, i) =>
        withAlpha(prog(t, T10.done + .9 + i * .25, T10.done + 1.15 + i * .25), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Matching Score');
    const enter = eBack(prog(t, 11.1, 11.75));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => matchScreen(t))));
    const top = [SX + SW / 2, LTOP + 50], ch = [CHOOSE.x + CHOOSE.w / 2 + 120, CHOOSE.y + 50];
    if (t > 15.0 && t < 17.95) {
      const [cx, cy] = pathAt(t, [[15.0, W - 40, 1600], [T10.pick, ...top], [16.9, ...top], [T10.choose, ...ch]]);
      withAlpha(Math.min(prog(t, 15.0, 15.2), 1 - prog(t, 17.7, 17.95)), () => cursor(cx, cy, Math.max(bump(t, T10.pick, .22), bump(t, T10.choose, .22))));
    }
    ripple(top[0], top[1], prog(t, T10.pick, T10.pick + .6), C.gold);
    ripple(ch[0], ch[1], prog(t, T10.choose, T10.choose + .6), '#ffffff');
  });
  const dim = prog(t, T10.slam - .05, T10.slam + .1) * (1 - prog(t, T10.done - .2, T10.done));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T10.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T10.slam, W / 2, 880, 105, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T10.slam, '94% MOSLIK', W / 2, 840, 170, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T10.slam + .15, 'taxmin emas — hisob', W / 2, 1030, 66, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T10.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Gʻildirak: omadga', 'Matching Score'], ['Moslik: 12%', 'Moslik: 94%'], ['6 ta mijoz', '41 ta mijoz'], ['Pul havoga', 'Har soʻm hisobda']];
const IMPACTS3 = [[22.15, 22], [25.0, 16]];
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    glyph(kind, bx, by, 1.5);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
function scene3(t) {

  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {

      const cp = eOut(prog(t, 22.3, 22.9)), x = 90, y = lerp(410, 340, cp), w = 900, h = 640;

        rr(x + 470, y + 44, 260, 52, 26); ctx.fillStyle = '#d1fae5'; ctx.fill();
        text('ADUZ Matching', x + 600, y + 80, 28, '#065f46', 900, 'center');
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + w / 2 - 20, y + 120, 2, h - 160);
        CMP.forEach(([a, b], i) => {
          const ry = y + 190 + i * 115, st = eInOut(prog(t, 22.8 + i * .35, 23.1 + i * .35)), ok = eBack(prog(t, 23.0 + i * .35, 23.3 + i * .35));
          text(a, x + 60, ry, 30, st > 0 ? '#94a3b8' : '#334155', 700);
          if (st > 0) { ctx.font = `700 30px ${F}`; const tw = ctx.measureText(a).width; ctx.beginPath(); ctx.moveTo(x + 55, ry - 10); ctx.lineTo(x + 55 + (tw + 10) * st, ry - 10); ctx.lineWidth = 5; ctx.strokeStyle = C.red; ctx.stroke(); }
          if (ok > 0) scaled(x + 470, ry - 10, ok, () => {
            ctx.beginPath(); ctx.arc(x + 490, ry - 10, 20, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill(); check(x + 490, ry - 9, 18, '#fff', 5);
            text(b, x + 525, ry, 30, '#059669', 900);
          });
        });
      });
      [['Aniq', 'target'], ['Hisob-kitob', 'chart'], ['Tez', 'bolt']].forEach(([l, k], i) => {
        const p = eBack(prog(t, 25.2 + i * .25, 25.65 + i * .25));
        if (p > 0) badge(230 + i * 310, 1200, l, k, p);
      });
    });
  });
  shockwave(t, 25.0, W / 2, 800, C.gold, 900);
  sparks(t, 25.0, W - 200, 820, 107, [C.gold, '#fff', '#22e39a'], 34, 1100);

  endCard(t, 27.0);
}
