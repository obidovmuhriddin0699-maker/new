<script>
// ADUZ — 22-qism: "Jalb qiluvchi kontent" (7-qism uslubi + FX v2 + kinetik matn presetlari; ovoz — sfx/ kutubxonasi)
// Problem: a wall of plain grey text in a fast feed — every reader flicks past it, the dwell time shrinks, CTR 0.1%.
// At the vacuum the letters of the boring post fall off one by one. Transition: zoom through. Solution: ADUZ ad
// builder — a template gallery, a live preview animated with kinetic-text presets (bounce, letter-up, typewriter,
// flicker), one tap to switch the animation, one tap for brand colour, send to channels; in the feed the thumb stops
// on it. Sound: CUES_22 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Uzun, zerikarli matn — lenta tez aylanadi, hech kim toʻxtamaydi.'],
  [4.6, 9.4, 'Har safar — oʻtib ketishadi. Diqqat bir soniyaga ham yetmaydi.'],
  [9.6, 10.4, '...harflar ham qochib ketdi.'],
  [11.4, 16.2, 'ADUZ konstruktori: tayyor shablon, jonli animatsiya — bir bosishda.'],
  [16.4, 21.6, 'Endi lenta aylanadi — va aynan sizning reklamangizda toʻxtaydi.'],
  [22.4, 27.0, 'Jalb qiluvchi kontent — koʻz toʻxtaydigan reklama.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'grid') { for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { rr(-24 + i * 26, -24 + j * 26, 22, 22, 5); ctx.fill(); } }
  else if (kind === 'spark') { for (let k = 0; k < 4; k++) { ctx.save(); ctx.rotate(k * Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, -28); ctx.quadraticCurveTo(4, -4, 28, 0); ctx.quadraticCurveTo(4, 4, 0, 28); ctx.quadraticCurveTo(-4, 4, -28, 0); ctx.quadraticCurveTo(-4, -4, 0, -28); ctx.fill(); ctx.restore(); } }
  else if (kind === 'wand') { ctx.beginPath(); ctx.moveTo(-22, 22); ctx.lineTo(14, -14); ctx.stroke(); [[18, -26], [26, -12], [6, -24]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 4, 0, 7); ctx.fill(); }); }
  else if (kind === 'eye') { ctx.beginPath(); ctx.moveTo(-28, 0); ctx.quadraticCurveTo(0, -24, 28, 0); ctx.quadraticCurveTo(0, 24, -28, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill(); }
  ctx.restore();
}
const BORING = ['Assalomu alaykum hurmatli mijozlar!', 'Bizning doʻkonimizda turli xil', 'kiyimlar mavjud. Narxlar arzon,', 'sifat yaxshi. Manzil: Fargʻona sh.,', 'Mustaqillik koʻchasi 12-uy.', 'Tel: +998 90 123 45 67. Ish vaqti', '9:00 dan 20:00 gacha. Kelinglar!'];
function boringPost(x, y, w, s = 1) {
  rr(x, y, w, 430 * s, 22 * s); ctx.fillStyle = '#182533'; ctx.fill();
  ctx.beginPath(); ctx.arc(x + 50 * s, y + 50 * s, 26 * s, 0, 7); ctx.fillStyle = '#64748b'; ctx.fill();
  text('Vodiy Textile', x + 90 * s, y + 58 * s, 26 * s, '#e9eef3', 700);
  BORING.forEach((l, i) => text(l, x + 30 * s, y + 120 * s + i * 42 * s, 25 * s, '#9fb3c8', 500));
  text('👁 3 240', x + 30 * s, y + 410 * s, 20 * s, '#64748b', 600);
}
// a vivid template card with kinetic text; `t0` restarts the animation, `pal` = [c1, c2]
function promoCard(t, x, y, w, h, t0, preset, pal, s = 1) {
  ctx.save(); rr(x, y, w, h, 26 * s); ctx.clip();
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  for (let k = 0; k < 6; k++) { const a = t * .6 + k; ctx.beginPath(); ctx.arc(x + w * (.15 + .14 * k), y + h * (.25 + .5 * ((k * 37) % 10) / 10) + Math.sin(a) * 10 * s, (6 + k * 2) * s, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill(); }
  kText(t, t0, '−30%', x + w / 2, y + h * .3, 120 * s, '#fff', preset === 'flicker' ? 'flicker' : 'bounce', { glow: 'rgba(0,0,0,.25)' });
  kText(t, t0 + .3, 'YANGI KOLLEKSIYA', x + w / 2, y + h * .52, 40 * s, '#fff', preset === 'flicker' ? 'flicker' : 'letterUp');
  kText(t, t0 + .6, 'Faqat 3 kun!', x + w / 2, y + h * .66, 34 * s, '#fef3c7', 'typewriter', { weight: 700, stagger: .04 });
  const bp = eBack(prog(t, t0 + .9, t0 + 1.2)), pulse = 1 + .04 * Math.sin(t * 6) * (t > t0 + 1.2);
  if (bp > 0) scaled(x + w / 2, y + h * .83, bp * pulse, () => { rr(x + w / 2 - 150 * s, y + h * .83 - 34 * s, 300 * s, 68 * s, 34 * s); ctx.fillStyle = '#fff'; ctx.fill(); text('Buyurtma berish', x + w / 2, y + h * .83 + 10 * s, 28 * s, pal[1], 900, 'center'); });
  ctx.restore();
}

// ---------- SCENE 1 — Muammo: scrolled past ----------
const FEED = ['other', 'ours', 'other', 'other', 'ours', 'other', 'other', 'ours', 'other', 'other'];
const ITEM_H = { ours: 450, other: 330 };
const FEED_Y = (() => { let y = 0; return FEED.map(k => { const v = y; y += ITEM_H[k] + 20; return v; }); })();
const PAUSE = [[1.3, 2.8], [4.3, 4.9], [6.4, 6.75]];   // dwell windows on "ours" (1st, 2nd, 3rd impression)
const FLICK = [2.8, 4.9, 6.75];
const TOP = SY + 200, CENTER_OF = i => FEED_Y[i] + ITEM_H[FEED[i]] / 2 - (SH - 260) / 2 + 60;
const SCROLL = [[0, 0], [.6, 0], [1.3, CENTER_OF(1)], [2.8, CENTER_OF(1)], [3.25, CENTER_OF(4) - 500], [4.3, CENTER_OF(4)], [4.9, CENTER_OF(4)], [5.3, CENTER_OF(7) - 500], [6.4, CENTER_OF(7)], [6.75, CENTER_OF(7)], [7.2, CENTER_OF(9)], [9.4, CENTER_OF(9) + 60]];
const curve = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], eInOut(clamp((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])))); return keys[keys.length - 1][1]; };
const DROP = [9.55, 10.35];
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const OTHER = [['#6366f1', 'Mem kanal'], ['#14b8a6', 'Futbol yangiliklari'], ['#f97316', 'Retsept: palov'], ['#ec4899', 'Telefon sharhi'], ['#84cc16', 'Ob-havo']];
function feedScreen(t) {
  ctx.fillStyle = '#0e1621'; ctx.fillRect(SX, SY, SW, SH);
  const sc = curve(t, SCROLL), v = Math.abs(curve(t + .02, SCROLL) - sc) / .02;
  ctx.save(); ctx.beginPath(); ctx.rect(SX, SY + 150, SW, SH - 150); ctx.clip();
  FEED.forEach((k, i) => {
    const y = TOP + FEED_Y[i] - sc; if (y > SY + SH || y + ITEM_H[k] < SY + 150) return;
    if (k === 'ours') boringPost(SX + 30, y, SW - 60);
    else { const [c, nm] = OTHER[i % OTHER.length]; rr(SX + 30, y, SW - 60, ITEM_H[k], 22); ctx.fillStyle = '#182533'; ctx.fill();
      rr(SX + 50, y + 20, SW - 100, ITEM_H[k] - 100, 16); ctx.fillStyle = c; ctx.globalAlpha = .7; ctx.fill(); ctx.globalAlpha = 1; text(nm, SX + 55, y + ITEM_H[k] - 40, 24, '#e9eef3', 700); }
  });
  // motion blur streaks while flicking
  if (v > 1200) withAlpha(clamp((v - 1200) / 3000) * .6, () => { for (let k = 0; k < 14; k++) { const x = SX + 40 + (k * 53) % (SW - 80); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x, SY + 150 + (k * 97 + t * 3000) % (SH - 150), 3, 120); } });
  ctx.restore();
  ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150);
  text('Lenta', SX + 40, SY + 100, 38, '#fff', 800);
  // dwell chip during each pause
  PAUSE.forEach(([a, b], i) => { const p = prog(t, a, a + .2) * (1 - prog(t, b, b + .15)); if (p <= 0) return;
    const dwell = Math.min(b - a, t - a); withAlpha(p, () => { rr(SX + SW - 300, SY + 90, 260, 46, 23); ctx.fillStyle = 'rgba(239,68,68,.2)'; ctx.fill(); glyph('eye', SX + SW - 265, SY + 113, .55, '#fca5a5'); text(`Diqqat: ${dwell.toFixed(1)} s`, SX + SW - 160, SY + 122, 22, '#fca5a5', 800, 'center'); }); });
}
function scene1(t) {
  const stress = prog(t, 4.6, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera((1 + .06 * eInOut(prog(t, 0, 10.6))) * punch(t, FLICK, .03), sr, sx, sy, () => {
    kText(t, .15, '22-QISM', W / 2, 105, 30, C.red, 'charsDown', { weight: 800 });
    kText(t, .3, 'Jalb qiluvchi kontent', W / 2, 165, 56, '#fff', 'blurUp', { weight: 800 });
    const imp = FLICK.filter(a => t > a).length;
    counters(t, [[fmt(3240 + imp * 1200), 'koʻrish', '#fff'], ['4', 'bosish', C.red], ['0.1%', 'CTR', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#0e1621', 0, lerp(160, 0, enter), 0, () => { feedScreen(t); ctx.fillStyle = `rgba(255,40,60,${.05 * stress})`; ctx.fillRect(SX, SY, SW, SH); });
    // the flicking thumb
    FLICK.forEach(a => { const p = prog(t, a - .15, a + .3); if (p <= 0 || p >= 1) return; withAlpha(Math.sin(Math.PI * p), () => cursor(W / 2 + 120, lerp(1350, 800, eInOut(p)), .3)); });
  });
  slam(t, 5.6, 'ZERIKARLI', 300, 560, 54, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
  slam(t, 6.6, 'UZUN MATN', 790, 830, 52, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
  slam(t, 7.6, 'OʻTIB KETILDI', 330, 1440, 48, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 307, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'KOʻRINMAS', W / 2, 880, 150, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'matn bor — eʼtibor yoʻq', W / 2, 1040, 54, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  // vacuum: the boring post alone; its letters fall off one by one
  if (t > 9.5) {
    ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H);
    const s = 1.25, w = 900, x = (W - w) / 2, y = 900 - 430 * s / 2, p = prog(t, ...DROP);
    rr(x, y, w, 430 * s, 26); ctx.fillStyle = '#182533'; ctx.fill();
    ctx.font = `500 ${25 * s}px ${F}`; const r = rnd(311);
    BORING.forEach((l, i) => { let cx = x + 30 * s; for (const ch of l) { const cw = ctx.measureText(ch).width, delay = r() * .75, q = clamp((p - delay) / .35);
      const yy = y + 120 * s + i * 42 * s + 1400 * q * q; if (yy < H + 50) { ctx.save(); ctx.translate(cx + cw / 2, yy); ctx.rotate(q * (r() - .5) * 6); ctx.globalAlpha = 1 - q * .6; text(ch, -cw / 2, 0, 25 * s, '#9fb3c8', 500); ctx.restore(); } else r(); cx += cw; } });
  }
}

// ---------- SCENE 2 — Yechim: the ad builder ----------
const T22 = { pick: 12.1, edit: [12.25, 12.6], anim: 12.7, flick: 14.0, color: 14.5, send: 15.2, feed: [15.45, 15.8], stop: 16.6, stats: 16.9, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T22.stop, 12], [T22.slam, 34]];
const TPL = [['−30%', ['#ec4899', '#f59e0b']], ['YANGI', ['#3b82f6', '#06b6d4']], ['1+1', ['#f97316', '#ef4444']], ['STORY', ['#8b5cf6', '#ec4899']]];
const PRESETS = ['Bounce', 'Flicker', 'Typewriter', 'Blur'];
const SWATCH = [['#ec4899', '#f59e0b'], ['#0ea371', '#06b6d4'], ['#3b82f6', '#8b5cf6'], ['#f97316', '#ef4444'], ['#111827', '#374151']];
const SEND = { x: SX + 40, y: SY + SH - 112, w: SW - 80, h: 86 };
const card = i => ({ x: SX + 30 + (i % 2) * 353, y: SY + 190 + Math.floor(i / 2) * 290, w: 323, h: 270 });
function galleryScreen(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Shablonlar', SX + 50, SY + 108, 40, '#fff', 900); glyph('grid', SX + SW - 80, SY + 92, .9, 'rgba(255,255,255,.9)');
  TPL.forEach(([lab, pal], i) => { const c = card(i), p = eBack(prog(t, 11.4 + i * .1, 11.75 + i * .1)); if (p <= 0) return;
    scaled(c.x + c.w / 2, c.y + c.h / 2, p * (1 + .05 * bump(t, T22.pick, .2) * (i === 0)), () => {
      ctx.save(); rr(c.x, c.y, c.w, c.h, 22); ctx.clip(); const g = ctx.createLinearGradient(c.x, c.y, c.x + c.w, c.y + c.h); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]); ctx.fillStyle = g; ctx.fillRect(c.x, c.y, c.w, c.h); ctx.restore();
      kText(t, 11.6 + i * .1 + Math.floor(Math.max(0, t - 11.6) / 1.6) * 1.6, lab, c.x + c.w / 2, c.y + c.h / 2 - 10, 64, '#fff', ['bounce', 'letterUp', 'scale', 'flicker'][i]);
      shine(c.x, c.y, c.w, c.h, prog(t, 11.8 + i * .12, 12.3 + i * .12), 22);
    }); });
  text('Animatsiyali shablonlar · 120+', SX + SW / 2, SY + 800, 24, C.grey, 700, 'center');
}
function editorScreen(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Konstruktor', SX + 50, SY + 108, 40, '#fff', 900); glyph('wand', SX + SW - 80, SY + 92, 1, 'rgba(255,255,255,.9)');
  const cp = eInOut(prog(t, T22.color, T22.color + .4)), pal = [0, 1].map(k => lerpColor(SWATCH[0][k], SWATCH[1][k], cp));
  const preset = t > T22.flick ? 'flicker' : 'bounce', t0 = t > T22.flick ? T22.flick + .05 : T22.anim;
  promoCard(t, SX + 30, SY + 175, SW - 60, 520, t0, preset, pal);
  text('Animatsiya', SX + 40, SY + 745, 22, C.grey, 800);
  PRESETS.forEach((nm, i) => { const on = (i === 1 && t > T22.flick) || (i === 0 && t <= T22.flick), x = SX + 40 + i * 168;
    scaled(x + 78, SY + 790, 1 + .07 * bump(t, T22.flick, .2) * (i === 1), () => { rr(x, SY + 762, 156, 56, 28); ctx.fillStyle = on ? '#0ea371' : '#fff'; ctx.fill(); text(nm, x + 78, SY + 798, 23, on ? '#fff' : '#334155', 800, 'center'); }); });
  text('Brend rangi', SX + 40, SY + 860, 22, C.grey, 800);
  SWATCH.forEach((pl, i) => { const x = SX + 70 + i * 100, on = (i === 1 && t > T22.color) || (i === 0 && t <= T22.color);
    scaled(x, SY + 915, 1 + .12 * bump(t, T22.color, .2) * (i === 1), () => { ctx.beginPath(); ctx.arc(x, SY + 915, 30, 0, 7); const g = ctx.createLinearGradient(x - 30, 0, x + 30, 0); g.addColorStop(0, pl[0]); g.addColorStop(1, pl[1]); ctx.fillStyle = g; ctx.fill(); if (on) { ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.stroke(); } }); });
  scaled(SEND.x + SEND.w / 2, SEND.y + 43, 1 - .05 * bump(t, T22.send, .22), () => { rr(SEND.x, SEND.y, SEND.w, SEND.h, 43); ctx.fillStyle = t > T22.send ? '#065f46' : '#0ea371'; ctx.fill(); text(t > T22.send ? 'Yuborildi ✓' : 'Kanallarga yuborish', SEND.x + SEND.w / 2, SEND.y + 55, 32, '#fff', 900, 'center'); shine(SEND.x, SEND.y, SEND.w, SEND.h, prog(t, T22.send, T22.send + .5), 43); });
}
function lerpColor(a, b, k) { const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16)); return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], k))).join(',')})`; }
function newFeedScreen(t) {
  ctx.fillStyle = '#0e1621'; ctx.fillRect(SX, SY, SW, SH);
  const sc = curve(t, [[0, -900], [T22.feed[0], -900], [T22.stop, 0], [99, 0]]);
  ctx.save(); ctx.beginPath(); ctx.rect(SX, SY + 150, SW, SH - 150); ctx.clip();
  [[-700, 'other', 1], [-350, 'other', 3]].forEach(([oy, , k]) => { const y = SY + 200 + oy - sc; const [c, nm] = OTHER[k]; rr(SX + 30, y, SW - 60, 330, 22); ctx.fillStyle = '#182533'; ctx.fill(); rr(SX + 50, y + 20, SW - 100, 230, 16); ctx.fillStyle = c; ctx.globalAlpha = .7; ctx.fill(); ctx.globalAlpha = 1; text(nm, SX + 55, y + 290, 24, '#e9eef3', 700); });
  const y = SY + 220 - sc;
  promoCard(t, SX + 30, y, SW - 60, 520, T22.feed[0] + .1, 'bounce', SWATCH[1]);
  ctx.restore();
  ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150); text('Lenta', SX + 40, SY + 100, 38, '#fff', 800);
  const sp = eBack(prog(t, T22.stop, T22.stop + .35));
  if (sp > 0) scaled(SX + SW - 170, SY + 113, sp, () => { rr(SX + SW - 300, SY + 90, 260, 46, 23); ctx.fillStyle = 'rgba(34,227,154,.25)'; ctx.fill(); glyph('eye', SX + SW - 265, SY + 113, .55, '#6ee7b7'); text('Koʻz toʻxtadi', SX + SW - 160, SY + 122, 22, '#6ee7b7', 800, 'center'); });
  const st = eOut(prog(t, T22.stats, T22.stats + .4));
  if (st > 0) withAlpha(st, () => {
    rr(SX + 30, SY + 790, SW - 60, 220, 22); ctx.fillStyle = '#ecfdf5'; ctx.fill();
    const k = eOut(prog(t, T22.stats, T22.stats + 1.4));
    [['Diqqat', `${(2.8 * k).toFixed(1)} s`], ['Bosish', fmt(184 * k)], ['CTR', `${(3.8 * k).toFixed(1)}%`]].forEach(([l, v], i) => { text(l, SX + 70 + i * 230, SY + 850, 22, '#059669', 800); text(v, SX + 70 + i * 230, SY + 920, 50, '#065f46', 900); });
    text('Oldingi post: 0.1%', SX + 70, SY + 980, 22, '#94a3b8', 700);
    shine(SX + 30, SY + 790, SW - 60, 220, prog(t, T22.stats + .4, T22.stats + 1.0), 22);
  });
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera((1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8))) * punch(t, [T22.pick, T22.anim, T22.flick, T22.color, T22.send, T22.stop], .025), sr, sx, sy, () => {
    solutionBg(t, 'Reklama konstruktori');
    const enter = eBack(prog(t, 11.1, 11.75)), s1 = eInOut(prog(t, ...T22.edit)), s2 = eInOut(prog(t, ...T22.feed));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => {
        if (s1 < 1) { ctx.save(); ctx.translate(-SW * s1, 0); galleryScreen(t); ctx.restore(); }
        if (s1 > 0 && s2 < 1) { ctx.save(); ctx.translate(SW * (1 - s1) - SW * s2, 0); editorScreen(t); ctx.restore(); }
        if (s2 > 0) { ctx.save(); ctx.translate(SW * (1 - s2), 0); newFeedScreen(t); ctx.restore(); }
      })));
    const c0 = card(0), taps = [[T22.pick, c0.x + c0.w / 2, c0.y + c0.h / 2], [T22.flick, SX + 40 + 168 + 78, SY + 790], [T22.color, SX + 170, SY + 915], [T22.send, SEND.x + SEND.w / 2 + 150, SEND.y + 43]];
    if (t > 11.7 && t < 15.5) {
      const [cx, cy] = pathAt(t, [[11.7, W - 40, 1650], taps[0], [12.8, W - 40, 1600], [13.6, W - 40, 1600], taps[1], taps[2], taps[3], [15.5, W - 40, 1700]]);
      withAlpha(Math.min(prog(t, 11.7, 11.9), 1 - prog(t, 15.3, 15.5)), () => cursor(cx, cy, Math.max(...taps.map(([a]) => bump(t, a, .22)))));
    }
    for (const [a, x, y] of taps) ripple(x, y, prog(t, a, a + .6), '#ffffff');
    sparks(t, T22.stop, SX + SW / 2, SY + 400, 313, ['#22e39a', '#ffffff', C.gold], 26, 520);
  });
