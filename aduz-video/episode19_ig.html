<script>
// ADUZ — 19-qism: "Mikro-kanallar kuchi" (7-qism uslubida; ovoz — foydalanuvchi SFX kutubxonasi, sfx/)
// Problem: the catalogue is sorted by subscribers — one giant channel takes the whole budget (4 000 000) and returns
// 190 reactions (0.6%), while dozens of small, lively channels sit dim around it. At the vacuum the giant bubble
// deflates; the small dots light up and link into a network, which dissolves into the solution (pixelDissolve).
// Solution: ADUZ "Mikro-tarmoq" — two filters keep the active small channels, one tap posts to all of them, a
// light wave runs through the network and reactions climb. Sound: CUES_19 in audio.py.

const CAPTIONS = [
  [0.4, 4.4, 'Hamma faqat katta kanalga intiladi — kichiklar eʼtibordan chetda.'],
  [4.6, 9.4, 'Butun byudjet bitta gigantga — reaksiya esa deyarli yoʻq.'],
  [9.6, 10.4, '...havosi chiqdi.'],
  [11.4, 16.2, 'ADUZʼda faol mikro-kanallar tarmogʻini tanlaysiz — bir bosishda.'],
  [16.4, 21.6, 'Xuddi shu byudjet — yuz barobar koʻp reaksiya.'],
  [22.4, 27.0, 'Kichik kanallar — katta kuch.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];
function glyph(kind, x, y, s = 1, col = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'nodes') { const P = [[-20, -14], [16, -20], [22, 14], [-14, 20], [0, 0]]; ctx.beginPath(); [[0, 4], [1, 4], [2, 4], [3, 4], [0, 1], [2, 3]].forEach(([a, b]) => { ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); }); ctx.stroke(); P.forEach(([x0, y0], i) => { ctx.beginPath(); ctx.arc(x0, y0, i === 4 ? 8 : 6, 0, 7); ctx.fill(); }); }
  else if (kind === 'heart') { ctx.beginPath(); ctx.moveTo(0, 22); ctx.bezierCurveTo(-30, 2, -24, -24, 0, -10); ctx.bezierCurveTo(24, -24, 30, 2, 0, 22); ctx.fill(); }
  else if (kind === 'coin') { ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.stroke(); text('S', 0, 2, 26, col, 900, 'center', 'middle'); }
  ctx.restore();
}

// ---------- SCENE 1 — Muammo: one giant, many ignored ----------
const GIANT = { x: SX + SW / 2, y: SY + 455, r: 190 };
const TINY = (() => { const r = rnd(219), out = []; let tries = 0;
  while (out.length < 34 && tries++ < 3000) { const x = SX + 40 + r() * (SW - 80), y = SY + 200 + r() * 520, rad = 12 + r() * 20;
    if (Math.hypot(x - GIANT.x, y - GIANT.y) < GIANT.r + rad + 40) continue; if (out.some(o => Math.hypot(o.x - x, o.y - y) < o.r + rad + 8)) continue;
    out.push({ x, y, r: rad, ph: r() * 6, eng: (6 + r() * 8).toFixed(0), k: (2 + r() * 12).toFixed(1) }); }
  return out; })();
const PICK1 = 1.6, PAY1 = 2.6, DEFLATE = 9.5, NET = [10.15, 10.55];
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
const PAYB = { x: SX + 40, y: SY + 790, w: SW - 80, h: 84 };
function catalogScreen(t) {
  ctx.fillStyle = '#111827'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#1f2937'; ctx.fillRect(SX, SY, SW, 150);
  text('Kanal tanlash', SX + 40, SY + 92, 38, '#fff', 800);
  text('Saralash: obunachilar ↓', SX + 40, SY + 132, 24, '#9ca3af', 600);
  // tiny channels — dim, ignored; a hint of their engagement flickers
  for (const c of TINY) {
    const dimk = .35 - .2 * prog(t, 4.6, 9.0);
    withAlpha(dimk, () => { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fillStyle = '#4b5563'; ctx.fill(); });
    const fl = Math.max(0, Math.sin(t * 1.7 + c.ph * 3)) ** 8;
    if (fl > .05 && t > 3.5) withAlpha(fl * .8, () => text(`${c.eng}%`, c.x, c.y + 5, 15, '#86efac', 800, 'center'));
  }
  // the giant
  const sel = t > PICK1, gr = GIANT.r * (1 + .06 * eBack(prog(t, PICK1, PICK1 + .3)));
  ctx.save(); ctx.shadowColor = 'rgba(96,165,250,.6)'; ctx.shadowBlur = 60;
  ctx.beginPath(); ctx.arc(GIANT.x, GIANT.y, gr, 0, 7); const g = ctx.createRadialGradient(GIANT.x - 60, GIANT.y - 60, 20, GIANT.x, GIANT.y, gr); g.addColorStop(0, '#60a5fa'); g.addColorStop(1, '#1e3a8a'); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  if (sel) { ctx.beginPath(); ctx.arc(GIANT.x, GIANT.y, gr + 10, 0, 7); ctx.lineWidth = 6; ctx.strokeStyle = '#fbbf24'; ctx.stroke(); }
  text('Mega UZ', GIANT.x, GIANT.y - 20, 44, '#fff', 900, 'center');
  text('250 000 obunachi', GIANT.x, GIANT.y + 26, 26, '#dbeafe', 700, 'center');
  text('4 000 000 soʻm', GIANT.x, GIANT.y + 66, 26, '#fde68a', 800, 'center');
  // pay + result panel
  const paid = t > PAY1;
  if (sel) scaled(PAYB.x + PAYB.w / 2, PAYB.y + 42, 1 - .05 * bump(t, PAY1, .22), () => {
    rr(PAYB.x, PAYB.y, PAYB.w, PAYB.h, 42); ctx.fillStyle = paid ? '#374151' : '#2563eb'; ctx.fill();
    text(paid ? 'Toʻlandi · butun byudjet' : 'Butun byudjetni berish', PAYB.x + PAYB.w / 2, PAYB.y + 54, 30, paid ? '#d1d5db' : '#fff', 800, 'center');
  });
  if (paid) {
    const p = eOut(prog(t, 3.0, 8.0)), y = SY + 900;
    rr(SX + 30, y, SW - 60, 200, 24); ctx.fillStyle = '#1f2937'; ctx.fill();
    [['Koʻrish', fmt(31000 * p), '#fff'], ['Reaksiya', fmt(190 * p), '#f87171'], ['Faollik', '0.6%', '#f87171']].forEach(([l, v, c], i) => {
      text(l, SX + 70 + i * 225, y + 55, 22, '#9ca3af', 700); text(v, SX + 70 + i * 225, y + 110, 40, c, 900); });
    withAlpha(prog(t, 6.0, 6.3), () => text('1 reaksiya ≈ 21 000 soʻm', SX + 70, y + 168, 26, '#f87171', 800));
  }
}
function scene1(t) {
  const stress = prog(t, 4.6, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera(1 + .06 * eInOut(prog(t, 0, 10.6)), sr, sx, sy, () => {
    episodeTitle(t, '19-QISM', 'Mikro-kanallar kuchi', 56);
    counters(t, [['4 000 000', 'byudjet', '#fff'], ['1 ta', 'kanal', C.red], [t > 3.0 ? '0.6%' : '—', 'faollik', C.red]]);
    const enter = eOut(prog(t, 0, .7));
    phone('#111827', 0, lerp(160, 0, enter), 0, () => { catalogScreen(t); ctx.fillStyle = `rgba(255,40,60,${.05 * stress})`; ctx.fillRect(SX, SY, SW, SH); });
    if (t > .8 && t < 3.0) {
      const [cx, cy] = pathAt(t, [[.8, W - 60, 1700], [PICK1, GIANT.x + 60, GIANT.y + 40], [PAY1, PAYB.x + PAYB.w / 2 + 150, PAYB.y + 42], [3.0, W - 60, 1750]]);
      withAlpha(Math.min(prog(t, .8, 1.0), 1 - prog(t, 2.8, 3.0)), () => cursor(cx, cy, Math.max(bump(t, PICK1, .2), bump(t, PAY1, .2))));
    }
  });
  slam(t, 5.6, 'FAQAT GIGANT', 310, 560, 48, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
  slam(t, 6.6, 'QIMMAT', 800, 830, 56, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
  slam(t, 7.6, 'FAOLLIK 0.6%', 330, 1440, 50, '#fff', { slab: C.red, rot: .05, hold: .9 });
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 9.25, 9.45));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 223, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, 'BITTA GIGANT', W / 2, 880, 130, '#fff', { hold: .75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.7, 'qimmat — lekin jonsiz', W / 2, 1040, 54, '#ffb4bc', { hold: .55 });
  flash(t, 8.5, C.red, .4, .45);
  // vacuum: the giant deflates; then the small dots light up and link into a network
  if (t > DEFLATE) {
    withAlpha(.85 * prog(t, DEFLATE, DEFLATE + .12), () => { ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, W, H); });
    const d = prog(t, DEFLATE + .05, 10.1), r = lerp(300, 0, eIn(d)), wob = Math.sin(t * 50) * 18 * (1 - d);
    if (r > 1) { ctx.beginPath(); ctx.ellipse(W / 2 + wob, 900, r + wob, r - wob, Math.sin(t * 9) * .3, 0, 7); ctx.fillStyle = '#334155'; ctx.fill(); }
    const np = prog(t, ...NET);
    if (np > 0) {
      const S = W / SW;
      const pts = TINY.map(c => [(c.x - SX) * S, (c.y - SY - 140) * S * 1.3 + 40]);
      ctx.lineWidth = 3;
      pts.forEach(([x, y], i) => { const on = prog(t, NET[0] + i / pts.length * .3, NET[0] + i / pts.length * .3 + .1); if (on <= 0) return;
        const j = (i * 7 + 3) % pts.length; withAlpha(on * .5, () => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(...pts[j]); ctx.strokeStyle = '#22e39a'; ctx.stroke(); });
        ctx.save(); ctx.shadowColor = '#22e39a'; ctx.shadowBlur = 30 * on; ctx.beginPath(); ctx.arc(x, y, TINY[i].r * .9 * on, 0, 7); ctx.fillStyle = '#22e39a'; ctx.fill(); ctx.restore(); });
    }
  }
}

// ---------- SCENE 2 — Yechim: the micro-network ----------
const T19 = { chip: [11.9, 12.4], sum: 12.8, post: 14.0, wave: [14.2, 15.4], react: [14.4, 17.0], x100: 16.6, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T19.post, 10], [T19.slam, 34]];
const NODES = (() => { const r = rnd(229), out = []; let tries = 0;
  const kinds = [...Array(25).fill('good'), ...Array(10).fill('low'), ...Array(5).fill('big')];
  while (out.length < 40 && tries++ < 5000) {
    const kind = kinds[out.length], subs = kind === 'big' ? 22 + r() * 18 : 4 + r() * 9, rad = 10 + subs * .9;
    const x = SX + 50 + r() * (SW - 100), y = SY + 290 + r() * 440;
    if (out.some(o => Math.hypot(o.x - x, o.y - y) < o.r + rad + 10)) continue;
    out.push({ x, y, r: rad, subs, eng: kind === 'good' ? 8 + r() * 5 : kind === 'low' ? 1.5 + r() * 3 : 1 + r() * 2.5, kind }); }
  const s = out.reduce((a, o) => [o.x + a[0], o.y + a[1]], [0, 0]); const c0 = out.filter(o => o.kind === 'good').sort((a, b) => Math.hypot(a.x - s[0] / out.length, a.y - s[1] / out.length) - Math.hypot(b.x - s[0] / out.length, b.y - s[1] / out.length))[0];
  const md = Math.max(...out.map(o => Math.hypot(o.x - c0.x, o.y - c0.y)));
  out.forEach(o => { o.d = Math.hypot(o.x - c0.x, o.y - c0.y) / md; o.nb = out.map((p, j) => [Math.hypot(p.x - o.x, p.y - o.y), j]).sort((a, b) => a[0] - b[0]).slice(1, 3).map(q => q[1]); });
  return out; })();
const GOOD = NODES.filter(o => o.kind === 'good');
const SUM_SUBS = Math.round(GOOD.reduce((a, o) => a + o.subs, 0)) * 1000, AVG_ENG = GOOD.reduce((a, o) => a + o.eng, 0) / GOOD.length;
const REACT = 19700;
const CHIPS = [['2k–15k obunachi', SX + 30, 280], ['Faollik > 8%', SX + 330, 240]];
const POST = { x: SX + 40, y: SY + SH - 112, w: SW - 80, h: 86 };
function netScreen(t) {
  ctx.fillStyle = '#f4f7f6'; ctx.fillRect(SX, SY, SW, SH);
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Mikro-tarmoq', SX + 50, SY + 108, 40, '#fff', 900);
  glyph('nodes', SX + SW - 80, SY + 92, 1, 'rgba(255,255,255,.9)');
  CHIPS.forEach(([s, x, w], k) => { const on = t > T19.chip[k];
    scaled(x + w / 2, SY + 205, 1 + .06 * bump(t, T19.chip[k], .2), () => { rr(x, SY + 175, w, 60, 30); ctx.fillStyle = on ? '#0ea371' : '#fff'; ctx.fill(); if (!on) { ctx.lineWidth = 3; ctx.strokeStyle = '#cbd5e1'; ctx.stroke(); }
      if (on) check(x + 32, SY + 206, 13, '#fff', 4); text(s, x + (on ? 54 : 26), SY + 214, 24, on ? '#fff' : '#334155', 800); }); });
  // network
  const f1 = prog(t, T19.chip[0], T19.chip[0] + .3), f2 = prog(t, T19.chip[1], T19.chip[1] + .3);
  const vis = o => (o.kind === 'big' ? 1 - f1 : 1) * (o.kind === 'low' ? 1 - f2 * .85 : 1);
  ctx.lineWidth = 2;
  NODES.forEach((o, i) => { const a = Math.min(vis(o), prog(t, 11.3 + i * .015, 11.6 + i * .015)); if (a <= 0) return;
    o.nb.forEach(j => { const p = NODES[j]; withAlpha(Math.min(a, vis(p)) * .35, () => { ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(p.x, p.y); ctx.strokeStyle = o.kind === 'good' && p.kind === 'good' && t > T19.wave[0] + o.d * 1.2 ? '#10b981' : '#94a3b8'; ctx.stroke(); }); }); });
  NODES.forEach((o, i) => {
    const a = Math.min(vis(o), prog(t, 11.3 + i * .015, 11.6 + i * .015)); if (a <= .02) return;
    const lit = o.kind === 'good' ? prog(t, T19.wave[0] + o.d * 1.2, T19.wave[0] + o.d * 1.2 + .25) : 0;
    withAlpha(a, () => {
      if (lit > 0 && lit < 1) { ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 30 * lit, 0, 7); ctx.lineWidth = 4 * (1 - lit); ctx.strokeStyle = '#22e39a'; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r * (1 + .2 * bump(t, T19.wave[0] + o.d * 1.2, .25) * (o.kind === 'good')), 0, 7);
      ctx.fillStyle = lit > 0 ? '#10b981' : o.kind === 'good' ? '#a7f3d0' : o.kind === 'big' ? '#93c5fd' : '#cbd5e1'; ctx.fill();
      if (o.r > 18) text(`${o.eng.toFixed(0)}%`, o.x, o.y + 6, 15, lit > 0 ? '#fff' : '#065f46', 800, 'center');
    });
  });
  // summary + reactions
  const sp = eOut(prog(t, T19.sum, T19.sum + .4));
  if (sp > 0) withAlpha(sp, () => {
    rr(SX + 30, SY + 770, SW - 60, 110, 22); ctx.fillStyle = '#fff'; ctx.fill();
    text(`${GOOD.length} kanal · ${fmt(SUM_SUBS * eOut(prog(t, T19.sum, T19.sum + .8)))} obunachi`, SX + 60, SY + 815, 28, C.ink, 900);
    text(`Oʻrtacha faollik ${AVG_ENG.toFixed(1)}% · byudjet oʻsha: 4 000 000`, SX + 60, SY + 857, 22, '#059669', 800);
  });
  if (t > T19.post) {
    const rp = eOut(prog(t, ...T19.react)), y = SY + 895;
    rr(SX + 30, y, SW - 60, 112, 22); ctx.fillStyle = '#ecfdf5'; ctx.fill();
    glyph('heart', SX + 80, y + 56, .9, '#10b981');
    text(fmt(REACT * rp), SX + 125, y + 66, 46, '#065f46', 900); text('reaksiya', SX + 125, y + 96, 20, '#059669', 700);
    text('Mega UZ: 190', SX + SW - 60, y + 66, 24, '#94a3b8', 800, 'right');
    const xp = eBack(prog(t, T19.x100, T19.x100 + .35));
    if (xp > 0) scaled(SX + SW - 130, y + 18, xp, () => { rr(SX + SW - 230, y - 6, 200, 50, 25); ctx.fillStyle = C.gold; ctx.fill(); text('×100 reaksiya', SX + SW - 130, y + 28, 24, '#7c2d12', 900, 'center'); });
  }
  const posted = t > T19.post;
  scaled(POST.x + POST.w / 2, POST.y + 43, 1 - .05 * bump(t, T19.post, .22), () => {
    rr(POST.x, POST.y, POST.w, POST.h, 43); ctx.fillStyle = posted ? '#065f46' : '#0ea371'; ctx.fill();
    text(posted ? `${GOOD.length} kanalda ishlamoqda ✓` : 'Tarmoqqa joylash', POST.x + POST.w / 2, POST.y + 55, 32, '#fff', 900, 'center');
  });
  const mp = eOut(prog(t, T19.sheet, T19.sheet + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const c = eBack(prog(t, T19.sheet + .2, T19.sheet + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * c, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (c > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T19.sheet + .45, T19.sheet + .8));
    withAlpha(prog(t, T19.sheet + .6, T19.sheet + .9), () => {
      text('Mikro-tarmoq ishda!', SX + SW / 2, sy + 300, 44, C.ink, 800, 'center');
      [`${GOOD.length} ta faol mikro-kanal`, 'Xuddi shu byudjet', `Faollik: 0.6% → ${AVG_ENG.toFixed(1)}%`].forEach((s, i) =>
        withAlpha(prog(t, T19.sheet + .9 + i * .25, T19.sheet + 1.15 + i * .25), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Kichik kanallar — katta kuch');
    const enter = eBack(prog(t, 11.1, 11.75));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => netScreen(t))));
    const taps = [[T19.chip[0], CHIPS[0][1] + CHIPS[0][2] / 2, SY + 205], [T19.chip[1], CHIPS[1][1] + CHIPS[1][2] / 2, SY + 205], [T19.post, POST.x + POST.w / 2 + 150, POST.y + 43]];
    if (t > 11.6 && t < 14.4) {
      const [cx, cy] = pathAt(t, [[11.6, W - 40, 1650], ...taps, [14.4, W - 40, 1700]]);
      withAlpha(Math.min(prog(t, 11.6, 11.8), 1 - prog(t, 14.2, 14.4)), () => cursor(cx, cy, Math.max(...taps.map(([a]) => bump(t, a, .22)))));
    }
    for (const [a, x, y] of taps) ripple(x, y, prog(t, a, a + .6), '#ffffff');
  });
  const dim = prog(t, T19.slam - .05, T19.slam + .1) * (1 - prog(t, T19.sheet - .2, T19.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T19.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T19.slam, W / 2, 880, 227, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T19.slam, 'MIKRO-KUCH', W / 2, 840, 140, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T19.slam + .15, 'kichik kanallar — katta faollik', W / 2, 1010, 50, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T19.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Bitta qimmat gigant', `${GOOD.length} ta mikro-kanal`], ['Faollik 0.6%', `Faollik ${AVG_ENG.toFixed(1)}%`], ['Kichiklar — eʼtiborsiz', 'Har biri — ishda']];
const IMPACTS3 = [[22.15, 22], [23.2, 10], [25.0, 16]];
const CLUSTER = (() => { const out = []; for (let i = 0; i < GOOD.length; i++) { const a = i * 2.39996, rr_ = 22 * Math.sqrt(i + .5); out.push([780 + Math.cos(a) * rr_ * 1.25, 460 + Math.sin(a) * rr_ * 1.25, 14 + (i % 3) * 3]); } return out; })();
function badge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    glyph(kind, bx, by, 1.5);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {
    resultBg(t);
