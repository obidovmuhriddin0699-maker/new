<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>

<script>
// ADUZ — 28-qism (XOTIMA): "Yangi bozor standarti" — Instagram Reels ("motion reel" uslubi, 27-qism Reels qoidalari).
// Hook on frame 0 (= loop target): "ESKI DAVR" struck through in orange, "tugadi." — chaos stickers drifting.
// Problem: a "chaos board" fills with the old market's pains (callbacks to earlier episodes, each tagged with its
// number) tied together with red string; TARTIBSIZLIK · ISHONCHSIZLIK · VAQT YO'QOTISH; orange cut "YETAR.".
// Vacuum: every sticker drops off the board. Transition (new): snapInto — the fallen stickers fly back as a neat grid.
// Solution on paper: the ADUZ ecosystem hub — eight modules (from the series) link to the centre; a transparency
// ledger shows where every so'm goes; lime "YANGI STANDART."; violet standards checklist. Result: dot-grid "28/28",
// before/after, badges. End: identity card + comment CTA "ADUZ" → loop. Sound: CUES_28 (home key D, like 7-qism).

const CAPTIONS = [
  [0.15, 1.55, 'Reklama bozorining eski davri tugadi.'],
  [1.7, 5.4, 'Qidiruv, soxta koʻrish, yoʻqolgan avans, javobsiz chat...'],
  [5.5, 9.4, '...tartibsizlik, ishonchsizlik, yoʻqotilgan vaqt.'],
  [11.4, 16.2, 'ADUZ — hammasi bitta ekotizimda. Har soʻm koʻrinib turadi.'],
  [16.4, 21.6, 'Fargʻona vodiysi reklama bozorining yangi standarti.'],
  [22.4, 27.0, 'Tartibsizlik oʻrniga — tizim. Shubha oʻrniga — kafolat.'],
];
window.captions = igCaptions;
const SECTIONS = [[0, '00', 'HOOK'], [1.6, '01', 'ESKI DAVR'], [9.5, '02', 'VAKUUM'], [10.3, '03', 'OTISH'], [11, '04', 'EKOTIZIM'], [22, '05', 'NATIJA'], [27, '06', 'XOTIMA']];
const IGX = 480;
function glyph(kind, x, y, s = 1, col = R.ink) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'eye') { ctx.beginPath(); ctx.moveTo(-28, 0); ctx.quadraticCurveTo(0, -24, 28, 0); ctx.quadraticCurveTo(0, 24, -28, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill(); }
  else if (kind === 'shield') { ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(26, -20); ctx.lineTo(24, 8); ctx.quadraticCurveTo(18, 26, 0, 34); ctx.quadraticCurveTo(-18, 26, -24, 8); ctx.lineTo(-26, -20); ctx.closePath(); ctx.fill(); }
  else if (kind === 'bolt') { ctx.beginPath(); ctx.moveTo(6, -32); ctx.lineTo(-16, 4); ctx.lineTo(0, 4); ctx.lineTo(-6, 32); ctx.lineTo(16, -6); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function slabCard(t, at, s, x, y, size, bg, fg, rot, hold) {
  const p = prog(t, at, at + .3), q = prog(t, at + hold, at + hold + .2); if (p <= 0 || q >= 1) return;
  ctx.save(); ctx.globalAlpha *= clamp(p * 3) * (1 - q); ctx.translate(x, y); ctx.rotate(rot * eOut(p) + (1 - eOut(p)) * -.4);
  const sc = lerp(1.8, 1, eBack(p)); ctx.scale(sc, sc);
  ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width;
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  rr(-w / 2 - size * .5, -size * .72, w + size, size * 1.44, size * .36); ctx.fillStyle = bg; ctx.fill(); ctx.shadowColor = 'transparent';
  text(s, 0, size * .04, size, fg, 900, 'center', 'middle'); ctx.restore();
}

// ---------- the old market's pains (callbacks: episode number, text) ----------
const PAINS = [['01', 'Kanal qidirish — 3 kun'], ['05', 'Soxta koʻrishlar'], ['11', 'Avans yoʻqoldi'], ['24', 'Javob yoʻq'], ['27', 'Oʻlik kanal'], ['15', 'Narx — sir'],
  ['08', 'Notoʻgʻri auditoriya'], ['21', 'Post oʻchirildi'], ['13', 'Qoʻlda hisob'], ['23', 'Mijoz yoʻqoldi'], ['26', 'Bepul tavsiya'], ['25', 'Ofisga bogʻliq']];
const STK = (() => { const r = rnd(828); return PAINS.map(([n, s], i) => ({ n, s, x: 205 + (i % 3) * 250 + (r() - .5) * 50, y: 640 + Math.floor(i / 3) * 175 + (r() - .5) * 60, rot: (r() - .5) * .5,
  col: [R.off, '#f5d9a8', '#f2c7bb', '#d9d4f7'][i % 4], at: 1.7 + i * .55, fall: r() * .25, sx: r() * W, sy: r() * H, sr: (r() - .5) * 3 })); })();
function sticker(st, x, y, rot, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 10;
  ctx.fillStyle = st.col; ctx.fillRect(-120, -62, 240, 124); ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(0, -52, 9, 0, 7); ctx.fillStyle = R.orange; ctx.fill();
  mono(`${st.n}-QISM`, -104, -30, 13, '#6b6270', 'left', .2, 800);
  const lines = wrap(st.s, 210, 26, 800); lines.forEach((l, i) => text(l, -104, 6 + i * 30, 26, R.ink, 800, 'left', 'middle'));
  ctx.restore();
}

// ---------- HOOK (frame 0 = loop target) ----------
function hookFrame(u, t) {
  ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H);
  // drifting chaos stickers in the background
  STK.forEach((st, i) => { const a = (u + 3) * .12 + i; withAlpha(.35, () => sticker(st, (st.sx + Math.sin(a) * 60 + W) % W, (st.sy + Math.cos(a * .8) * 80 + H) % H, st.rot + Math.sin(a) * .2, .8)); });
  withAlpha(.6, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); });
  mono('REKLAMA BOZORI', IGX, 520, 26, R.grey, 'center', .4, 800);
  heavy(u, -.3, 'ESKI', IGX, 690, 230, R.off, { rot: -.15, endRot: -.03 });
  heavy(u, -.2, 'DAVR', IGX, 900, 230, R.off, { rot: .12, endRot: .02 });
  const sp = eOut(clamp((u + .1) / .25)); ctx.save(); ctx.translate(IGX, 800); ctx.rotate(-.12); ctx.fillStyle = R.orange; ctx.fillRect(-400, -14, 800 * sp, 28); ctx.restore();
  serif('tugadi.', IGX, 1100, 120, R.lime);
}

// ---------- SCENE 1 — the chaos board ----------
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
function board(t, drop = 0) {
  STK.forEach((st, i) => {
    const p = eBack(prog(t, st.at, st.at + .3)); if (p <= 0) return;
    const f = clamp((drop - st.fall) / .6), y = st.y + 1600 * f * f, rot = st.rot + f * st.sr;
    if (y > H + 100) return;
    sticker(st, st.x + (1 - p) * 60, y, rot + (1 - p) * .4 + Math.sin(t * 7 + i) * .01 * prog(t, 4, 9), lerp(1.6, 1, p));
  });
  // red string between consecutive stickers (conspiracy board)
  if (drop < .05) { ctx.save(); ctx.strokeStyle = 'rgba(240,74,30,.75)'; ctx.lineWidth = 3;
    for (let i = 1; i < STK.length; i++) { const a = STK[i - 1], b = STK[i]; const k = prog(t, b.at + .1, b.at + .4); if (k <= 0) continue;
      ctx.beginPath(); ctx.moveTo(a.x, a.y - 52); ctx.quadraticCurveTo((a.x + b.x) / 2, (a.y + b.y) / 2 + 40, lerp(a.x, b.x, k), lerp(a.y - 52, b.y - 52, k)); ctx.stroke(); }
    ctx.restore(); }
}
function scene1(t) {
  if (t < 1.6) { hookFrame(t, t); const cut = prog(t, 1.45, 1.6); if (cut > 0) withAlpha(cut, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); }); return; }
  const stress = prog(t, 4.0, 9.4);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  camera((1 + .05 * eInOut(prog(t, 1.6, 10.4))) * punch(t, STK.map(s => s.at), .01), sr, sx, sy, () => {
    scramble(t, 1.6, '28-QISM  /  XOTIMA', IGX, 300, 24, R.orange, { dur: .6 });
    heavy(t, 1.75, 'ESKI DAVR', IGX, 375, 84, R.off, { rot: -.08 });
    const n = STK.filter(s => t > s.at).length;
    withAlpha(prog(t, 1.9, 2.2), () => [[String(n), 'muammo'], ['0', 'tizim'], ['0', 'kafolat']].forEach(([a, l], i) => {
      const x = 210 + i * 270; ctx.save(); ctx.strokeStyle = R.line; ctx.lineWidth = 2; rr(x - 120, 430, 240, 96, 18); ctx.stroke(); ctx.restore();
      text(a, x, 472, 44, i ? R.orange : R.off, 900, 'center', 'middle'); mono(l.toUpperCase(), x, 507, 14, R.grey, 'center', .28, 700); }));
    board(t);
  });
  slabCard(t, 5.6, 'TARTIBSIZLIK', 330, 600, 54, R.orange, R.ink, -.08, 2.9);
  slabCard(t, 6.6, 'ISHONCHSIZLIK', 560, 1000, 50, R.violet, R.off, .07, 1.9);
  slabCard(t, 7.6, 'VAQT YOʻQOTISH', 420, 1220, 50, R.off, R.ink, -.05, .9);
  if (t > 8.45 && t < 9.5) {
    const k = eOut(prog(t, 8.45, 8.62)), cut = 1 - prog(t, 9.3, 9.45), rw = lerp(500, W + 40, k), rh = lerp(260, H + 40, k);
    withAlpha(cut, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(130, 0, k)); ctx.fillStyle = R.orange; ctx.fill();
      heavy(t, 8.5, 'YETAR.', IGX, 820, 190, R.ink, { rot: -.12, endRot: -.04 });
      withAlpha(prog(t, 8.7, 8.9), () => serif('eski davr tartibsizligi', IGX, 1030, 72, R.ink));
    });
  }
  // vacuum: every sticker drops off the board
  if (t > 9.5) { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); board(t, prog(t, 9.55, 10.25) * 1.3); }
}

// Transition (new): the stickers fly back from scattered positions and snap into a neat grid that covers the frame,
// the grid turns to paper and B appears behind it.
function snapInto(t, a, b, drawA, drawB) {
  const p = prog(t, a, b);
  (p < .55 ? drawA : drawB)(t);
  const cols = 4, rows = 8, cw = W / cols, ch = H / rows;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = j * cols + i, st = STK[(k * 5 + j) % STK.length], d = (i + j) / (cols + rows);
    const inn = eOut(clamp((p * 2.4 - d * .8) / .5)), out = eIn(clamp(((p - .55) * 2.6 - d * .6) / .4));
    if (inn <= 0 || out >= 1) continue;
    const x = lerp(st.sx, (i + .5) * cw, inn), y = lerp(st.sy - 300, (j + .5) * ch, inn), r = lerp(st.sr, 0, inn);
    ctx.save(); ctx.translate(x, y); ctx.rotate(r); const s = 1 - out;
    ctx.scale(s, s); ctx.fillStyle = st.col; ctx.fillRect(-cw / 2 - 1, -ch / 2 - 1, cw + 2, ch + 2);
    ctx.fillStyle = R.orange; ctx.beginPath(); ctx.arc(0, -ch / 2 + 16, 8, 0, 7); ctx.fill();
    ctx.restore();
  }
}

// ---------- SCENE 2 — the ADUZ ecosystem ----------
const T28 = { link: 11.5, open: 14.3, ledger: 14.6, total: 16.1, slam: 18.5, sheet: 19.7 };
const IMPACTS2 = [[11.0, 26], [T28.open, 10], [T28.total, 8], [T28.slam, 34]];
const MODS = [['02', 'Kanallar bozori'], ['05', 'Tekshiruv'], ['11', 'Kafolatli toʻlov'], ['14', 'Statistika'], ['24', '24/7 menejer'], ['23', 'Retargeting'], ['26', 'Referal'], ['27', 'Optimizatsiya']];
const HUB = { x: IGX, y: 740, r: 300 };
const modPos = i => { const a = -Math.PI / 2 + i / 8 * Math.PI * 2; return [HUB.x + Math.cos(a) * HUB.r, HUB.y + Math.sin(a) * HUB.r * .82]; };
const OPEN = { x: 110, y: 1170, w: 720, h: 70 };
function hub(t) {
  MODS.forEach(([n, s], i) => {
    const at = T28.link + i * .3, [x, y] = modPos(i), k = eInOut(prog(t, at, at + .3));
    if (k > 0) { ctx.save(); ctx.strokeStyle = R.ink; ctx.lineWidth = 3; ctx.setLineDash([2, 8]); ctx.beginPath(); ctx.moveTo(HUB.x, HUB.y); ctx.lineTo(lerp(HUB.x, x, k), lerp(HUB.y, y, k)); ctx.stroke(); ctx.restore();
      const dp = (t * .8 + i / 8) % 1; if (k >= 1) { ctx.beginPath(); ctx.arc(lerp(HUB.x, x, dp), lerp(HUB.y, y, dp), 6, 0, 7); ctx.fillStyle = R.orange; ctx.fill(); } }
    const p = eBack(prog(t, at + .2, at + .5)); if (p <= 0) return;
    scaled(x, y, p, () => {
      ctx.font = fnt(800, 24); const w = Math.max(150, ctx.measureText(s).width + 40);
      card(x - w / 2, y - 40, w, 80, [R.card, R.lime, R.card, R.card, R.lime, R.card, R.card, R.lime][i], 16);
      mono(`${n}`, x - w / 2 + 14, y - 22, 12, R.orange, 'left', .2, 800);
      text(s, x, y + 10, 24, R.ink, 800, 'center', 'middle');
    });
  });
  const lp = eBack(prog(t, 10.75, 11.2));
  if (lp > 0) scaled(HUB.x, HUB.y, lp * (1 + .03 * Math.sin(t * 4)), () => {
    ctx.save(); ctx.shadowColor = 'rgba(240,74,30,.5)'; ctx.shadowBlur = 50; ctx.beginPath(); ctx.arc(HUB.x, HUB.y, 105, 0, 7); ctx.fillStyle = R.ink; ctx.fill(); ctx.restore();
    rr(HUB.x - 34, HUB.y - 58, 68, 68, 18); ctx.fillStyle = R.orange; ctx.fill(); shield(HUB.x, HUB.y - 24, .72, R.off); check(HUB.x + 1, HUB.y - 22, 19, R.orange, 5);
    text('ADUZ', HUB.x, HUB.y + 50, 40, R.off, 900, 'center', 'middle');
  });
}
function ledger(t) {
  const p = eOut(prog(t, T28.ledger, T28.ledger + .45)); if (p <= 0) return;
  const y0 = lerp(1300, 1040, p);
  withAlpha(p, () => {
    card(70, y0 - 10, 830, 260, 'rgba(255,255,255,.82)', 26);
    mono('TOʻLIQ SHAFFOFLIK  /  HISOBOT', 105, y0 + 30, 15, R.grey, 'left', .3, 700);
    [['Siz toʻladingiz', '1 000 000', R.ink], ['Kanallarga', '900 000', '#5d7a12'], ['ADUZ xizmati', '100 000', R.orange]].forEach(([a, b, c], i) => {
      const k = prog(t, T28.ledger + .3 + i * .3, T28.ledger + .6 + i * .3); if (k <= 0) return;
      withAlpha(k, () => { text(a, 105, y0 + 80 + i * 50, 28, R.ink, 700); text(`${b} soʻm`, 860, y0 + 80 + i * 50, 28, c, 900, 'right'); });
    });
    const tk = eBack(prog(t, T28.total, T28.total + .35)); if (tk > 0) scaled(480, y0 + 215, tk, () => { rr(300, y0 + 192, 360, 46, 23); ctx.fillStyle = R.lime; ctx.fill(); mono('HAMMASI KOʻRINIB TURADI', 480, y0 + 215, 14, R.ink, 'center', .15, 800); });
  });
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera((1.03 - .03 * eOut(prog(t, 11, 12)) + .015 * eInOut(prog(t, 12, 21.8))) * punch(t, [T28.open, T28.total, ...MODS.map((m, i) => T28.link + i * .3 + .2)], .012), sr, sx, sy, () => {
    ctx.fillStyle = R.paper; ctx.fillRect(0, 0, W, H);
    dotGrid(t, .06, .4, 1, HUB.x, HUB.y);
    scramble(t, 11.1, 'ADUZ EKOTIZIMI', IGX, 300, 26, R.orange, { dur: .5 });
    withAlpha(prog(t, 11.3, 11.6), () => serif('hammasi — bitta joyda', IGX, 370, 58, R.ink));
    hub(t);
    if (t < T28.ledger + .3) withAlpha(eOut(prog(t, 13.8, 14.1)) * (1 - prog(t, T28.ledger, T28.ledger + .3)), () => scaled(OPEN.x + OPEN.w / 2, OPEN.y + 35, 1 - .05 * bump(t, T28.open, .22), () => {
      rr(OPEN.x, OPEN.y, OPEN.w, OPEN.h, 35); ctx.fillStyle = R.ink; ctx.fill(); text('Hisobotni ochish', OPEN.x + OPEN.w / 2, OPEN.y + 46, 30, R.off, 900, 'center'); }));
    ledger(t);
    if (t > 13.7 && t < 14.9) {
      const [cx, cy] = pathAt(t, [[13.7, 850, 1400], [T28.open, OPEN.x + OPEN.w / 2 + 120, OPEN.y + 35], [14.9, 850, 1420]]);
      withAlpha(Math.min(prog(t, 13.7, 13.85), 1 - prog(t, 14.7, 14.9)), () => cursor(cx, cy, bump(t, T28.open, .22)));
    }
    ripple(OPEN.x + OPEN.w / 2 + 120, OPEN.y + 35, prog(t, T28.open, T28.open + .6), R.ink);
  });
  if (t > T28.slam - .05 && t < T28.sheet + .3) {
    const k = eOut(prog(t, T28.slam - .05, T28.slam + .12)), out = prog(t, T28.sheet - .15, T28.sheet + .25);
    const rw = lerp(420, W + 40, k), rh = lerp(240, H + 40, k);
    withAlpha(1 - out, () => {
      rr(W / 2 - rw / 2, H / 2 - rh / 2, rw, rh, lerp(120, 0, k)); ctx.fillStyle = R.lime; ctx.fill();
      dotGrid(t, .12, .5, 1, IGX, 820);
      heavy(t, T28.slam, 'YANGI', IGX, 700, 250, R.ink, { rot: .14, endRot: -.03 });
      heavy(t, T28.slam + .1, 'STANDART.', IGX, 910, 150, R.ink, { rot: -.14, endRot: .02 });
      withAlpha(prog(t, T28.slam + .3, T28.slam + .55), () => serif('Fargʻona vodiysi reklama bozori uchun', IGX, 1060, 54, R.ink));
    });
  }
  const mp = eOut(prog(t, T28.sheet, T28.sheet + .45));
  if (mp > 0) {
    withAlpha(.35 * mp, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); });
    const y0 = lerp(H, 380, mp);
    card(70, y0, 840, 700, R.violet, 34);
    withAlpha(prog(t, T28.sheet + .3, T28.sheet + .6), () => { serif('Bozorning', 490, y0 + 110, 96, R.off); serif('yangi standarti.', 490, y0 + 210, 96, R.off); });
    ['SHAFFOF NARX', 'TEKSHIRILGAN KANAL', 'KAFOLATLI TOʻLOV', 'JONLI YORDAM'].forEach((l, i) => {
      const at = T28.sheet + .7 + i * .25, k = eBack(prog(t, at, at + .3)), ry = y0 + 320 + i * 72;
      mono(l, 130, ry, 20, R.off, 'left', .3, 800); ctx.fillStyle = 'rgba(239,236,228,.2)'; ctx.fillRect(130, ry + 28, 680, 2);
      if (k > 0) scaled(800, ry, k, () => { ctx.beginPath(); ctx.arc(800, ry, 24, 0, 7); ctx.fillStyle = R.lime; ctx.fill(); check(800, ry + 1, 22, R.ink, 5); });
    });
    const dn = eBack(prog(t, T28.sheet + 1.8, T28.sheet + 2.1)); if (dn > 0) scaled(490, y0 + 640, dn, () => { rr(330, y0 + 612, 320, 56, 28); ctx.fillStyle = R.lime; ctx.fill(); mono('STANDART: ADUZ', 490, y0 + 641, 15, R.ink, 'center', .15, 800); });
  }
}

// ---------- SCENE 3 — Natija ----------
const CMP = [['Tartibsizlik', 'Bitta ekotizim'], ['Yashirin narx', 'Toʻliq shaffoflik'], ['Ishonchsizlik', 'Kafolat']];
const IMPACTS3 = [[22.15, 22], [22.6, 10], [23.2, 10], [25.0, 16]];
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera((1 + .03 * eInOut(prog(t, 22, 27))) * punch(t, [22.6, 23.2, 25.0], .03), sr, sx, sy, () => {
    resultBg(t);
    const sa = 1 - prog(t, 22.85, 23.15);
    if (sa > 0) withAlpha(sa, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); dotGrid(t, 1, .55, 1.4, IGX, 800);
      withAlpha(.55, () => { ctx.fillStyle = R.ink; ctx.fillRect(0, 0, W, H); });
      heavy(t, 22.1, '28/28', IGX, 780, 300, R.off, { rot: -.25, endRot: -.05 });
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 20; mono('QISM  /  BITTA EKOTIZIM', IGX, 980, 30, R.off, 'center', .4, 800); ctx.restore(); });
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha((1 - out) * prog(t, 22.9, 23.1), () => {
      scramble(t, 22.95, 'NATIJA', IGX, 300, 26, R.lime, { dur: .4 });
      heavy(t, 23.0, 'ESKI DAVR → ADUZ', IGX, 375, 70, R.off, { rot: .06 });
      serif('tizim · shaffoflik · kafolat', IGX, 455, 46, R.violetSoft);
      const cp = eOut(prog(t, 23.0, 23.5)), x = 70, y = lerp(560, 520, cp), w = 840, h = 430;
      withAlpha(cp, () => {
        card(x, y, w, h, R.card, 30);
        mono('ESKI DAVR', x + 50, y + 62, 20, R.grey, 'left', .3, 800);
        rr(x + 430, y + 34, 180, 54, 27); ctx.fillStyle = R.orange; ctx.fill(); mono('ADUZ', x + 520, y + 62, 20, R.ink, 'center', .3, 800);
        ctx.fillStyle = '#e4e1da'; ctx.fillRect(x + 400, y + 105, 2, h - 130);
        CMP.forEach(([a, b], i) => {
          const ry = y + 165 + i * 100, st = eInOut(prog(t, 23.5 + i * .35, 23.8 + i * .35)), ok = eBack(prog(t, 23.7 + i * .35, 24.0 + i * .35));
