<script>
// ADUZ — 4-qism: "Vaqtni oʻgʻirlaydigan jarayonlar"
// Scenes for this episode; shared helpers live in lib.js (incl. the motion toolkit).
// Music is 120 BPM: every cut and impact lands on a beat (0.5 s grid).

const CAPTIONS = [
  [0.4, 5.0, 'Har bir admin bilan alohida yozishish, kutish, qayta yozish...'],
  [5.2, 10.5, 'Narx ustida savdolashish — va bitta reklama uchun 3 kun ketadi.'],
  [11.4, 16.2, 'ADUZʼda narxlar oldindan belgilangan: kanallarni tanlang va yuboring.'],
  [16.4, 21.7, 'Barcha kanallar bir necha soniyada tasdiqlaydi — yozishmasiz, savdolashmasiz.'],
  [22.5, 27.0, '3 kun oʻrniga 47 soniya. Tejalgan vaqt — biznesingiz uchun.'],
  [27.4, 31.6, 'ADUZ — biznesingiz himoyachisi!'],
];

// Clock tick schedule shared with audio.py (cues_4): accelerates as stress builds.
function tickTimes() {
  const out = [];
  for (let x = 0.5; x < 5.5; x += .5) out.push(x);
  for (let x = 5.5; x < 8.5; x += .25) out.push(x);
  for (let x = 8.5; x < 10.6; x += .125) out.push(x);
  return out;
}
const TICKS = tickTimes();
const ticksBefore = t => { let n = 0; for (const x of TICKS) if (x <= t) n++; return n; };
// Vertical "roll" between values: [[time, text], …].
function rollText(t, values, x, y, size, color, weight = 800) {
  let i = 0; while (i + 1 < values.length && values[i + 1][0] <= t) i++;
  const p = eOut(prog(t, values[i][0], values[i][0] + .3));
  ctx.save(); ctx.beginPath(); ctx.rect(x - 150, y - size, 300, size * 1.25); ctx.clip();
  if (i > 0 && p < 1) withAlpha(1 - p, () => text(values[i - 1][1], x, y - size * p, size, color, weight, 'center'));
  withAlpha(i > 0 ? p : 1, () => text(values[i][1], x, y + (i > 0 ? size * (1 - p) : 0), size, color, weight, 'center'));
  ctx.restore();
}
function typingDots(x, y, t, col = '#7f91a4') {
  for (let k = 0; k < 3; k++) {
    ctx.beginPath(); ctx.arc(x + k * 22, y - Math.max(0, Math.sin(t * 10 - k * .8)) * 8, 7, 0, 7);
    ctx.fillStyle = col; ctx.fill();
  }
}

// ---------- SCENE 1 — Muammo ----------
const CHATS = [
  { name: 'Fargʻona 24', init: 'F2', col: '#f59e0b', msg: 'Salom, reklama joyi bormi?' },
  { name: 'Vodiy News', init: 'VN', col: '#3b82f6', msg: 'Narxni keyin aytaman' },
  { name: 'Andijon Bozor', init: 'AB', col: '#ec4899', msg: 'Admin hozir band' },
  { name: 'Namangan Live', init: 'NL', col: '#a855f7', msg: 'Shartlarni yozib yuboring' },
  { name: 'Qoʻqon TV', init: 'QT', col: '#06b6d4', msg: 'Kim bilan gaplashyapman?' },
  { name: 'Margʻilon 1', init: 'M1', col: '#84cc16', msg: 'Kutib turing' },
];
const EVENTS = [
  [1.0, 2, '800 ming, chegirma yoʻq'], [1.5, 0, 'Narxni kelishamiz...'], [2.0, 4, 'Joy band, keyingi hafta'],
  [2.5, 1, 'Ertaga javob beraman'], [3.0, 3, 'Avval toʻlov, keyin post'], [3.5, 5, 'yozmoqda...'], [4.0, 2, '750 dan tushmaymiz'],
];
function chatState(t) {
  const st = CHATS.map((c, i) => ({ ...c, i, last: -i, unread: [2, 1, 3, 1, 2, 1][i], fresh: false }));
  for (const [at, i, msg] of EVENTS) if (at <= t) { st[i].msg = msg; st[i].last = at; st[i].unread++; st[i].fresh = at; }
  const order = [...st].sort((a, b) => b.last - a.last).map(s => s.i);
  st.forEach(s => s.rank = order.indexOf(s.i));
  return st;
}
const HAGGLE = [
  [5.2, 'out', 'Salom! Reklama narxi qancha?'],
  [5.75, 'in', '800 000 soʻm'],
  [6.3, 'out', '600 000 boʻladimi?'],
  [6.9, 'in', '700 000. Oxirgi narx.'],
  [7.45, 'out', 'Kelishdik. Qachon chiqadi?'],
  [8.05, 'in', 'Ertaga javob beraman...'],
];
const IMPACTS1 = [[5.6, 12], [6.6, 12], [7.6, 12], [8.5, 46]];
function chatList(t) {
  ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150);
  text('Chatlar', SX + 50, SY + 96, 40, '#fff', 800);
  text(`${Math.min(14, 6 + Math.floor(t * 2))} ta admin bilan yozishma`, SX + 50, SY + 132, 24, '#7f91a4', 500);
  const now = chatState(t);
  let last = 0; for (const [at] of EVENTS) if (at <= t) last = at;
  const before = chatState(last - .001), mp = eOut(prog(t, last, last + .35));
  now.forEach((c, i) => {
    const rank = lerp(before[i].rank, c.rank, mp), y = SY + 170 + rank * 118;
    const isNew = c.fresh !== false && t - c.fresh < .6;
    if (isNew) { ctx.fillStyle = `rgba(43,82,120,${.6 * (1 - (t - c.fresh) / .6)})`; ctx.fillRect(SX, y, SW, 112); }
    ctx.beginPath(); ctx.arc(SX + 75, y + 56, 40, 0, 7); ctx.fillStyle = c.col; ctx.fill();
    text(c.init, SX + 75, y + 58, 28, '#fff', 800, 'center', 'middle');
    text(c.name, SX + 135, y + 46, 30, '#fff', 700);
    const typing = c.msg === 'yozmoqda...';
    text(c.msg, SX + 135, y + 88, 25, typing ? '#4fa3ff' : '#8a9aab', 500);
    text(c.fresh !== false ? 'hozir' : 'kecha', SX + SW - 40, y + 46, 22, '#7f91a4', 500, 'right');
    const bs = c.fresh !== false ? 1 + .35 * bump(t, c.fresh, .35) : 1;
    scaled(SX + SW - 62, y + 80, bs, () => {
      ctx.beginPath(); ctx.arc(SX + SW - 62, y + 80, 20, 0, 7); ctx.fillStyle = '#3e8ee0'; ctx.fill();
      text(String(c.unread), SX + SW - 62, y + 81, 22, '#fff', 800, 'center', 'middle');
    });
    ctx.fillStyle = '#0b131c'; ctx.fillRect(SX + 135, y + 116, SW - 135, 2);
  });
}
function haggleChat(t) {
  ctx.fillStyle = '#17212b'; ctx.fillRect(SX, SY, SW, 150);
  ctx.beginPath(); ctx.arc(SX + 80, SY + 95, 36, 0, 7); ctx.fillStyle = '#ec4899'; ctx.fill();
  text('AB', SX + 80, SY + 97, 26, '#fff', 800, 'center', 'middle');
  text('Andijon Bozor · admin', SX + 135, SY + 88, 32, '#fff', 700);
  const typing = HAGGLE.some(([at, k]) => k === 'in' && t > at - .45 && t < at);
  text(typing ? 'yozmoqda...' : 'yaqinda onlayn edi', SX + 135, SY + 126, 24, typing ? '#4fa3ff' : '#7f91a4', 500);
  let y = SY + 190;
  for (const [at, kind, s] of HAGGLE) {
    if (kind === 'in' && t > at - .45 && t < at) {
      rr(SX + 30, y, 130, 64, 26); ctx.fillStyle = '#182533'; ctx.fill(); typingDots(SX + 73, y + 34, t);
    }
    const p = prog(t, at, at + .3);
    if (p <= 0) break;
    const size = 31, lines = wrap(s, 470, size, 500), lh = 42;
    const bw = Math.min(520, Math.max(...lines.map(l => ctx.measureText(l).width)) + 56), bh = lines.length * lh + 40;
    const x = kind === 'out' ? SX + SW - 30 - bw : SX + 30;
    withAlpha(p, () => scaled(kind === 'out' ? x + bw : x, y + bh, lerp(.5, 1, eBack(p)), () => {
      rr(x, y, bw, bh, 26); ctx.fillStyle = kind === 'out' ? '#2b5278' : '#182533'; ctx.fill();
      lines.forEach((l, i) => text(l, x + 28, y + 20 + lh * i + 31, size, '#e9eef3', 500));
    }));
    y += bh + 22;
  }
}
function scene1(t) {
  const stress = prog(t, 5, 10);
  problemBg(t, stress);
  const [sx, sy, sr] = shakeAt(t, IMPACTS1);
  const zoom = 1 + .06 * eInOut(prog(t, 0, 10.6));
  camera(zoom, sr - .012 * stress * Math.sin(t * 1.3), sx, sy, () => {
    // the clock: minute hand speeds up, second hand jumps on every audio tick
    const turns = t * .12 + .05 * t * t + (t > 8.5 ? (t - 8.5) * 1.6 : 0);
    bigClock(W / 2, 960, 640, turns, ticksBefore(t) * 2, '#ffffff', .07 + .06 * stress);
    episodeTitle(t, '4-QISM', 'Vaqtni oʻgʻirlaydigan jarayonlar', 50);
    withAlpha(prog(t, .6, 1.2), () => {
      const msgs = Math.round(62 * eInOut(prog(t, 1, 9.5)));
      [['kun', '#fff'], ['xabar', '#fff'], ['natija', C.red]].forEach(([lab], i) => {
        const x = 200 + i * 340;
        rr(x - 150, 228, 300, 100, 22); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill();
        text(lab, x, 312, 26, '#94a3b8', 500, 'center');
      });
      rollText(t, [[0, 'Dushanba'], [3.5, 'Seshanba'], [7.0, 'Chorshanba']], 200, 278, 40, '#fff');
      text(`${msgs} ta`, 540, 278, 44, '#fff', 800, 'center');
      text('0', 880, 278, 44, C.red, 800, 'center');
    });
    const enter = eOut(prog(t, 0, .7)), open = eInOut(prog(t, 4.55, 5.0));
    phone('#0e1621', 0, lerp(160, 0, enter), 0, () => {
      if (open < 1) { ctx.save(); ctx.translate(-SW * open, 0); chatList(t); ctx.restore(); }
      if (open > 0) { ctx.save(); ctx.translate(SW * (1 - open), 0); ctx.fillStyle = '#0e1621'; ctx.fillRect(SX, SY, SW, SH); haggleChat(t); ctx.restore(); }
      ctx.fillStyle = `rgba(255,40,60,${.12 * stress})`; ctx.fillRect(SX, SY, SW, SH);
    });
    slam(t, 5.6, 'SAVDOLASHISH', 330, 560, 50, '#fff', { slab: C.red, rot: -.08, hold: 2.9 });
    slam(t, 6.6, 'KUTISH', 810, 820, 56, '#fff', { slab: C.red, rot: .07, hold: 1.9 });
    slam(t, 7.6, 'QAYTA YOZISH', 330, 1420, 50, '#fff', { slab: C.red, rot: .05, hold: .9 });
  });
  // "3 KUN" punch
  const dim = prog(t, 8.45, 8.6) * (1 - prog(t, 10.4, 10.6));
  if (dim > 0) withAlpha(dim * .6, () => { ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, 8.5, W / 2, 900, C.red, 1100);
  sparks(t, 8.5, W / 2, 900, 31, [C.red, '#ffb4bc', '#ffffff'], 36, 1200);
  slam(t, 8.5, '3 KUN', W / 2, 880, 290, '#fff', { hold: 1.75, glow: 'rgba(255,40,60,.9)' });
  slam(t, 8.8, 'bitta reklama uchun', W / 2, 1090, 54, '#ffb4bc', { hold: 1.45 });
  flash(t, 8.5, C.red, .4, .45);
}

// ---------- SCENE 2 — Yechim ----------
const PICK = [
  { name: 'Fargʻona 24', init: 'F2', col: '#f59e0b', price: '350 000' },
  { name: 'Vodiy News', init: 'VN', col: '#3b82f6', price: '280 000' },
  { name: 'Andijon Bozor', init: 'AB', col: '#ec4899', price: '320 000' },
  { name: 'Namangan Live', init: 'NL', col: '#a855f7', price: '240 000' },
  { name: 'Qoʻqon TV', init: 'QT', col: '#06b6d4', price: '300 000' },
  { name: 'Margʻilon 1', init: 'M1', col: '#84cc16', price: '190 000' },
];
const T4 = { all: 12.4, banner: 13.5, btn: 14.2, send: 15.0, sent: 15.5, ok: 16.3, done: 18.0, slam: 18.5, sheet: 19.7 };
const ROW0 = SY + 312, ROWH = 92;
const SEND_BTN = { x: SX + 40, y: SY + SH - 150, w: SW - 80, h: 100 };
const SEL_ALL = { x: SX + SW - 60, y: SY + 276 };
const IMPACTS2 = [[11.0, 30], [T4.send, 10], [T4.slam, 34]];
const stopwatch = t => Math.round(47 * clamp((t - 12.0) / (T4.done - 12.0)));
function campaignScreen(t) {
  ctx.fillStyle = '#0ea371'; ctx.fillRect(SX, SY, SW, 150);
  text('Kampaniya', SX + 50, SY + 112, 40, '#fff', 800);
  // stopwatch pill
  const sw = stopwatch(t), pulse = t > T4.done ? 1 + .06 * Math.sin(t * 10) : 1;
  scaled(SX + SW - 140, SY + 96, pulse, () => {
    rr(SX + SW - 250, SY + 66, 210, 62, 31); ctx.fillStyle = t > T4.done ? C.gold : 'rgba(255,255,255,.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(SX + SW - 212, SY + 97, 16, 0, 7); ctx.lineWidth = 4; ctx.strokeStyle = t > T4.done ? C.ink : '#fff'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SX + SW - 212, SY + 97); ctx.lineTo(SX + SW - 212 + Math.sin(sw / 60 * 6.28) * 11, SY + 97 - Math.cos(sw / 60 * 6.28) * 11); ctx.stroke();
    text(`00:${String(sw).padStart(2, '0')}`, SX + SW - 120, SY + 108, 32, t > T4.done ? C.ink : '#fff', 900, 'center');
  });
  // steps
  const steps = ['Tanlash', 'Narx', 'Yuborish'], stepAt = [12.0, T4.banner, T4.send];
  steps.forEach((s, i) => {
    const on = prog(t, stepAt[i], stepAt[i] + .3), x = SX + 90 + i * 250;
    if (i < 2) { rr(x + 20, SY + 196, 210, 6, 3); ctx.fillStyle = '#dbe3e0'; ctx.fill(); rr(x + 20, SY + 196, 210 * prog(t, stepAt[i + 1] - .3, stepAt[i + 1]), 6, 3); ctx.fillStyle = '#16c784'; ctx.fill(); }
    scaled(x, SY + 199, 1 + .25 * bump(t, stepAt[i], .35), () => {
      ctx.beginPath(); ctx.arc(x, SY + 199, 20, 0, 7); ctx.fillStyle = on > .5 ? '#16c784' : '#dbe3e0'; ctx.fill();
      text(String(i + 1), x, SY + 200, 22, '#fff', 800, 'center', 'middle');
    });
    text(s, x, SY + 240, 22, on > .5 ? '#065f46' : '#94a3b8', 700, 'center');
  });
  text('Kanallar', SX + 40, ROW0 - 22, 26, C.grey, 800);
  text('Hammasini tanlash', SEL_ALL.x, ROW0 - 22, 26, '#059669', 800, 'right');
  PICK.forEach((c, i) => {
    const y = ROW0 + i * ROWH, ck = prog(t, T4.all + .12 + i * .09, T4.all + .32 + i * .09);
    const sweep = prog(t, T4.all + .12 + i * .09, T4.all + .6 + i * .09);
    rr(SX + 30, y, SW - 60, ROWH - 8, 22); ctx.fillStyle = '#fff'; ctx.fill();
    if (sweep > 0 && sweep < 1) withAlpha(1 - sweep, () => { rr(SX + 30, y, SW - 60, ROWH - 8, 22); ctx.fillStyle = '#bbf7d0'; ctx.fill(); });
    // status flash on confirm
    const okP = prog(t, T4.ok + i * .22, T4.ok + i * .22 + .4);
    if (okP > 0 && okP < 1) withAlpha(1 - okP, () => { rr(SX + 30, y, SW - 60, ROWH - 8, 22); ctx.fillStyle = '#86efac'; ctx.fill(); });
    scaled(SX + 78, y + 42, 1 + .3 * bump(t, T4.all + .12 + i * .09, .3), () => {
      rr(SX + 58, y + 22, 40, 40, 10); ctx.fillStyle = ck > 0 ? '#16c784' : '#fff'; ctx.fill();
      if (ck <= 0) { ctx.lineWidth = 3; ctx.strokeStyle = '#cbd5e1'; ctx.stroke(); } else check(SX + 78, y + 42, 22, '#fff', 5, ck);
    });
    ctx.beginPath(); ctx.arc(SX + 150, y + 42, 30, 0, 7); ctx.fillStyle = c.col; ctx.fill();
    text(c.init, SX + 150, y + 44, 22, '#fff', 800, 'center', 'middle');
    text(c.name, SX + 198, y + 52, 28, C.ink, 700);
    // right side: price → "Yuborildi" → "Tasdiqlandi"
    const sent = prog(t, T4.sent + i * .12, T4.sent + i * .12 + .2), ok = prog(t, T4.ok + i * .22, T4.ok + i * .22 + .25);
    const rx = SX + SW - 60;
    if (sent <= 0) text(`${c.price}`, rx, y + 52, 26, '#059669', 800, 'right');
    else {
      const lab = ok > 0 ? 'Tasdiqlandi' : 'Yuborildi', col = ok > 0 ? '#16c784' : '#3b82f6';
      const p = eBack(ok > 0 ? ok : sent);
      scaled(rx - 90, y + 42, p, () => {
        ctx.font = `800 22px ${F}`; const w = ctx.measureText(lab).width + (ok > 0 ? 64 : 36);
        rr(rx - w, y + 22, w, 42, 21); ctx.fillStyle = col; ctx.fill();
        if (ok > 0) check(rx - w + 26, y + 43, 16, '#fff', 4);
        text(lab, rx - 18, y + 51, 22, '#fff', 800, 'right');
      });
    }
  });
  // fixed price banner
  const bp = eOut(prog(t, T4.banner, T4.banner + .45));
  if (bp > 0) {
    const y = ROW0 + 6 * ROWH + 2, x = SX + 30 + lerp(SW, 0, bp);
    rr(x, y, SW - 60, 92, 24); ctx.fillStyle = '#d1fae5'; ctx.fill();
    shield(x + 50, y + 46, .95, '#059669'); check(x + 51, y + 48, 21, '#fff', 4.5);
    text('Narxlar belgilangan —', x + 92, y + 40, 26, '#065f46', 800);
    text('savdolashish yoʻq', x + 92, y + 74, 26, '#065f46', 800);
  }
  // send button
  const b = SEND_BTN, btp = eBack(prog(t, T4.btn, T4.btn + .4));
  if (btp > 0) {
    const press = bump(t, T4.send, .25), done = t > T4.done;
    scaled(b.x + b.w / 2, b.y + b.h / 2, btp * (1 - .06 * press), () => {
      rr(b.x, b.y, b.w, b.h, 50); ctx.fillStyle = done ? '#065f46' : '#0ea371'; ctx.fill();
      const sentN = PICK.filter((_, i) => t > T4.ok + i * .22).length;
      const label = t < T4.send ? '6 ta kanalga yuborish  →' : sentN < 6 ? `Tasdiqlanmoqda... ${sentN}/6` : '6/6 tasdiqlandi';
      text(label, b.x + b.w / 2, b.y + b.h / 2 + 2, 34, '#fff', 800, 'center', 'middle');
      if (t > T4.send && sentN < 6) { rr(b.x + 30, b.y + b.h - 16, (b.w - 60) * sentN / 6, 6, 3); ctx.fillStyle = '#a7f3d0'; ctx.fill(); }
    });
  }
  // success sheet
  const mp = eOut(prog(t, T4.sheet, T4.sheet + .45));
  if (mp > 0) {
    ctx.fillStyle = `rgba(4,20,16,${.55 * mp})`; ctx.fillRect(SX, SY, SW, SH);
    const sy = lerp(SY + SH, SY + SH - 640, mp);
    rr(SX, sy, SW, 700, 50); ctx.fillStyle = '#fff'; ctx.fill();
    const cp = eBack(prog(t, T4.sheet + .2, T4.sheet + .6));
    ctx.beginPath(); ctx.arc(SX + SW / 2, sy + 150, 80 * cp, 0, 7); ctx.fillStyle = '#16c784'; ctx.fill();
    if (cp > .5) check(SX + SW / 2, sy + 152, 70, '#fff', 13, prog(t, T4.sheet + .45, T4.sheet + .8));
    withAlpha(prog(t, T4.sheet + .6, T4.sheet + .9), () => {
      text('Kampaniya ishga tushdi!', SX + SW / 2, sy + 300, 42, C.ink, 800, 'center');
      ['6 ta kanal 47 soniyada tasdiqladi', 'Toʻlov avtomatik bajarildi', 'Postlar jadval boʻyicha chiqadi'].forEach((s, i) =>
        withAlpha(prog(t, T4.sheet + .9 + i * .25, T4.sheet + 1.15 + i * .25), () => {
          check(SX + 90, sy + 380 + i * 70, 26, '#16c784', 6);
          text(s, SX + 125, sy + 391 + i * 70, 29, '#334155', 600);
        }));
    });
  }
}
function paperPlane(t) {
  const p = prog(t, T4.send + .05, T4.send + .85);
  if (p <= 0 || p >= 1) return;
  const b = SEND_BTN, P = q => {
    const u = eInOut(q), x0 = b.x + b.w / 2, y0 = b.y + 20, cx = 140, cy = 520, x1 = W + 120, y1 = 260;
    return [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * x1, (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * cy + u * u * y1];
  };
  ctx.setLineDash([6, 18]); ctx.lineDashOffset = -t * 300;
  ctx.beginPath(); for (let k = 0; k <= 30; k++) { const [x, y] = P(p * k / 30); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.stroke(); ctx.setLineDash([]);
  const [x, y] = P(p), [x2, y2] = P(Math.min(1, p + .02)), ang = Math.atan2(y2 - y, x2 - x);
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(1.6, 1.6);
  ctx.shadowColor = 'rgba(34,227,154,.9)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(-30, -26); ctx.lineTo(-14, 0); ctx.lineTo(-30, 26); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(-14, 0); ctx.lineTo(-22, 14); ctx.closePath(); ctx.fillStyle = '#a7f3d0'; ctx.fill();
  ctx.restore();
}
function scene2(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS2);
  camera(1.04 - .04 * eOut(prog(t, 11, 12)) + .025 * eInOut(prog(t, 12, 21.8)), sr, sx, sy, () => {
    solutionBg(t, 'Bir necha soniyada');
    const enter = eBack(prog(t, 11.1, 11.75));
    scaled(W / 2, PY + PH / 2, lerp(.8, 1, enter), () => withAlpha(prog(t, 11.1, 11.35), () =>
      phone('#f4f7f6', 0, lerp(180, 0, enter), 0, () => campaignScreen(t))));
    // cursor: "Hammasini tanlash" → send button
    const btn = [SEND_BTN.x + SEND_BTN.w / 2 + 60, SEND_BTN.y + 50];
    if (t > 11.8 && t < 15.5) {
      const [cx, cy] = pathAt(t, [[11.8, W - 40, 1560], [T4.all, SEL_ALL.x - 110, SEL_ALL.y + 4], [14.35, SEL_ALL.x - 110, SEL_ALL.y + 4], [T4.send, btn[0], btn[1]]]);
      const press = Math.max(bump(t, T4.all, .22), bump(t, T4.send, .22));
      withAlpha(Math.min(prog(t, 11.8, 12.0), 1 - prog(t, 15.2, 15.5)), () => cursor(cx, cy, press));
    }
    ripple(SEL_ALL.x - 110, SEL_ALL.y + 4, prog(t, T4.all, T4.all + .6), '#16c784');
    ripple(btn[0], btn[1], prog(t, T4.send, T4.send + .6), '#ffffff');
    paperPlane(t);
  });
  // "47 SONIYA" punch
  const dim = prog(t, T4.slam - .05, T4.slam + .1) * (1 - prog(t, T4.sheet - .2, T4.sheet));
  if (dim > 0) withAlpha(dim * .55, () => { ctx.fillStyle = '#021a14'; ctx.fillRect(0, 0, W, H); });
  shockwave(t, T4.slam, W / 2, 880, C.gold, 1100);
  sparks(t, T4.slam, W / 2, 880, 47, [C.gold, '#fff3c4', '#22e39a'], 40, 1250);
  slam(t, T4.slam, '47', W / 2, 820, 300, C.gold, { hold: 1.0, glow: 'rgba(255,200,61,.8)' });
  slam(t, T4.slam + .15, 'SONIYA', W / 2, 1030, 110, '#fff', { hold: .85, glow: 'rgba(255,200,61,.6)' });
  flash(t, T4.slam, '#fff3c4', .35, .5);
}

// ---------- SCENE 3 — Natija ----------
function icon(kind, x, y) {
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.lineJoin = 'round';
  if (kind === 'people') {
    for (const [dx, s] of [[-22, .8], [22, .8], [0, 1]]) {
      ctx.beginPath(); ctx.arc(x + dx, y - 14 * s, 14 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + dx, y + 26 * s, 24 * s, 18 * s, 0, Math.PI, 0); ctx.fill();
    }
  } else if (kind === 'box') {
    ctx.beginPath(); ctx.moveTo(x, y - 34); ctx.lineTo(x + 32, y - 18); ctx.lineTo(x + 32, y + 20); ctx.lineTo(x, y + 36); ctx.lineTo(x - 32, y + 20); ctx.lineTo(x - 32, y - 18); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 32, y - 18); ctx.lineTo(x, y - 2); ctx.lineTo(x + 32, y - 18); ctx.moveTo(x, y - 2); ctx.lineTo(x, y + 36); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(x, y + 32);
    ctx.bezierCurveTo(x - 50, y, x - 40, y - 40, x, y - 18); ctx.bezierCurveTo(x + 40, y - 40, x + 50, y, x, y + 32); ctx.fill();
  }
}
function iconBadge(bx, by, label, kind, p) {
  scaled(bx, by, p, () => {
    ctx.save(); ctx.shadowColor = 'rgba(255,200,61,.8)'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(bx, by, 92, 0, 7);
    const gg = ctx.createLinearGradient(bx - 92, by - 92, bx + 92, by + 92);
    gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#f5a524'); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 76, 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
    icon(kind, bx, by);
    text(label, bx, by + 145, 34, '#fff', 800, 'center');
  });
}
const IMPACTS3 = [[22.0, 26], [25.0, 16]];
function scene3(t) {
  const [sx, sy, sr] = shakeAt(t, IMPACTS3);
  camera(1 + .03 * eInOut(prog(t, 22, 27)), sr, sx, sy, () => {
    resultBg(t);
    bigClock(W / 2, 760, 560, 2 + (t - 22) * .02, Math.floor((t - 22) * 2) * 2, '#ffffff', .1);
    const out = eInOut(prog(t, 26.6, 27.3));
    withAlpha(1 - out, () => {
      withAlpha(prog(t, 22.3, 22.8), () => {
        text('NATIJA', W / 2, 190, 34, C.gold, 800, 'center');
        text('Vaqtingiz qaytdi', W / 2, 260, 60, '#fff', 800, 'center');
      });
      // time comparison
      const cp = eOut(prog(t, 22.4, 23.0)), x = 90, y = lerp(420, 350, cp), w = 900, h = 560;
      withAlpha(cp, () => {
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
        rr(x, y, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
        text('Bitta kampaniyaga ketgan vaqt', x + 50, y + 80, 32, C.ink, 800);
        const bw = w - 100;
        text('Oldin', x + 50, y + 160, 28, C.grey, 700);
        text('3 kun', x + w - 50, y + 160, 32, C.red, 900, 'right');
        rr(x + 50, y + 180, bw, 40, 20); ctx.fillStyle = '#fee2e2'; ctx.fill();
        rr(x + 50, y + 180, Math.max(40, bw * eOut(prog(t, 22.8, 23.6))), 40, 20); ctx.fillStyle = C.red; ctx.fill();
        text('ADUZ bilan', x + 50, y + 290, 28, '#065f46', 800);
        text('47 soniya', x + w - 50, y + 290, 32, '#059669', 900, 'right');
        rr(x + 50, y + 310, bw, 40, 20); ctx.fillStyle = '#dcfce7'; ctx.fill();
        const gp = eBack(prog(t, 23.6, 24.0));
        ctx.save(); ctx.shadowColor = '#22e39a'; ctx.shadowBlur = 20 + 14 * Math.sin(t * 8);
        rr(x + 50, y + 310, 40 * gp, 40, 20); ctx.fillStyle = '#16c784'; ctx.fill(); ctx.restore();
        const n = 5500 * eOut(prog(t, 23.9, 25.0));
        ctx.fillStyle = '#eef2f1'; ctx.fillRect(x + 50, y + 395, w - 100, 2);
        if (t > 23.8) withAlpha(prog(t, 23.8, 24.0), () => scaled(W / 2, y + 480, 1 + .12 * bump(t, 25.0, .4), () => {
          text(`${fmt(n)} barobar tezroq`, W / 2, y + 500, 64, '#059669', 900, 'center');
        }));
      });
      withAlpha(prog(t, 24.9, 25.3), () => text('Tejalgan vaqt — muhim ishlarga:', W / 2, 1035, 36, '#fff', 800, 'center'));
      [['Mijozlar', 'people'], ['Mahsulot', 'box'], ['Oila', 'heart']].forEach(([l, k], i) => {
        const p = eBack(prog(t, 25.2 + i * .25, 25.65 + i * .25));
        if (p > 0) iconBadge(230 + i * 310, 1190, l, k, p);
      });
    });
  });
  shockwave(t, 25.0, W / 2, 830, C.gold, 900);
  sparks(t, 25.0, W / 2, 830, 55, [C.gold, '#fff', '#22e39a'], 34, 1100);
  confetti(t, 25.0);
  endCard(t, 27.0);
}

boot({
  scene1, scene2, scene3, captions: CAPTIONS,
  transitions: [
    { a: 10.55, b: 11.0, fn: (t, a, b, A, B) => clockWipe(t, a, b, A, B, '#22e39a') },
    { a: 21.75, b: 22.25, fn: zoomThrough },
  ],
  overlay: t => { filmLook(t); flash(t, 11.0, '#ffffff', .3, .55); },
});
</script>
