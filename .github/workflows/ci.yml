# Continuous integration: backend tests (SQLite + PostgreSQL), frontend lint/types/build,
# compose file validation and the production Docker images.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muxriddin
          POSTGRES_PASSWORD: muxriddin_ci
          POSTGRES_DB: muxriddin_suite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muxriddin -d muxriddin_suite"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Create the (empty) migration test database
        env:
          PGPASSWORD: muxriddin_ci
        run: psql -h localhost -U muxriddin -d muxriddin_suite -c "CREATE DATABASE muxriddin_test"
      # Default suite on SQLite, plus the PostgreSQL migration up/down test.
      - name: Tests (SQLite + PostgreSQL migrations)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://muxriddin:muxriddin_ci@localhost:5432/muxriddin_test
        run: python -m pytest -q
      # Whole suite on PostgreSQL (includes the concurrent-approval tests).
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://muxriddin:muxriddin_ci@localhost:5432/muxriddin_suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      # After the build, which generates next-env.d.ts.
      - run: npx tsc --noEmit

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml (development)
        run: |
          cp .env.example .env
          docker compose config -q
      - name: docker-compose.prod.yml (production)
        env:
          ENV_FILE: .env.production.example
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image tests
        run: |
          docker build -f docker/backend.prod.Dockerfile --target test -t muxriddin-backend:test .
          docker run --rm muxriddin-backend:test
      - name: Backend production image
        run: docker build -f docker/backend.prod.Dockerfile -t muxriddin-backend:ci .
      - name: Frontend production image
        run: docker build -f docker/frontend.prod.Dockerfile -t muxriddin-frontend:ci .
